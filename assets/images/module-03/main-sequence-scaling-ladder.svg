<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="light" data-palette="aurora">
  <title id="title">Scaling ladder from structure equations to mass-luminosity relation</title>
  <desc id="desc">A left-to-right ladder of four boxes showing rho proportional to M over R cubed, central pressure proportional to G M squared over R to the fourth, central temperature proportional to M over R, and luminosity proportional to M cubed over kappa. A lower branch adds the nuclear lifetime scaling tau proportional to M over L.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pink)"/>
    </marker>
  </defs>
  <style>
    svg {
      --teal: #028391;
      --pink: #be5a83;
      --violet: #7077a1;
      --bg: #ffffff;
      --panel: #f2f3fb;
      --fg: #111218;
      --muted: #3a3d52;
      --faint: #666b85;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
    }
    .title { fill: var(--fg); font-size: 28px; font-weight: 700; }
    .subtitle { fill: var(--muted); font-size: 16px; }
    .step { fill: var(--panel); stroke: var(--teal); stroke-width: 3; }
    .step-title { fill: var(--fg); font-size: 20px; font-weight: 700; text-anchor: middle; }
    .step-eq { fill: var(--teal); font-size: 22px; font-weight: 700; text-anchor: middle; }
    .step-body { fill: var(--muted); font-size: 15px; text-anchor: middle; }
    .arrow { stroke: var(--teal); stroke-width: 4; fill: none; marker-end: url(#arrow-teal); }
    .arrow-text { fill: var(--faint); font-size: 14px; text-anchor: middle; }
    .life-box { fill: #fbf8fd; stroke: var(--pink); stroke-width: 3; }
    .life-title { fill: var(--pink); font-size: 19px; font-weight: 700; text-anchor: middle; }
    .life-eq { fill: var(--pink); font-size: 22px; font-weight: 700; text-anchor: middle; }
    .life-arrow { stroke: var(--pink); stroke-width: 4; fill: none; marker-end: url(#arrow-pink); }
    .footer { fill: #eef8f9; stroke: var(--violet); stroke-width: 3; }
    .footer-title { fill: var(--violet); font-size: 18px; font-weight: 700; }
    .footer-text { fill: var(--fg); font-size: 17px; }
  </style>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <text x="40" y="42" class="title">Scaling Ladder: Why the Main Sequence Is Steep</text>
  <text x="40" y="68" class="subtitle">Mass sets the gravity scale, gravity sets the temperature scale, and radiative transport drives luminosity upward very quickly.</text>

  <rect x="34" y="145" width="190" height="132" rx="20" class="step"/>
  <text x="129" y="178" class="step-title">1. Density scale</text>
  <text x="129" y="214" class="step-eq">rho ~ M / R^3</text>
  <text x="129" y="239" class="step-body">Mass conservation</text>
  <text x="129" y="261" class="step-body">turns one star into a</text>
  <text x="129" y="283" class="step-body">mean-density estimate.</text>

  <rect x="260" y="145" width="190" height="132" rx="20" class="step"/>
  <text x="355" y="178" class="step-title">2. Pressure scale</text>
  <text x="355" y="214" class="step-eq">P_c ~ G M^2 / R^4</text>
  <text x="355" y="239" class="step-body">Hydrostatic balance</text>
  <text x="355" y="261" class="step-body">tells us how hard the</text>
  <text x="355" y="283" class="step-body">core must push back.</text>

  <rect x="486" y="145" width="190" height="132" rx="20" class="step"/>
  <text x="581" y="178" class="step-title">3. Temperature scale</text>
  <text x="581" y="214" class="step-eq">T_c ~ M / R</text>
  <text x="581" y="239" class="step-body">The ideal-gas law</text>
  <text x="581" y="261" class="step-body">turns pressure support</text>
  <text x="581" y="283" class="step-body">into a core temperature.</text>

  <rect x="712" y="145" width="214" height="132" rx="20" class="step"/>
  <text x="819" y="178" class="step-title">4. Luminosity scale</text>
  <text x="819" y="214" class="step-eq">L ~ M^3 / kappa</text>
  <text x="819" y="239" class="step-body">Radiative transport</text>
  <text x="819" y="261" class="step-body">forces a steep outward</text>
  <text x="819" y="283" class="step-body">energy flow.</text>

  <line x1="224" y1="211" x2="260" y2="211" class="arrow"/>
  <line x1="450" y1="211" x2="486" y2="211" class="arrow"/>
  <line x1="676" y1="211" x2="712" y2="211" class="arrow"/>

  <text x="242" y="196" class="arrow-text">mass conservation</text>
  <text x="468" y="196" class="arrow-text">hydrostatic + EOS</text>
  <text x="694" y="196" class="arrow-text">radiative diffusion</text>

  <rect x="562" y="342" width="332" height="102" rx="22" class="life-box"/>
  <text x="728" y="372" class="life-title">Lifetime consequence</text>
  <text x="728" y="403" class="life-eq">tau_nuc ~ M / L</text>
  <text x="728" y="427" class="step-body">Fuel rises linearly with mass, but burn rate rises much faster.</text>

  <path d="M 819 277 C 819 320, 785 330, 760 342" class="life-arrow"/>
  <text x="842" y="327" class="arrow-text">burn rate</text>

  <rect x="34" y="342" width="478" height="102" rx="22" class="footer"/>
  <text x="56" y="374" class="footer-title">What to notice</text>
  <text x="56" y="403" class="footer-text">The mass-luminosity relation is the end of a reasoning chain.</text>
  <text x="56" y="427" class="footer-text">Each step is physically motivated, so the steep slope is a structural consequence, not a memorized empirical rule.</text>
</svg>
