<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="light" data-palette="aurora">
  <title id="title">Convection as a stability problem</title>
  <desc id="desc">Two side-by-side panels compare a stable radiative layer with a convectively unstable layer. In the stable panel, an upward-displaced parcel cools adiabatically and ends up cooler than the surroundings, so it sinks. In the unstable panel, the surroundings cool more quickly than the parcel, so the parcel stays warmer and keeps rising. Small line plots compare the parcel and surroundings temperature gradients.</desc>
  <defs>
    <linearGradient id="column-gradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d7eff2"/>
      <stop offset="100%" stop-color="#ffd6bf"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pink)"/>
    </marker>
  </defs>
  <style>
    svg {
      --teal: #028391;
      --pink: #be5a83;
      --violet: #7077a1;
      --bg: #ffffff;
      --panel: #f2f3fb;
      --fg: #111218;
      --muted: #3a3d52;
      --faint: #666b85;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
    }
    .title { fill: var(--fg); font-size: 28px; font-weight: 700; }
    .subtitle { fill: var(--muted); font-size: 16px; }
    .panel { fill: var(--panel); stroke: var(--violet); stroke-width: 3; }
    .panel-title { fill: var(--fg); font-size: 22px; font-weight: 700; text-anchor: middle; }
    .panel-sub { fill: var(--muted); font-size: 15px; text-anchor: middle; }
    .column { fill: url(#column-gradient); stroke: var(--teal); stroke-width: 3; }
    .parcel { fill: var(--pink); stroke: #8e4462; stroke-width: 2.5; }
    .ambient { fill: #8dd3dd; stroke: var(--teal); stroke-width: 2.5; }
    .label { fill: var(--fg); font-size: 15px; }
    .small { fill: var(--muted); font-size: 14px; }
    .rise { stroke: var(--teal); stroke-width: 4; fill: none; marker-end: url(#arrow-teal); }
    .sink { stroke: var(--pink); stroke-width: 4; fill: none; marker-end: url(#arrow-pink); }
    .plot-axis { stroke: var(--faint); stroke-width: 2; }
    .parcel-line { stroke: var(--pink); stroke-width: 4; fill: none; }
    .env-line { stroke: var(--teal); stroke-width: 4; fill: none; }
    .criterion { fill: var(--violet); font-size: 18px; font-weight: 700; text-anchor: middle; }
    .footer { fill: #eef8f9; stroke: var(--pink); stroke-width: 3; }
    .footer-title { fill: var(--pink); font-size: 18px; font-weight: 700; }
    .footer-text { fill: var(--fg); font-size: 17px; }
  </style>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <text x="40" y="42" class="title">Convection Begins When a Displaced Parcel Stays Buoyant</text>
  <text x="40" y="68" class="subtitle">The key comparison is between adiabatic parcel cooling and the background radiative gradient, not simply whether the gas is hot.</text>

  <rect x="42" y="112" width="408" height="320" rx="24" class="panel"/>
  <rect x="510" y="112" width="408" height="320" rx="24" class="panel"/>

  <text x="246" y="146" class="panel-title">Stable radiative layer</text>
  <text x="246" y="170" class="panel-sub">The parcel cools more than the surroundings, so it becomes denser and sinks back.</text>
  <text x="714" y="146" class="panel-title">Convectively unstable layer</text>
  <text x="714" y="170" class="panel-sub">The surroundings cool more steeply, so the parcel stays warmer and keeps rising.</text>

  <rect x="86" y="196" width="110" height="182" rx="18" class="column"/>
  <rect x="554" y="196" width="110" height="182" rx="18" class="column"/>
  <text x="141" y="392" class="small" text-anchor="middle">lower layer hotter</text>
  <text x="609" y="392" class="small" text-anchor="middle">lower layer hotter</text>

  <circle cx="141" cy="338" r="18" class="parcel"/>
  <circle cx="141" cy="254" r="18" class="parcel"/>
  <circle cx="171" cy="254" r="14" class="ambient"/>
  <path d="M 141 320 L 141 275" class="rise"/>
  <path d="M 187 254 C 220 254, 220 320, 165 338" class="sink"/>
  <text x="214" y="246" class="label">surroundings warmer</text>
  <text x="214" y="265" class="small">T_parcel &lt; T_env</text>
  <text x="204" y="338" class="label">parcel sinks</text>
  <text x="204" y="357" class="small">negative buoyancy</text>

  <circle cx="609" cy="338" r="18" class="parcel"/>
  <circle cx="609" cy="254" r="18" class="parcel"/>
  <circle cx="639" cy="254" r="14" class="ambient"/>
  <path d="M 609 320 L 609 275" class="rise"/>
  <path d="M 655 254 C 700 250, 725 220, 745 208" class="rise"/>
  <text x="700" y="244" class="label">parcel warmer</text>
  <text x="700" y="263" class="small">T_parcel &gt; T_env</text>
  <text x="708" y="318" class="label">parcel keeps rising</text>
  <text x="708" y="337" class="small">positive buoyancy</text>

  <line x1="262" y1="360" x2="262" y2="214" class="plot-axis"/>
  <line x1="262" y1="360" x2="414" y2="360" class="plot-axis"/>
  <text x="338" y="382" class="small" text-anchor="middle">temperature</text>
  <text x="244" y="286" class="small" transform="rotate(-90 244 286)">height</text>
  <path d="M 392 342 L 304 234" class="parcel-line"/>
  <path d="M 382 342 L 332 234" class="env-line"/>
  <text x="364" y="226" class="small">parcel</text>
  <text x="332" y="214" class="small">surroundings</text>
  <text x="338" y="198" class="criterion">nabla_rad &lt; nabla_ad</text>

  <line x1="730" y1="360" x2="730" y2="214" class="plot-axis"/>
  <line x1="730" y1="360" x2="882" y2="360" class="plot-axis"/>
  <text x="806" y="382" class="small" text-anchor="middle">temperature</text>
  <text x="712" y="286" class="small" transform="rotate(-90 712 286)">height</text>
  <path d="M 860 342 L 772 234" class="parcel-line"/>
  <path d="M 850 342 L 784 214" class="env-line"/>
  <text x="842" y="226" class="small">parcel</text>
  <text x="792" y="204" class="small">surroundings</text>
  <text x="806" y="198" class="criterion">nabla_rad &gt; nabla_ad</text>

  <rect x="40" y="456" width="880" height="58" rx="18" class="footer"/>
  <text x="62" y="490" class="footer-title">What to notice</text>
  <text x="208" y="490" class="footer-text">Convection is a stability test: compare the parcel's adiabatic cooling to the background radiative gradient. If the parcel stays warmer, radiation alone cannot keep the layer stable.</text>
</svg>
