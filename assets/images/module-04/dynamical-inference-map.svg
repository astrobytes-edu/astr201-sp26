<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Observable model inference map for dynamical mass measurements</title>
  <desc id="desc">A four-row concept map showing S-star orbits, galaxy rotation curves, Bullet Cluster lensing, and the cosmic web as different examples of observable, gravitational model, and inferred mass distribution.</desc>
  <defs>
    <style>
      :root {
        --bg: #fbfaf7;
        --ink: #17161a;
        --muted: #55515d;
        --grid: #ded8cf;
        --panel: #ffffff;
        --teal: #257180;
        --teal-soft: #dceef0;
        --pink: #a35c7a;
        --pink-soft: #f3e2ea;
        --violet: #655d8a;
        --violet-soft: #e7e4f0;
        --gold: #b4832f;
        --gold-soft: #f4ead6;
      }
      .bg { fill: var(--bg); }
      .title { fill: var(--ink); font: 700 29px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: var(--muted); font: 500 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .head { fill: var(--ink); font: 800 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .5px; }
      .row-label { fill: var(--ink); font: 800 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: var(--ink); font: 560 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: var(--muted); font: 500 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .panel { fill: var(--panel); stroke: var(--grid); stroke-width: 1.5; }
      .obs { fill: var(--teal-soft); stroke: var(--teal); }
      .model { fill: var(--violet-soft); stroke: var(--violet); }
      .infer { fill: var(--pink-soft); stroke: var(--pink); }
      .scale { fill: var(--gold-soft); stroke: var(--gold); }
      .arrow { stroke: #6b6670; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .badge { fill: #ffffff; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#6b6670"/>
    </marker>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <text x="480" y="44" text-anchor="middle" class="title">One reasoning pattern, many scales</text>
  <text x="480" y="72" text-anchor="middle" class="subtitle">Astronomers measure a tracer, apply gravity, and infer mass that light alone may not show.</text>

  <text x="245" y="116" text-anchor="middle" class="head">OBSERVABLE</text>
  <text x="480" y="116" text-anchor="middle" class="head">GRAVITY MODEL</text>
  <text x="715" y="116" text-anchor="middle" class="head">INFERENCE</text>

  <g transform="translate(40,138)">
    <rect class="panel scale" x="0" y="0" width="130" height="68" rx="12"/>
    <text x="65" y="28" text-anchor="middle" class="row-label">Galactic</text>
    <text x="65" y="50" text-anchor="middle" class="small">center</text>
    <rect class="panel obs" x="150" y="0" width="190" height="68" rx="12"/>
    <text x="245" y="28" text-anchor="middle" class="body">S-star positions</text>
    <text x="245" y="50" text-anchor="middle" class="small">changing over years</text>
    <path class="arrow" d="M 344 34 H 372"/>
    <rect class="panel model" x="385" y="0" width="190" height="68" rx="12"/>
    <text x="480" y="28" text-anchor="middle" class="body">Keplerian orbit</text>
    <text x="480" y="50" text-anchor="middle" class="small">around compact mass</text>
    <path class="arrow" d="M 579 34 H 607"/>
    <rect class="panel infer" x="620" y="0" width="260" height="68" rx="12"/>
    <text x="750" y="28" text-anchor="middle" class="body">4 million solar masses</text>
    <text x="750" y="50" text-anchor="middle" class="small">inside a tiny region</text>
  </g>

  <g transform="translate(40,224)">
    <rect class="panel scale" x="0" y="0" width="130" height="68" rx="12"/>
    <text x="65" y="28" text-anchor="middle" class="row-label">Spiral</text>
    <text x="65" y="50" text-anchor="middle" class="small">galaxies</text>
    <rect class="panel obs" x="150" y="0" width="190" height="68" rx="12"/>
    <text x="245" y="28" text-anchor="middle" class="body">Rotation curve</text>
    <text x="245" y="50" text-anchor="middle" class="small">speed vs radius</text>
    <path class="arrow" d="M 344 34 H 372"/>
    <rect class="panel model" x="385" y="0" width="190" height="68" rx="12"/>
    <text x="480" y="28" text-anchor="middle" class="body">Circular motion</text>
    <text x="480" y="50" text-anchor="middle" class="small">M(&lt;r) = r v^2 / G</text>
    <path class="arrow" d="M 579 34 H 607"/>
    <rect class="panel infer" x="620" y="0" width="260" height="68" rx="12"/>
    <text x="750" y="28" text-anchor="middle" class="body">Extended halo</text>
    <text x="750" y="50" text-anchor="middle" class="small">mass beyond light</text>
  </g>

  <g transform="translate(40,310)">
    <rect class="panel scale" x="0" y="0" width="130" height="68" rx="12"/>
    <text x="65" y="28" text-anchor="middle" class="row-label">Cluster</text>
    <text x="65" y="50" text-anchor="middle" class="small">collision</text>
    <rect class="panel obs" x="150" y="0" width="190" height="68" rx="12"/>
    <text x="245" y="28" text-anchor="middle" class="body">Gas plus lensing</text>
    <text x="245" y="50" text-anchor="middle" class="small">spatial offset</text>
    <path class="arrow" d="M 344 34 H 372"/>
    <rect class="panel model" x="385" y="0" width="190" height="68" rx="12"/>
    <text x="480" y="28" text-anchor="middle" class="body">Collisional gas</text>
    <text x="480" y="50" text-anchor="middle" class="small">collisionless mass</text>
    <path class="arrow" d="M 579 34 H 607"/>
    <rect class="panel infer" x="620" y="0" width="260" height="68" rx="12"/>
    <text x="750" y="28" text-anchor="middle" class="body">Most mass is not gas</text>
    <text x="750" y="50" text-anchor="middle" class="small">lensing traces total mass</text>
  </g>

  <g transform="translate(40,396)">
    <rect class="panel scale" x="0" y="0" width="130" height="68" rx="12"/>
    <text x="65" y="28" text-anchor="middle" class="row-label">Cosmic</text>
    <text x="65" y="50" text-anchor="middle" class="small">web</text>
    <rect class="panel obs" x="150" y="0" width="190" height="68" rx="12"/>
    <text x="245" y="28" text-anchor="middle" class="body">Galaxy map</text>
    <text x="245" y="50" text-anchor="middle" class="small">filaments and voids</text>
    <path class="arrow" d="M 344 34 H 372"/>
    <rect class="panel model" x="385" y="0" width="190" height="68" rx="12"/>
    <text x="480" y="28" text-anchor="middle" class="body">Structure growth</text>
    <text x="480" y="50" text-anchor="middle" class="small">gravity over time</text>
    <path class="arrow" d="M 579 34 H 607"/>
    <rect class="panel infer" x="620" y="0" width="260" height="68" rx="12"/>
    <text x="750" y="28" text-anchor="middle" class="body">Matter scaffolding</text>
    <text x="750" y="50" text-anchor="middle" class="small">galaxies trace the web</text>
  </g>

  <rect x="118" y="486" width="724" height="34" rx="17" fill="#ffffff" stroke="#d8d2c8"/>
  <text x="480" y="509" text-anchor="middle" class="small">Key idea: different observations can support one coherent gravitational inference.</text>
</svg>
