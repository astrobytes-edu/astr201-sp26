<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Solar System Keplerian Rotation Curve</title>
  <desc id="desc">Teaching plot showing that orbital speed decreases with distance in a central-mass system like the Solar System. The curve falls outward because the Sun contains nearly all of the enclosed mass.</desc>
  <defs>
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #13162a;
        --fg: #eef0ff;
        --muted: #c9cbe5;
        --faint: #8f92ad;
        --grid: #24263a;
        --teal: #028391;
        --teal-bright: #41A2AC;
        --pink: #BE5A83;
        --pink-bright: #CE83A2;
        --violet: #7077A1;
        --violet-bright: #9499B8;
        --gold: #D9A441;
      }
      .bg { fill: var(--bg); }
      .panel { fill: var(--panel); stroke: var(--violet); stroke-width: 2.4; rx: 18; }
      .grid { stroke: var(--grid); stroke-width: 1.2; }
      .axis { stroke: var(--muted); stroke-width: 3; fill: none; marker-end: url(#axisArrow); }
      .curve { stroke: var(--gold); stroke-width: 5; fill: none; stroke-linecap: round; }
      .guide { stroke: var(--violet-bright); stroke-width: 2.5; fill: none; stroke-dasharray: 8 9; opacity: 0.8; }
      .point { fill: var(--teal-bright); stroke: var(--bg); stroke-width: 4; }
      .point-hot { fill: var(--pink-bright); stroke: var(--bg); stroke-width: 4; }
      .sun { fill: var(--gold); stroke: var(--bg); stroke-width: 5; }
      .title { fill: var(--fg); font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: var(--muted); font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: var(--fg); font: 700 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: var(--muted); font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { fill: var(--faint); font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .footer { fill: var(--muted); font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .outline { paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
    </style>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9cbe5"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="540"/>

  <text x="480" y="44" text-anchor="middle" class="title">Solar-System Rotation Curve</text>
  <text x="480" y="72" text-anchor="middle" class="subtitle">If most mass is central, orbital speed falls with distance</text>

  <rect x="82" y="104" width="612" height="330" class="panel"/>
  <g>
    <path class="grid" d="M170 150 V378"/>
    <path class="grid" d="M270 150 V378"/>
    <path class="grid" d="M370 150 V378"/>
    <path class="grid" d="M470 150 V378"/>
    <path class="grid" d="M570 150 V378"/>
    <path class="grid" d="M145 330 H650"/>
    <path class="grid" d="M145 280 H650"/>
    <path class="grid" d="M145 230 H650"/>
    <path class="grid" d="M145 180 H650"/>
  </g>

  <path class="axis" d="M145 378 H655"/>
  <path class="axis" d="M145 378 V145"/>
  <text x="400" y="416" text-anchor="middle" class="small">Distance from Sun</text>
  <text x="54" y="264" text-anchor="middle" class="small" transform="rotate(-90 54 264)">Orbital speed</text>

  <path class="curve" d="M174 168 C235 216 308 260 408 303 C488 337 568 356 635 368"/>
  <text x="320" y="168" class="label outline">Keplerian decline</text>
  <text x="320" y="194" class="tiny outline">Speed decreases outward</text>

  <circle class="point-hot" cx="184" cy="172" r="9"/>
  <circle class="point" cx="230" cy="211" r="8"/>
  <circle class="point" cx="268" cy="230" r="8"/>
  <circle class="point" cx="314" cy="258" r="8"/>
  <circle class="point-hot" cx="430" cy="312" r="9"/>
  <circle class="point" cx="495" cy="338" r="8"/>
  <circle class="point" cx="570" cy="356" r="8"/>
  <circle class="point" cx="628" cy="366" r="8"/>

  <text x="190" y="146" class="tiny outline">Mercury</text>
  <text x="278" y="226" class="tiny outline">Earth</text>
  <text x="442" y="305" class="tiny outline">Jupiter</text>
  <text x="612" y="350" class="tiny outline">Neptune</text>

  <rect x="724" y="116" width="190" height="260" class="panel"/>
  <circle class="sun" cx="760" cy="160" r="18"/>
  <text x="792" y="154" class="label">Sun</text>
  <text x="792" y="178" class="label">dominates</text>
  <text x="744" y="220" class="small">Almost all the</text>
  <text x="744" y="242" class="small">mass is inside</text>
  <text x="744" y="264" class="small">every planet's</text>
  <text x="744" y="286" class="small">orbit.</text>
  <path class="guide" d="M750 318 C790 294 848 294 892 318"/>
  <text x="744" y="338" class="tiny">So the prediction is:</text>
  <text x="744" y="358" class="tiny">farther means slower.</text>

  <rect x="92" y="458" width="776" height="54" class="panel"/>
  <text x="480" y="481" text-anchor="middle" class="footer">What to notice: this is the prediction that fails for spiral galaxies.</text>
  <text x="480" y="502" text-anchor="middle" class="footer">Flat galaxy rotation curves imply extra mass at large radius.</text>
</svg>
