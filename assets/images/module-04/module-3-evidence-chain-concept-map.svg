<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Module 3 Evidence Chain Concept Map</title>
  <desc id="desc">Concept map for ASTR 101 Module 3 with five evidence chains. Dust maps, 21-cm emission, S-star orbits, galaxy shapes, standard-candle measurements, redshifts, AGN signatures, CMB anisotropies, and light-element abundances are translated by physical models into inferences about the Milky Way, dark matter, Sgr A star, galaxy histories, cosmic expansion, quasars, and the hot Big Bang.</desc>
  <defs>
    <style>
      :root {
        --bg: #0b0b0f;
        --panel: #13162a;
        --panel2: #181c34;
        --fg: #eef0ff;
        --muted: #c9cbe5;
        --grid: #24263a;
        --teal: #028391;
        --teal-bright: #41A2AC;
        --pink: #BE5A83;
        --pink-bright: #CE83A2;
        --violet: #7077A1;
        --violet-bright: #9499B8;
        --gold: #D9A441;
      }
      .bg { fill: var(--bg); }
      .grid { stroke: var(--grid); stroke-width: 1; opacity: 0.34; }
      .title { fill: var(--fg); font: 700 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: var(--muted); font: 500 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .header { fill: var(--fg); font: 700 21px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: var(--fg); font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body-muted { fill: var(--muted); font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .prompt { fill: var(--fg); font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .footer { fill: var(--muted); font: 600 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .col { fill: var(--panel); stroke-width: 2.4; rx: 18; }
      .obs { stroke: var(--teal-bright); }
      .model { stroke: var(--violet-bright); }
      .inf { stroke: var(--pink-bright); }
      .obs-row { fill: rgba(2, 131, 145, 0.22); stroke: rgba(65, 162, 172, 0.72); }
      .model-row { fill: rgba(112, 119, 161, 0.22); stroke: rgba(148, 153, 184, 0.72); }
      .inf-row { fill: rgba(190, 90, 131, 0.22); stroke: rgba(206, 131, 162, 0.72); }
      .row { stroke-width: 1.4; rx: 11; }
      .prompt-box { fill: rgba(217, 164, 65, 0.16); stroke: var(--gold); stroke-width: 2; rx: 18; }
      .footer-box { fill: var(--panel2); stroke: var(--gold); stroke-width: 2.4; rx: 18; }
      .arrow-teal { stroke: var(--teal-bright); stroke-width: 3; fill: none; marker-end: url(#arrowTeal); }
      .arrow-pink { stroke: var(--pink-bright); stroke-width: 3; fill: none; marker-end: url(#arrowPink); }
    </style>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#41A2AC"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CE83A2"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540"/>
  <g>
    <path class="grid" d="M62 126 H898"/>
    <path class="grid" d="M62 227 H898"/>
    <path class="grid" d="M62 328 H898"/>
    <path class="grid" d="M62 429 H898"/>
    <path class="grid" d="M320 118 V460"/>
    <path class="grid" d="M640 118 V460"/>
  </g>

  <text x="480" y="42" text-anchor="middle" class="title">Module 3 Evidence Chain</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Maps, galaxies, and cosmology turn limited signals into physical histories</text>

  <g>
    <rect x="105" y="84" width="750" height="38" class="prompt-box"/>
    <text x="480" y="109" text-anchor="middle" class="prompt">Ask every time: What do we observe? What model translates it? What claim follows?</text>
  </g>

  <g>
    <rect x="36" y="136" width="270" height="318" class="col obs"/>
    <rect x="345" y="136" width="270" height="318" class="col model"/>
    <rect x="654" y="136" width="270" height="318" class="col inf"/>
    <text x="171" y="164" text-anchor="middle" class="header">Observables</text>
    <text x="480" y="164" text-anchor="middle" class="header">Models</text>
    <text x="789" y="164" text-anchor="middle" class="header">Inferences</text>
  </g>

  <g>
    <rect x="54" y="178" width="234" height="46" class="row obs-row"/>
    <rect x="363" y="178" width="234" height="46" class="row model-row"/>
    <rect x="672" y="178" width="234" height="46" class="row inf-row"/>
    <text x="72" y="198" class="body">Dust, 21-cm gas,</text>
    <text x="72" y="217" class="body">and S-star orbits</text>
    <text x="381" y="198" class="body">Mapping plus</text>
    <text x="381" y="217" class="body">Newtonian gravity</text>
    <text x="690" y="198" class="body">Milky Way structure,</text>
    <text x="690" y="217" class="body">dark matter, Sgr A*</text>
    <path class="arrow-teal" d="M288 201 H358"/>
    <path class="arrow-pink" d="M597 201 H667"/>
  </g>

  <g>
    <rect x="54" y="232" width="234" height="46" class="row obs-row"/>
    <rect x="363" y="232" width="234" height="46" class="row model-row"/>
    <rect x="672" y="232" width="234" height="46" class="row inf-row"/>
    <text x="72" y="252" class="body">Shapes, colors,</text>
    <text x="72" y="271" class="body">gas, and dust</text>
    <text x="381" y="252" class="body">Stellar populations</text>
    <text x="381" y="271" class="body">and gas physics</text>
    <text x="690" y="252" class="body">Star formation</text>
    <text x="690" y="271" class="body">and merger histories</text>
    <path class="arrow-teal" d="M288 255 H358"/>
    <path class="arrow-pink" d="M597 255 H667"/>
  </g>

  <g>
    <rect x="54" y="286" width="234" height="46" class="row obs-row"/>
    <rect x="363" y="286" width="234" height="46" class="row model-row"/>
    <rect x="672" y="286" width="234" height="46" class="row inf-row"/>
    <text x="72" y="306" class="body">Cepheids, SNe,</text>
    <text x="72" y="325" class="body">and redshifts</text>
    <text x="381" y="306" class="body">Distance ladder</text>
    <text x="381" y="325" class="body">and Hubble law</text>
    <text x="690" y="306" class="body">Distances, expansion,</text>
    <text x="690" y="325" class="body">and cosmic web</text>
    <path class="arrow-teal" d="M288 309 H358"/>
    <path class="arrow-pink" d="M597 309 H667"/>
  </g>

  <g>
    <rect x="54" y="340" width="234" height="46" class="row obs-row"/>
    <rect x="363" y="340" width="234" height="46" class="row model-row"/>
    <rect x="672" y="340" width="234" height="46" class="row inf-row"/>
    <text x="72" y="360" class="body">AGN spectra, jets,</text>
    <text x="72" y="379" class="body">and variability</text>
    <text x="381" y="360" class="body">Black-hole</text>
    <text x="381" y="379" class="body">accretion</text>
    <text x="690" y="360" class="body">Quasars and</text>
    <text x="690" y="379" class="body">SMBH growth</text>
    <path class="arrow-teal" d="M288 363 H358"/>
    <path class="arrow-pink" d="M597 363 H667"/>
  </g>

  <g>
    <rect x="54" y="394" width="234" height="46" class="row obs-row"/>
    <rect x="363" y="394" width="234" height="46" class="row model-row"/>
    <rect x="672" y="394" width="234" height="46" class="row inf-row"/>
    <text x="72" y="414" class="body">CMB anisotropies</text>
    <text x="72" y="433" class="body">and light elements</text>
    <text x="381" y="414" class="body">Recombination</text>
    <text x="381" y="433" class="body">and nuclear reactions</text>
    <text x="690" y="414" class="body">Hot Big Bang</text>
    <text x="690" y="433" class="body">and recycled atoms</text>
    <path class="arrow-teal" d="M288 417 H358"/>
    <path class="arrow-pink" d="M597 417 H667"/>
  </g>

  <g>
    <rect x="76" y="474" width="808" height="46" class="footer-box"/>
    <text x="480" y="493" text-anchor="middle" class="footer">Module 3 skill: read the sky as evidence.</text>
    <text x="480" y="513" text-anchor="middle" class="footer">A signal becomes physics only after a model, a scale, and a check against alternatives.</text>
  </g>
</svg>
