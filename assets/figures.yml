# Figure Registry - Single Source of Truth
# Usage: {{< fig figure-id >}} or {{< fig figure-id caption="Custom" >}}
#
# Each figure entry has:
#   path: path from project root (use /assets/images/...)
#   caption: default caption text
#   alt: accessibility text for screen readers
#   credit: attribution/source (optional)
#   module: which module uses this primarily (optional, for organization)

figures:
  # ==============================================================
  # Common/shared figures (used across multiple modules)
  # ==============================================================

  hr-diagram:
    path: /assets/images/common/hr-diagram.png
    caption: "The Hertzsprung-Russell Diagram showing stellar classification"
    alt: "H-R diagram plotting luminosity vs temperature for stars"
    credit: "ESO"

  blackbody-curves:
    path: /assets/images/common/blackbody-curves.png
    caption: "Blackbody radiation curves at different temperatures"
    alt: "Graph showing Planck curves for various temperatures"

  stellar-lifecycle:
    path: /assets/images/common/stellar-lifecycle.png
    caption: "Life cycle of stars of different masses"
    alt: "Diagram showing evolutionary paths for low and high mass stars"

  electromagnetic-spectrum:
    path: /assets/images/common/em-spectrum.png
    caption: "The electromagnetic spectrum from radio to gamma rays"
    alt: "Diagram showing wavelength ranges of electromagnetic radiation"

  jwst-em-spectrum:
    path: /assets/images/common/jwst-em-spectrum-ir.png
    caption: "What to notice: different wavelength bands are different information channels; infrared sits just beyond visible light."
    alt: "Graphic of the electromagnetic spectrum labeled gamma, X-ray, ultraviolet, visible, infrared, microwave, and radio, with a highlighted visible band and an extended infrared region; includes sketches of several space telescopes."
    credit: "JWST/STScI"

  jwst-vs-hst-ngc1566:
    path: /assets/images/common/NGC1566-jwst-vs-hst.jpg
    caption: "What to notice: the same galaxy can look dramatically different in different bands; dust that hides structure in one band may become transparent in another."
    alt: "Side-by-side comparison of a spiral galaxy in two different views, showing differing levels of detail and dust structure between the images."
    credit: "JWST/STScI"

  jwst-vs-hst-arp142:
    path: /assets/images/common/Arp142-penguin-jwst-vs-hst.jpg
    caption: "What to notice: changing wavelength reveals different components of the same system (stars, dust, and gas), not a different object."
    alt: "Side-by-side comparison of a galaxy system in two different views, where one image emphasizes stars and the other emphasizes dust and infrared-bright regions."
    credit: "JWST/STScI"

  milky-way-panoramic:
    path: /assets/images/common/eso-milky-way-panoramic.jpg
    caption: "What to notice: even a ‘pretty picture’ is a measurement—brightness and color patterns carry physical information."
    alt: "Wide panoramic view of the Milky Way band stretching across a dark night sky, with many stars and dark dust lanes."

  cosmic-cliffs-jwst:
    path: /assets/images/common/cosmic-cliffs-jwst.png
    caption: "What to notice: even a dramatic nebula image is data — color and brightness patterns encode physical differences."
    alt: "Colorful nebula scene with bright blue ridges, orange-brown dust clouds, and scattered stars."
    credit: "JWST/STScI"

  # ==============================================================
  # Module 1: Foundations
  # ==============================================================

  night-sky:
    path: /assets/images/common/noirlab-nightsky-mosaic.jpg
    caption: "The night sky filled with stars"
    alt: "Photograph of the night sky showing many stars as points of light"
    credit: "NOIRLab"
    module: 1

  fundamental-dimensions:
    path: /assets/images/module-01/fundamental-dims-nblm.png
    caption: "The Fundamental Alphabet: constructing physics from [M], [L], and [T]"
    alt: "Visual equation builder showing how Mass [M], Length [L], and Time [T] combine like building blocks: Velocity = L/T → [L][T]^-1, Acceleration = velocity/time → [L][T]^-2, Force = mass × acceleration → [M][L][T]^-2, Energy = force × distance → [M][L]²[T]^-2. Includes sanity check: if your energy calculation has dimensions [M][L][T]^-1, you missed a velocity term."
    credit: "Course illustration (A. Rosen)"
    module: 1

  universe-phone-number:
    path: /assets/images/module-01/universe-phone-number-owocki-nblm.png
    caption: "The Universe's Phone Number: (555)-711-2555 maps cosmic scales"
    alt: "Staircase diagram showing scale factors from nucleus (10^-15 m) through atom, cell, human, Earth, Jupiter, Sun, AU, light-year, parsec, galaxy, to observable universe (10^26 m). Phone number digits encode the multiplication factors between each level."
    credit: "Fundamentals of Astrophysics (Owocki)"
    module: 1

  # Dimensional Analysis Protocol (Lecture 02)
  da-protocol:
    path: /assets/images/module-01/3-step-dimensional-analysis-protocol.png
    caption: "The three-step dimensional analysis protocol for building educated guesses"
    alt: "Flowchart showing Step 1: The Ingredients (list variables M, R and constants G, c, ℏ), Step 2: The Hypothesis (assume Answer ≈ A^α B^β C^γ), Step 3: The Match (solve for exponents to match target dimensions). Icons show beaker, f(x), and balance scale."
    module: 1

  units-vs-dimensions:
    path: /assets/images/module-01/units-vs-dimensions-nblm.png
    caption: "Units are conventions; dimensions are physical reality"
    alt: "Split diagram contrasting UNITS (The Map) showing ruler, stopwatch, and weights labeled as 'human inventions, fungible, arbitrary' versus DIMENSIONS (The Territory) showing [L], [T], [M] symbols labeled as 'physical realities, invariant, fundamental'. Footer states physical laws must hold regardless of units used."
    credit: "Course illustration (A. Rosen)"
    module: 1

  physical-constants:
    path: /assets/images/module-01/physical-constants-nblm.png
    caption: "Physical constants encode dimensional information about the universe"
    alt: "Diagram explaining that constants like G and c are not just numbers but conversion factors. Shows c (speed of light) with dimensions [L][T]^-1 as the universal speed limit, and G (gravitational constant) derived from Newton's law with dimensions [M]^-1[L]^3[T]^-2. Highlights the inverse mass term that allows gravity to cancel mass."
    credit: "Course illustration (A. Rosen)"
    module: 1

  math-toolbox:
    path: /assets/images/module-01/math-toolbox-nblm.png
    caption: "The dimensional analysis toolbox for ASTR 201"
    alt: "Three-panel overview: (1) Reality vs Map - units are conventions, dimensions are physics, (2) The Radar - use scaling relations A ∝ B^α to predict behavior before solving equations, (3) Self-Correction - if dimensions don't match, the physics is wrong. Quote: 'In ASTR 201, we don't just memorize formulas. We interrogate them.'"
    credit: "Course illustration (A. Rosen)"
    module: 1

  # ==============================================================
  # Lecture 01: Spoiler Alerts — The Universe Is Weird
  # ==============================================================

  # Section 1.1: The Four Observables
  four-observables:
    path: /assets/images/module-01/the-four-observables-nblm.png
    caption: "**What to notice:** From billions of kilometers away, we can directly measure only four things. Everything else—mass, radius, temperature, age—is a calculation."
    alt: "Four-panel diagram showing the astronomer's toolkit: Brightness (Flux) - how much energy arrives, Position (Geometry) - where is it on the sky, Wavelength (Spectroscopy) - what colors are present, Timing (Variability) - how does it change."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Spoiler 1: Nebulae
  # TODO: Replace with actual nebula image. Options:
  #   - Rubin Observatory First Light: Lagoon/Trifid Nebulae
  #   - HST: Carina Nebula, Orion Nebula, NGC 3603
  #   - JWST: Carina Nebula (Cosmic Cliffs)
  #   Add annotations showing H-alpha (red), [OIII] (blue-green), dust lanes
  forensic-nebula:
    path: /assets/images/module-01/forensic-analysis-of-a-nebula-nblm.png
    caption: "**What to notice:** Colors aren't decoration—they're encoded physics. Red = hydrogen (656 nm), blue-green = oxygen (500 nm), dark lanes = dust blocking light."
    alt: "Annotated nebula image showing three labeled features: (1) Hydrogen-Alpha at 656.3 nm in red regions indicating ionized gas, (2) Doubly-ionized Oxygen [OIII] at 500 nm in blue-green regions indicating extremely low density, (3) Dark Lanes showing silhouettes of interstellar dust blocking the light."
    credit: "Course illustration (A. Rosen)"  # TODO: Update credit when real image added
    module: 1

  # Spoiler 2: Distance Ladder
  cosmic-distance-ladder:
    path: /assets/images/module-01/cosmic-distance-ladder-nblm.png
    caption: "**What to notice:** Each rung calibrates the next. Parallax (geometry) → Cepheids (standard candles) → Supernovae (Chandrasekhar limit) → Hubble Flow (cosmology). We infer the infinite from the infinitesimal."
    alt: "Four-rung ladder diagram titled 'The Cosmic Distance Ladder: Building on the Shoulders of Physics'. From bottom to top: Rung 1 Geometry (Parallax), Rung 2 Physics (Cepheids/Standard Candles), Rung 3 Physics (Supernovae/Chandrasekhar Limit), Rung 4 Cosmology (Hubble Flow). Footer text: Our understanding of the vastest scales relies on the microscopic atom."
    credit: "Course illustration (A. Rosen)"
    module: 1

  standard-candles:
    path: /assets/images/module-01/standard-candles-nblm.png
    caption: "**What to notice:** Standard candles work because physics predicts their luminosity. Measure flux (F) + know luminosity (L) → calculate distance (d)."
    alt: "Two-panel diagram: Left shows Cepheid Variable with sinusoidal light curve where pulse rate reveals wattage. Right shows Type Ia Supernova with white dwarf accreting from companion star, producing consistent peak brightness (~10^9 solar luminosities). Bottom equation: Measure Flux (F) + Know Luminosity (L) → Calculate Distance (d)."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Spoiler 3: Origin of Elements
  periodic-table-origins:
    path: /assets/images/module-01/periodic-table-origins-nasa.png
    caption: "**What to notice:** The periodic table is a fossil record of cosmic processes. Different colors = different origins: Big Bang (H, He), dying stars (C, N, O), supernovae (Fe), neutron star mergers (Au, Pt)."
    alt: "Periodic table color-coded by nucleosynthesis origin: hydrogen and helium from Big Bang (pink), elements like carbon and oxygen from dying low-mass stars (yellow), iron-peak elements from supernovae (orange), heavy elements like gold from merging neutron stars (blue), with some human-made elements (green)."
    credit: "NASA/Jennifer Johnson"
    module: 1

  # Spoiler 4: Prism/Spectroscopy
  quantum-barcode:
    path: /assets/images/common/quantum-barcode-spectroscopy-nlbm.png
    caption: "**What to notice:** Atoms have quantized energy levels like rungs on a ladder. Electrons jumping between rungs absorb or emit photons of *exact* energies—creating unique spectral fingerprints. Hot dense sources produce continuous spectra; cool gas in front absorbs specific wavelengths; hot thin gas emits specific wavelengths."
    alt: "Diagram titled 'The Quantum Barcode' showing three parts: Left - an atom with quantized energy levels depicted as a ladder, with electrons occupying specific rungs. Center - 'The Photon Exchange' showing electrons absorbing or emitting photons of exact energy when jumping between levels. Right - 'Three Ways to See the Universe': continuous spectrum (rainbow from hot dense source), absorption spectrum (rainbow with dark lines from cool gas absorbing), and emission spectrum (bright lines on dark background from hot thin gas)."
    credit: "Course illustration (A. Rosen)"
    module: 1

  prism-spectrum:
    path: /assets/images/module-01/prism-spectrum-nblm.png
    caption: "**What to notice:** A prism reveals that 'white' light contains many wavelengths. Blue bends more (shorter λ, higher energy); red bends less (longer λ, lower energy)."
    alt: "Diagram of white light entering a triangular prism and separating into a rainbow spectrum. Labels indicate Cosmic Blue (high energy, short wavelength) at top and Signal Red (low energy, long wavelength) at bottom."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Spoiler 5: EM Spectrum
  em-spectrum-temperature:
    path: /assets/images/module-01/em-spectrum-nblm.png
    caption: "**What to notice:** The EM spectrum is a temperature ladder. Gamma/X-ray = million-degree plasma; UV/Visible = stellar surfaces (3,000–50,000 K); Infrared/Radio = dust and cold gas (10–100 K)."
    alt: "Vertical electromagnetic spectrum showing wavelength bands with corresponding temperatures: Gamma/X-Ray at top for million-degree plasma and black holes, UV/Visible in middle for stars (3,000K–50,000K), Infrared/Radio at bottom for dust (100K) and cold gas (10K). Rainbow colors shown in visible band."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Spoilers 6-8: Multi-wavelength
  multi-wavelength-reality:
    path: /assets/images/module-01/multi-wavelength-reality-nblm.png
    caption: "**What to notice:** Same objects look completely different at different wavelengths because different emission mechanisms dominate. Radio = cold gas & magnetic fields; Optical = stellar surfaces & ionized gas; X-ray = million-degree plasma & shocks."
    alt: "Three-panel comparison showing astronomical objects at Radio (low energy <1 eV, cold gas and magnetic fields), Optical (mid energy 2-3 eV, stellar surfaces and ionized gas), and X-Ray (high energy >100 eV, million-degree plasma and shocks). Each panel shows different structures in the same cosmic objects."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Spoiler 6: M51 optical vs radio
  m51-optical-radio:
    path: /assets/images/module-01/m51-optical-radio.png
    caption: "**What to notice:** Left (optical) shows stars and dust lanes. Right (radio/21-cm) shows cold neutral hydrogen gas. The distributions don't perfectly overlap—different wavelengths reveal different physical components."
    alt: "Side-by-side comparison of the Whirlpool Galaxy (M51): Left panel shows optical image with blue-white spiral arms (stars) and dark dust lanes. Right panel shows 21-cm radio emission in red/pink revealing the distribution of cold neutral hydrogen gas extending beyond the visible stellar disk."
    credit: "NASA/ESA/STScI/AURA (Optical); NRAO/AUI (Radio)"
    module: 1

  # Spoiler 7: Pillars of Creation
  pillars-hubble-jwst:
    path: /assets/images/module-01/pillars-hubble-jwst.png
    caption: "**What to notice:** Left (Hubble optical)—dark, opaque columns block visible light. Right (JWST infrared)—thousands of embedded newborn stars revealed. Infrared penetrates the dust that blocks optical light."
    alt: "Side-by-side comparison of the Pillars of Creation in the Eagle Nebula: Left panel shows Hubble optical image with dark opaque dust pillars against glowing gas. Right panel shows JWST near-infrared image revealing thousands of previously hidden stars embedded within and behind the pillars."
    credit: "JWST/STScI"
    module: 1

  # Spoiler 8: Crab Nebula multiwavelength
  crab-multiwavelength:
    path: /assets/images/module-01/crab-multiwavelength-chandra.jpg
    caption: "**What to notice:** The same supernova remnant looks completely different at each wavelength. Radio (red) = synchrotron from magnetic fields; Infrared (yellow) = warm dust; Optical (green) = ionized filaments; X-ray (blue/purple) = hot plasma and pulsar jets. Many windows, one truth."
    alt: "Composite image of the Crab Nebula with five individual wavelength views shown below: Radio (red, showing magnetic field structure), Infrared (yellow, warm dust), Optical (green, ionized gas filaments), Ultraviolet (blue), and X-ray (purple, hot plasma and central pulsar jets). The main image combines all wavelengths into a single colorful view."
    credit: "NASA/CXC/SAO"
    module: 1

  # Section 1.3: Decoder Ring
  decoder-ring:
    path: /assets/images/module-01/decoder-ring-flowchart-nblm.png
    caption: "**What to notice:** The cycle that makes astronomy a science: Signal → Measurement → Model → Inference → Correction → back to Model. Failed predictions drive model revision."
    alt: "Circular flowchart titled 'The Astronomer's Decoder Ring' with Inference (Reality Revealed) at center. Four stages around the circle: Signal (photons arrive from distant objects), Measurement (flux and wavelength quantified through instruments), Model (apply physics like L=4πR²σT⁴), Correction (account for dust and distance). Caption: From photons to physical reality—this is the scientific method in action."
    credit: "Course illustration (A. Rosen)"
    module: 1

  decoding-the-cosmos-infographic:
    path: /assets/images/module-01/decoding-the-cosmos-infographic.png
    caption: "**What to notice:** A big-picture map of the course thesis: light → measurements → models → physical claims."
    alt: "Infographic titled 'Decoding the Cosmos: How Astronomers Turn Light into Reality' showing four observables (brightness, position, wavelength, timing) feeding into an inference pipeline and a 'decoder ring' that connects signals to inferences; includes callouts that pretty pictures are datasets, physics makes inference legal, wavelength maps to a temperature ladder, and distance is a time dial."
    module: 1

  # Section 1.4: Light properties
  energy-wavelength-connection:
    path: /assets/images/module-01/energy-wavelength-connection.png
    caption: "**What to notice:** E = hc/λ means shorter wavelength = higher energy. Wien's Law lets us calculate temperature from color: cool stars are red (~3,000 K), hot stars are blue (~30,000 K)."
    alt: "Two-part diagram: Top shows 'The Energy-Wavelength Connection' with equation E = hc/λ and wave illustration transitioning from red (long wavelength) to blue (short wavelength). Bottom shows 'The Temperature Signature' as a color gradient from cool red star (3,000 K) to hot blue star (30,000 K), noting Wien's Law allows temperature calculation from peak color."
    module: 1

  # Section 1.5: Lookback Time
  universe-time-machine:
    path: /assets/images/module-01/universe-time-machine-nblm.png
    caption: "**What to notice:** Distance is a time dial. Looking at the Moon = 1.3 seconds ago; the Sun = 8 minutes ago; Andromeda = 2.5 million years ago; distant galaxies = 10 billion years ago."
    alt: "Timeline showing lookback time: Earth (Now), Moon (1.3 seconds ago), Sun (8 minutes ago), Andromeda galaxy (2.5 million years ago), distant galaxies (10 billion years ago), and cosmic microwave background (Big Bang). Each object shown as thumbnail image above the timeline."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Extra figures for context/motivation
  three-big-questions:
    path: /assets/images/module-01/three-big-questions-nblm.png
    caption: "**What to notice:** Three questions drive modern astronomy—and we answer all of them using the same method: inference from signals."
    alt: "Three circular images with questions: (1) How does the universe work? - Physics of the cosmos, (2) How did we get here? - Cosmic origins and evolution, (3) Are we alone? - Life in the universe. Footer states: We answer all three using the same superpower: Inference from signals."
    credit: "Course illustration (A. Rosen)"
    module: 1

  answering-big-questions:
    path: /assets/images/module-01/answering-the-big-questions-nblm.png
    caption: "**What to notice:** The tools we'll learn answer humanity's biggest questions: distance measurements give the universe's age, spectroscopy proves our stellar origins, atmospheric analysis searches for life."
    alt: "Three-panel diagram: Age of Universe (hourglass icon) - measuring distances to supernovae gives 13.8 billion years; Our Origins (atom icon) - spectroscopy proves iron in our blood was forged in stellar explosions; Are We Alone (planet icon) - we scan exoplanet atmospheres for biosignatures."
    credit: "Course illustration (A. Rosen)"
    module: 1

  interstellar-reddening:
    path: /assets/images/module-01/interstellar-reddening-nblm.png
    caption: "**What to notice:** Dust preferentially scatters blue light, making distant stars appear redder than they truly are. This 'reddening' must be corrected before inferring temperatures."
    alt: "Diagram showing interstellar reddening: a hot blue star emits light through a dust cloud (grains ~0.1 μm). Blue rays scatter away while red rays pass through, so observer sees a red star. Labels indicate Source (Hot/Blue), Dust Grain size, and Observer sees Red Star."
    credit: "Course illustration (A. Rosen)"
    module: 1

  logarithmic-cosmic-scales:
    path: /assets/images/module-01/logarithmic-cosmic-scales-gemini.png
    caption: "Cosmic Scales: A Powers of 10 Logarithmic Journey"
    alt: "Horizontal logarithmic scale from 10^-15 m (femto) to 10^26 m showing icons for atom, DNA helix, cell, grain of sand, human (reference point), mountain, Earth, Sun, solar system, Oort cloud/nearby stars, star cluster, Milky Way, local supercluster, and observable universe. Each step represents multiplication by 10."
    credit: "Gemini"
    module: 1

  # Rubin Observatory First Light
  lsst-cosmic-treasure-chest:
    path: /assets/images/module-01/lsst-cosmic-treasure-chest-zoom.jpg
    caption: "**What to notice:** A single deep-field image contains thousands of galaxies at different distances—each a snapshot from a different cosmic era. This is Rubin Observatory's first light 'Cosmic Treasure Chest'."
    alt: "Deep-field image from Rubin Observatory showing thousands of galaxies of various shapes, sizes, and colors against the dark background of space. Spiral galaxies, elliptical galaxies, and distant faint objects are visible throughout the field."
    credit: "Rubin Observatory/NSF/AURA"
    module: 1

  # Cosmic Timeline
  universe-history-nasa:
    path: /assets/images/module-01/universe-history-nasa.png
    caption: "**What to notice:** The universe has a history. Inflation (10⁻³² s) → First Particles (1 μs) → First Nuclei (3 min) → First Light (380,000 yr) → First Stars (200 Myr) → Galaxies (400 Myr) → Dark Energy (10 Gyr) → Today (13.8 Gyr)."
    alt: "NASA timeline diagram titled 'History of the Universe' showing cosmic evolution as an expanding cone from left to right. Major epochs labeled: Inflation (initial expansion), First Particles (neutrons, protons, electrons form), First Nuclei (helium and hydrogen form), First Light (the first atoms form), First Stars (gas and dust condense), Galaxies & Dark Matter (galaxies form in dark matter cradles), Dark Energy (expansion accelerates), Today (humans observe the universe at 13.8 billion years)."
    credit: "NASA"
    module: 1

  # DESI 3D Galaxy Map
  desi-3d-map:
    path: /assets/images/module-01/DESI-Universe-3D-Map.jpg
    caption: "**What to notice:** The cosmic web—galaxies aren't scattered randomly. They cluster into filaments, walls, and voids. You are at the center; colors show distance (cyan = nearby, red = billions of light-years away). Gravity is still pulling these structures together."
    alt: "3D map of galaxy distribution from DESI showing the cosmic web structure. Galaxies form filaments and clusters connected by walls, with large voids between. Color gradient from cyan (nearby) through yellow to red (distant) shows lookback time up to 2.5 billion years. 'You Are Here' marks Earth's position at center."
    credit: "DESI Collaboration/NOIRLab/NSF/AURA/Kitt Peak"
    module: 1

  # Case Study A: Planetary Orbits
  planetary-orbit:
    path: /assets/images/module-01/planetary-orbit.png
    caption: "Planetary orbit with central star mass M and orbital radius r"
    alt: "Diagram showing a planet orbiting a star, with labels for stellar mass M and orbital distance r"
    module: 1

  case-a-orbits-1:
    path: /assets/images/module-01/case-A-planetary-orbits-dimensional-analysis-1.png
    caption: "Case Study A: Deriving orbital period from first principles"
    alt: "Diagram showing planetary orbit with star mass M and orbital radius r. Lists ingredients: Distance r with dimension [L], Star Mass M with dimension [M], Gravity G with dimension [M]^-1[L]^3[T]^-2. Target dimension: Time [T]."
    module: 1

  case-a-orbits-2:
    path: /assets/images/module-01/case-A-planetary-orbits-dimensional-analysis-2.png
    caption: "Recovering Kepler's Third Law through dimensional analysis"
    alt: "Three-step derivation: Step A (Kill Mass) - multiply G×M to get [L]^3[T]^-2, Step B (Kill Length) - divide by r^3 to get [T]^-2, Step C (Isolate Time) - invert and square root to get P ≈ √(r^3/GM). Result achieved with zero calculus."
    module: 1

  case-a-orbits-3:
    path: /assets/images/module-01/case-A-planetary-orbits-dimensional-analysis-3.png
    caption: "Physical interpretation of the orbital period formula"
    alt: "Explanation of P ≈ √(r³/GM) showing: The Mass Effect (larger M in denominator → stronger gravity → shorter year) and The Distance Effect (larger r in numerator → longer path and weaker gravity → much longer year). Connection to observation: squaring both sides gives P² ∝ r³, matching Kepler's empirical Third Law exactly."
    module: 1

  # Case Study B: Black Holes
  case-b-blackhole-1:
    path: /assets/images/module-01/case-B-black-hole-dimensional-analysis-nblm-1.png
    caption: "Case Study B: Finding the event horizon radius"
    alt: "Diagram with black hole illustration showing curved spacetime. Goal: Find Schwarzschild radius R_sch. Ingredients: Mass M [M], Gravity G [M]^-1[L]^3[T]^-2, Speed of Light c [L][T]^-1. Target dimension: Length [L]."
    credit: "Course illustration (A. Rosen)"
    module: 1

  case-b-blackhole-2:
    path: /assets/images/module-01/case-B-black-hole-dimensional-analysis-nblm-2.png
    caption: "Deriving the Schwarzschild radius through dimensional analysis"
    alt: "Solution logic: (1) Eliminate Mass: G×M → [L]^3[T]^-2, (2) Eliminate Time: divide by c² → [L], (3) Result: R_sch ≈ GM/c². Image of accretion disk around black hole. Note: General Relativity yields exactly this scaling factor."
    credit: "Course illustration (A. Rosen)"
    module: 1

  # Case Study C: White Dwarfs
  case-c-whitedwarf-1:
    path: /assets/images/module-01/case-C-white-dwarf-dimensional-analysis-nblm-1.png
    caption: "Advanced Application: Degeneracy pressure in white dwarfs"
    alt: "Diagram showing compressed electrons in white dwarf. Explains that density is so high electrons are squeezed, quantum mechanics (ℏ) and electron mass (m_e) take over, temperature becomes irrelevant. Matching dimensions for pressure [M][L]^-1[T]^-2 using ℏ, m_e, and number density n gives P_deg ∝ ℏ²n^(5/3)/m_e."
    credit: "Course illustration (A. Rosen)"
    module: 1

  case-c-whitedwarf-2:
    path: /assets/images/module-01/case-C-white-dwarf-dimensional-analysis-nblm-2.png
    caption: "The counter-intuitive white dwarf mass-radius relation"
    alt: "Shows R ∝ M^(-1/3) derived by equating gravity (P ~ GM²/R⁴) with quantum pressure (P ~ ρ^(5/3)). Diagram compares stellar evolution path and white dwarf sizes: a 0.6 M☉ white dwarf is Earth-sized while a 1.2 M☉ white dwarf is significantly SMALLER than Earth. More mass = smaller size."
    credit: "Course illustration (A. Rosen)"
    module: 1

  powers-of-ten:
    path: /assets/images/module-01/powers-of-ten.png
    caption: "Cosmic scales span over 40 orders of magnitude"
    alt: "Logarithmic scale showing sizes from atomic nucleus to observable universe"
    module: 1

  inverse-square-law:
    path: /assets/images/module-01/inverse-square-law.svg
    caption: "Light intensity decreases with the square of distance"
    alt: "Inverse-square law diagram: a star at the center emits light through two concentric spheres at distance d and 2d. The outer sphere has four times the surface area, so the same luminosity is spread over four times the area and the flux is one quarter."
    credit: "Course illustration (A. Rosen)"
    module: 1

  kepler-orbits:
    path: /assets/images/module-01/kepler-orbits.png
    caption: "Kepler's laws of planetary motion"
    alt: "Elliptical orbit diagram showing equal areas in equal times"
    module: 1

  # ==============================================================
  # Module 2: Inferring Star Properties
  # ==============================================================

  parallax-geometry:
    path: /assets/images/module-02/week-04/parallax1-cococubed.svg
    caption: "Geometry of stellar parallax measurement (Earth at opposite sides of its orbit; nearby star shifts against distant background stars)."
    alt: "Parallax geometry diagram showing Earth on opposite sides of its orbit around the Sun in January and July, a nearby red star, distant background stars, and two inset sky views where the nearby star changes position. Labels include parallax angle p, distance d, and a 1 AU baseline."
    credit: "cococubed.com"
    module: 2

  spectral-lines:
    path: /assets/images/module-02/spectral-lines.png
    caption: "Absorption and emission spectral lines"
    alt: "Comparison of continuous, absorption, and emission spectra"
    module: 2

  doppler-shift:
    path: /assets/images/module-02/doppler-shift.png
    caption: "Doppler shift of spectral lines reveals stellar motion"
    alt: "Diagram showing blueshift and redshift of spectral lines"
    module: 2

  week04-angle-units-cococubed:
    path: /assets/images/module-02/week-04/angle_units-cococubed.svg
    caption: "**What to notice:** Angle units are nested by factors of 60 (degrees → arcminutes → arcseconds), and the Moon spans about 31 arcminutes (about 0.5°)."
    alt: "Teaching diagram titled 'Angle Units' with three panels: a circle marked in degrees, a 1 degree wedge subdivided into arcminutes, and a 1 arcminute wedge subdivided into arcseconds. A bottom example shows the Moon's apparent size labeled 31 arcminutes equals 0.5 degrees."
    credit: "cococubed.com"
    module: 2

  week04-distance-angle-cococubed:
    path: /assets/images/module-02/week-04/distance_angle-cococubed.svg
    caption: "**What to notice:** Arc length is a fixed fraction of circumference, so angle over 360° equals arc distance over $2\\pi$ times radius."
    alt: "Circle geometry diagram with radius, an arc labeled distance, and a central angle. The right side shows the proportion part over whole equals part over whole and the equation angle over 360 degrees equals distance over 2 pi radius."
    credit: "cococubed.com"
    module: 2

  week04-celestial-sphere-depth-cococubed:
    path: /assets/images/module-02/week-04/celestial_sphere_02-cococubed.svg
    caption: "**What to notice:** Stars appear projected onto one celestial sphere, but the arrows emphasize they are actually at different distances in 3D space."
    alt: "Celestial sphere illustration with Earth near the center, celestial equator and ecliptic marked, and constellations drawn on the sphere. Red arrows point outward from several stars with text noting stars seem to lie on the sphere but are really at different distances."
    credit: "cococubed.com"
    module: 2

  week04-parallax1-cococubed:
    path: /assets/images/module-02/week-04/parallax1-cococubed.svg
    caption: "**What to notice:** A nearby star shifts against distant background stars between January and July; that angular shift is parallax and gives distance."
    alt: "Parallax geometry diagram showing Earth on opposite sides of its orbit around the Sun in January and July, a nearby red star, distant purple stars, and two inset sky views where the nearby star changes position. Labels include parallax angle p, distance d, and 1 AU baseline."
    credit: "cococubed.com"
    module: 2

  week04-nearest-stars2-white-cococubed:
    path: /assets/images/module-02/week-04/nearest_stars2_white-cococubed.svg
    caption: "**What to notice:** The nearest stellar neighborhood is a sparse 3D map around the Sun, with distance rings (3, 6, and 10 light-years) and stars not confined to one plane."
    alt: "Three-dimensional local star map centered on the Sun with dashed rings at 3, 6, and 10 light-years. Labeled nearby systems include Alpha Centauri, Barnard's Star, Sirius, Procyon, Ross 154, Lacaille 9352, and others at different vertical heights above and below the reference plane."
    credit: "cococubed.com"
    module: 2

  week04-nearest-massive-stars-cococubed:
    path: /assets/images/module-02/week-04/nearest_massive_stars-cococubed.svg
    caption: "**What to notice:** Massive stars are rarer and generally farther away than the nearest low-mass stars, so the local sample extends out to several tenths of a kiloparsec."
    alt: "Top-down map of nearby massive stars around the Sun with concentric dashed rings at 0.2, 0.4, and 0.6 kiloparsecs. Points are color coded by spectral class and labeled with examples such as Spica, Antares, Beta Ori, and Epsilon Cyg, with coordinates referenced to the celestial equator and vernal equinox direction."
    credit: "cococubed.com"
    module: 2

  week04-photosphere-line-formation-cococubed:
    path: /assets/images/module-02/week-04/photosphere_line_formation-cococubed.svg
    caption: "**What to notice:** Different wavelengths form at different depths in the photosphere, so absorption lines encode atmospheric structure, not just composition."
    alt: "Cross-section of a stellar photosphere with curved layers labeled about 5800 K deeper and 4500 K higher up across roughly 500 km. Dashed sight lines from different depths connect to a spectrum panel showing a dark absorption line dip versus wavelength and intensity."
    credit: "cococubed.com"
    module: 2

  week04-owocki-fig2-1-angular-size:
    path: /assets/images/module-02/week-04/Owocki_Fig2-1.jpg
    caption: "**What to notice:** Angular size comes from geometry: the same physical size $s$ subtends a smaller angle $\\alpha$ at larger distance $d$."
    alt: "Basic viewing geometry with observer A at left and object segment BC at right. Rays from A to B and C define an angle alpha, with distance d to the object centerline and object size s shown on the right vertical segment."
    credit: "Fundamentals of Astrophysics (Owocki)"
    module: 2

  week04-owocki-fig2-3-small-angle:
    path: /assets/images/module-02/week-04/Owocki_Fig2-3.jpg
    caption: "**What to notice:** The exact relation $\\sin(\\alpha/2)=R/d$ reduces to $\\alpha\\approx2R/d$ when $R\\ll d$, which is the small-angle approximation used in astronomy."
    alt: "Small-angle derivation diagram with observer A viewing a circular object of radius R at distance d. The diagram includes the equations sine of alpha over 2 equals R over d and, for R much less than d, alpha approximately equals 2R over d."
    credit: "Fundamentals of Astrophysics (Owocki)"
    module: 2

  week04-owocki-fig2-4-parallax-parsec:
    path: /assets/images/module-02/week-04/Owocki_Fig2-4.jpg
    caption: "**What to notice:** Parallax uses Earth's 1 AU orbital radius as a baseline; the relation $d(\\text{pc})=1/p(\\text{arcsec})$ turns tiny angles into distances."
    alt: "Parallax sketch with a nearby star at left and Earth positions in January and July on a small orbit at right. Lines of sight define parallax angle p, distance d, and a 1 AU vertical baseline, with distant background stars indicated."
    credit: "Fundamentals of Astrophysics (Owocki)"
    module: 2

  week04-owocki-fig2-5-solid-angle:
    path: /assets/images/module-02/week-04/Owocki_Fig2-5.jpg
    caption: "**What to notice:** A small patch on the sky has solid angle $\\delta\\Omega=\\sin\\theta\\,\\delta\\theta\\,\\delta\\phi$, the 2D angular area element used in flux and intensity integrals."
    alt: "Spherical coordinate diagram highlighting a small surface patch between theta and theta plus delta-theta and across delta-phi. From the sphere center, dashed rays outline the patch and the formula delta-Omega equals sin theta times delta-theta times delta-phi is shown."
    credit: "Fundamentals of Astrophysics (Owocki)"
    module: 2

  week04-owocki-fig3-1-surface-brightness:
    path: /assets/images/module-02/week-04/Owocki_Fig3-1.jpg
    caption: "**What to notice:** Surface brightness is distance-independent because both received flux and apparent solid angle scale as $1/d^2$, so their ratio stays constant."
    alt: "Derivation graphic comparing a star viewed at two distances d1 and d2 with angular radii alpha1 and alpha2. Equations show angular radius, solid angle, flux F equals L over 4 pi d squared, and intensity I equals F over Omega simplifying to L over 4 pi squared R squared equals F-star over pi."
    credit: "Fundamentals of Astrophysics (Owocki)"
    module: 2

  week04-jwst-spectroscopy-density:
    path: /assets/images/module-02/week-04/jwst-spectroscopy-1.png
    caption: "**What to notice:** Broader absorption lines indicate higher pressure and density, so white dwarfs show pressure-broadened spectra compared with low-density giants."
    alt: "Infographic titled 'Comparing Density Through Spectra' comparing a blue giant and a white dwarf. Two rainbow spectra are shown with dark absorption lines, where the white dwarf's lines are visibly broader to illustrate pressure broadening at higher density."
    credit: "JWST/STScI"
    module: 2

  week04-hr-diagram-eso:
    path: /assets/images/module-02/week-04/hr-diagram-eso.jpg
    caption: "**What to notice:** The H-R diagram separates stars into main sequence, giants/supergiants, and white dwarfs; temperature decreases left-to-right while luminosity increases upward."
    alt: "Hertzsprung-Russell diagram with logarithmic luminosity on the vertical axis (relative to the Sun) and surface temperature on the horizontal axis decreasing from about 30000 K at left to 3000 K at right. Colored stellar points and shaded regions mark the main sequence, giants, supergiants, and white dwarfs, with the Sun labeled near luminosity 1 and temperature about 5800 K."
    credit: "ESO"
    module: 2

  harvard-computers:
    path: /assets/images/module-02/week-05/harvard-computers.jpg
    caption: "**What to notice:** These women analyzed hundreds of thousands of stellar spectra from photographic plates, discovering the patterns (OBAFGKM, period-luminosity relation, luminosity classification) that transformed astronomy into astrophysics."
    alt: "Black-and-white photograph from circa 1890 showing seven women working at desks in a room at Harvard College Observatory, examining photographic plates and notebooks. A light-curve chart labeled 'B Aurigae Dec 1889' hangs on the wall behind them."
    credit: "Harvard College Observatory / Smithsonian Institution"
    module: 2

  greenhouse-comparison:
    path: /assets/images/module-02/week-05/greenhouse-comparison.png
    caption: "**What to notice:** Venus is closer to the Sun yet has a *lower* equilibrium temperature than Earth because its high albedo reflects 77% of sunlight. The greenhouse warming (mauve arrows) is what separates $T_{\\text{eq}}$ from $T_{\\text{actual}}$ — Venus's massive CO$_2$ atmosphere adds 508 K, Earth's adds 33 K, and Mars's thin atmosphere adds essentially nothing."
    alt: "Bar chart comparing equilibrium temperature (teal) and actual surface temperature (gold) for Venus, Earth, and Mars. Venus shows the largest greenhouse gap of +508 K, Earth shows +33 K, and Mars shows approximately zero. Dominant atmospheric greenhouse gases are labeled beneath each planet."
    credit: "ASTR 201 (generated)"
    module: 2

  obafgkm-spectra:
    path: /assets/images/module-02/week-05/obafgkm_noao_big.jpg
    caption: "**What to notice:** The spectral sequence from O (top, hottest) to M (bottom, coolest). Dark absorption lines shift across the sequence — hydrogen Balmer lines peak at A-type, helium lines dominate O and B, metal lines crowd in at G and K, and molecular bands appear at M. The bottom three rows show special cases: a metal-poor F star, an M star with emission lines, and a B star with emission."
    alt: "Composite image of stellar spectra arranged vertically from O6.5 at top to M5 at bottom, with wavelength increasing left to right across the visible band. Each horizontal strip shows a rainbow-colored spectrum with dark absorption lines at different positions. Star catalog identifiers (HD numbers) are labeled on the right. Three additional spectra at the bottom show an F4 metal-poor star, an M4.5 emission star, and a B1 emission star."
    credit: "NOAO/AURA/NSF"
    module: 2

  mk-star-sizes:
    path: /assets/images/module-02/week-05/800px-Morgan-Keenan_spectral_classificatio.max-1000x1000.png
    caption: "**What to notice:** Main-sequence stars span a huge range of size and color. M dwarfs (left) are small and red-orange; O stars (right) are large and blue-white. But size on the main sequence is just one dimension — a red *supergiant* can dwarf an O star despite being cooler."
    alt: "Artistic rendering of main-sequence stars arranged left to right by spectral type from M (small, red-orange) through K, G, F, A, B to O (large, blue-white), shown to relative scale against a black background. Each star is labeled with its spectral letter."
    credit: "Wikimedia Commons (after Morgan & Keenan)"
    module: 2

  earth-energy-balance-blackbodies:
    path: /assets/images/module-02/week-05/energy_breakdown.png
    caption: "**What to notice:** Two blackbodies, two very different temperatures. The Sun (~5,800 K) radiates a Planck curve peaking in visible light (~0.5 $\\mu\\text{m}$). Earth (~288 K) re-radiates a Planck curve peaking in thermal infrared (~10 $\\mu\\text{m}$). Greenhouse gases absorb in the infrared window where Earth is trying to radiate — not where the Sun's energy arrives. The sharp absorption features in the outgoing spectrum are the molecular fingerprints of CO$_2$, H$_2$O, and O$_3$."
    alt: "Diagram showing the electromagnetic spectrum with two Planck curves. Left panel (yellow background): incoming solar radiation peaking near 1 micron in the visible band. Right panel (blue background): outgoing terrestrial radiation peaking near 10 microns in the thermal infrared, with deep absorption notches carved by atmospheric greenhouse gases. The full EM spectrum from gamma rays to long waves is labeled across the top."
    credit: "NOAA JetStream"
    module: 2

  week04-colors-of-stars-hubble:
    path: /assets/images/module-02/week-04/colors-of-stars-nasa-esa-hubble.webp
    caption: "**What to notice:** Real star fields are not monochrome. Even before we spread starlight into spectra, blue-white and orange-red stars tell us that stellar surfaces come in different temperature regimes."
    alt: "Dense star field image with a bright cluster near the center and many stars of different apparent colors, including blue-white, yellow, and red-orange stars scattered across the frame."
    credit: "NASA/ESA/Hubble"
    module: 2

  # Week 06: Weighing Stars + HR Diagram
  mass-luminosity-plot:
    path: /assets/images/module-02/week-06/mass-luminosity-relation.png
    caption: "**What to notice:** Main-sequence stars follow a tight power law $L \\propto M^{3.5}$ — a modest increase in mass produces a dramatic increase in luminosity. The Sun sits in the middle. This relation, built entirely from binary star mass measurements, proves that mass is the master variable."
    alt: "Log-log plot of luminosity versus mass for main-sequence stars in solar units. Points are color-coded by spectral type (blue for O/B, white for A, yellow for G, orange for K, red for M). A dashed line shows the power-law fit L proportional to M to the 3.5. The Sun is marked at (1, 1). Annotations show that 2 solar masses gives about 11 solar luminosities and 10 solar masses gives about 3000 solar luminosities."
    credit: "ASTR 201 (generated)"
    module: 2

  hr-diagram-observer:
    path: /assets/images/module-02/week-06/hr-diagram-observer.png
    caption: "**What to notice:** The observer's HR diagram plots absolute magnitude $M_V$ against color index $(B-V)$. Three structures stand out: the main sequence (diagonal band, 90% of stars), the giant branch (upper right, cool but luminous), and white dwarfs (lower left, hot but faint). No theory is needed to build this diagram — it's pure measurement."
    alt: "Color-magnitude diagram with absolute visual magnitude on the vertical axis (brighter at top) and B-V color index on the horizontal axis (blue-hot on left, red-cool on right). Hundreds of points form a diagonal main sequence from upper-left to lower-right, a clump of giants in the upper-right, scattered supergiants at the top, and white dwarfs in the lower-left. The Sun is marked at B-V = 0.65, M_V = 4.83. Spectral type labels O B A F G K M appear across the top."
    credit: "ASTR 201 (generated)"
    module: 2

  hr-diagram-overview-classic:
    path: /assets/images/module-02/week-06/HR-Diagram-Overview.jpg
    caption: "**What to notice:** Even a classic labeled HR diagram shows the same three geographies immediately: the main sequence, the cool luminous giant/supergiant region, and the hot faint white dwarf region. Named stars make the map feel physical rather than abstract."
    alt: "Classic Hertzsprung-Russell diagram with luminosity on the vertical axis and surface temperature on the horizontal axis, labeled with spectral classes O through M and representative stars such as Spica, Rigel, Betelgeuse, the Sun, Sirius B, Procyon B, and Proxima Centauri in the main sequence, giant, and white dwarf regions."
    module: 2

  hr-diagram-theorist:
    path: /assets/images/module-02/week-06/hr-diagram-theorist.png
    caption: '**What to notice:** The theorist HR diagram uses physical axes — $\log(L/L_\odot)$ vs. $\log T_{\mathrm{eff}}$ — and overlays lines of constant radius from the Stefan-Boltzmann law. Giants sit on lines of $R \sim 10\text{–}100\,R_\odot$; white dwarfs sit on lines of $R \sim 0.01\,R_\odot$ (Earth-sized). The same patterns appear as in the observer diagram, confirming they are real features of stellar physics.'
    alt: "HR diagram with log luminosity in solar units on the vertical axis and log effective temperature on the horizontal axis (reversed, hotter on left). Dashed diagonal lines show constant stellar radii from 0.01 to 1000 solar radii. Main sequence stars form a diagonal band, giants cluster in the upper right near the 10-100 solar radii lines, and white dwarfs cluster in the lower left near the 0.01 solar radii line. The Sun is marked at log T = 3.76, log L = 0."
    credit: "ASTR 201 (generated)"
    module: 2

  hr-evolutionary-tracks-schematic:
    path: /assets/images/module-02/week-06/hr-evolutionary-tracks-schematic.svg
    caption: "**What to notice:** This static schematic shows two evolutionary pathways on HR-diagram axes (luminosity up, temperature decreasing to the right): an approximately 1-solar-mass track from protostar contraction to main sequence to red giant to planetary-nebula/white-dwarf cooling, and an approximately 10-solar-mass track from main sequence to supergiant to core-collapse supernova with neutron-star/black-hole endpoints."
    alt: "Static HR diagram schematic with labeled phases and arrows. Blue track for about 1 solar mass: protostar contraction, main sequence, red giant, planetary nebula, and white dwarf cooling. Red track for about 10 solar masses: main sequence, supergiant, core-collapse supernova, then neutron star or black hole."
    credit: "ASTR 201 (generated)"
    module: 2

  hr-evolutionary-tracks-mass-timescale:
    path: /assets/images/module-02/week-06/17_06_Figure_hr.jpg
    caption: "**What to notice:** Evolution off the main sequence depends strongly on mass and timescale. High-mass stars evolve quickly (short arrows/times), while low-mass stars evolve slowly (long times). The same HR space encodes both pathway and pace."
    alt: "HR diagram with luminosity on the vertical axis and surface temperature on the horizontal axis, showing the main sequence and overlaid evolutionary tracks for stars of different masses from about 0.5 to 15 solar masses. Arrows and labels indicate approximate evolution timescales, highlighting that higher-mass stars evolve much faster than lower-mass stars."
    module: 2

  hr-evolution-solar-track-detailed:
    path: /assets/images/module-02/week-06/17_08_Figure.jpg
    caption: "**What to notice:** A Sun-like star does not leave the main sequence in one jump. The track bends through subgiant and red-giant phases, then loops through a helium-burning stage before ending as a white dwarf after the planetary-nebula phase."
    alt: "HR diagram showing a detailed evolutionary path for a solar-mass star from the main sequence to subgiant, red giant, helium-core-fusion star, planetary nebula, and white dwarf, with side cutaways labeling the changing fusion shells and inert core structure."
    module: 2

  hr-evolution-massive-star-tracks:
    path: /assets/images/module-02/week-06/17_13_Figure.jpg
    caption: "**What to notice:** High-mass stars follow distinct tracks by mass, but all of them race through the upper HR diagram far faster than Sun-like stars. Larger mass means hotter starting point, shorter lifetime, and a more dramatic supergiant evolution."
    alt: "HR diagram with several massive-star evolutionary tracks labeled by stellar mass, including about 9, 25, 40, and 85 solar masses, showing their motion away from the upper main sequence through luminous supergiant phases."
    module: 2

  hr-pre-main-sequence-tracks:
    path: /assets/images/module-02/week-06/HR-PMS.jpg
    caption: "**What to notice:** Mass sets the clock even before stable hydrogen burning begins. High-mass protostars reach the main sequence quickly, while low-mass stars spend much longer contracting toward it."
    alt: "HR diagram with pre-main-sequence tracks labeled by stellar mass from about 0.5 to 15 solar masses, with arrows and timescales showing that higher-mass stars move onto the main sequence much faster than lower-mass stars."
    module: 2

  binary-star-visual:
    path: /assets/images/module-02/week-06/visual-binary-gemini.png
    caption: "**What to notice:** Two stars orbit their common center of mass (×). The heavier star (yellow-white) traces a *smaller* orbit ($a_1$); the lighter star (orange) swings wide ($a_2$). Ghosted positions at different epochs show the decades of patient observation needed to map the orbit. With the period $P$ and physical separation $a = a_1 + a_2$ (which requires knowing the distance), Kepler III yields the total mass."
    alt: "Diagram of a visual binary star system against a dark starfield. A warm yellow-white star traces a small elliptical orbit and a cooler orange star traces a larger elliptical orbit, both centered on a common center of mass marked with a white × labeled CM. Five ghosted epoch positions along each orbit are connected by dotted timing lines, with two pairs labeled 2005 and 2015. Brackets label a₁ (CM to heavy star), a₂ (CM to light star), and a = a₁ + a₂ spanning the full separation. A caption box reads Visual Binary — resolved on the sky, P + a → Kepler III → total mass."
    credit: "ASTR 201 (Gemini)"
    module: 2

  binary-star-spectroscopic:
    path: /assets/images/module-02/week-06/spectroscopic-binary-gemini.png
    caption: "**What to notice:** Top — the orbital dance seen from above at four phases. Velocity arrows show which star is approaching (blueshift) or receding (redshift) at each moment. Bottom — the radial velocity signature: two sinusoidal curves in anti-phase. The less massive star (orange, $K_2$) has the *larger* velocity amplitude because it orbits farther from the center of mass and moves faster. The mass ratio comes directly from $M_1/M_2 = K_2/K_1$."
    alt: "Two-panel scientific diagram on black background. Top panel shows a binary star system at four orbital phases (0.00, 0.25, 0.50, 0.75) seen from above, with a blue-white star and an orange star orbiting their center of mass. Velocity arrows indicate approaching and receding motion at each phase, with a To Observer arrow. Bottom panel shows radial velocity versus orbital phase with two anti-phase sinusoidal curves: a blue curve with smaller amplitude K₁ and an orange curve with larger amplitude K₂. A dashed horizontal line marks the systemic velocity at zero. Annotation reads: Smaller mass → larger orbit → faster motion → larger K."
    credit: "ASTR 201 (Gemini)"
    module: 2

  eclipsing-binary-light-curve:
    path: /assets/images/module-02/week-06/eclipsing-binary-gemini.png
    caption: "**What to notice:** Top — an edge-on binary at four phases. When the small cool star transits the hot star (phase B), it blocks high-surface-brightness area → deep dip. When the cool star is hidden behind the hot star (phase D), only its modest contribution is lost → shallow dip. Bottom — the light curve shows both eclipses. The depth ratio encodes the temperature ratio; the duration encodes the stellar radii."
    alt: "Two-panel diagram on black background. Top panel shows four orbital phases of an eclipsing binary viewed edge-on: A (full light, both stars visible), B (primary eclipse with small orange-red star silhouetted against large blue-white star, labeled deep dip), C (full light again), D (secondary eclipse with orange star hidden behind blue star, labeled shallow dip). Bottom panel shows a light curve of total system brightness versus orbital phase. A deep symmetric dip near phase 0.25 is labeled Hot surface blocked → large flux loss. A very shallow dip near phase 0.75 is labeled Cool surface hidden → small flux loss. Scattered data points overlay the smooth model curve."
    credit: "ASTR 201 (Gemini)"
    module: 2

  center-of-mass-binary:
    path: /assets/images/module-02/week-06/center-of-mass-binary-orbits.png
    caption: "**What to notice:** The center of mass (×) is the pivot point — always closer to the heavier star. $M_1$ barely moves ($a_1$ small); $M_2$ swings wide ($a_2$ large). The balance condition $M_1 a_1 = M_2 a_2$ means the mass ratio equals the *inverse* ratio of orbital sizes. Epoch dots show the stars always on opposite sides of the CM."
    alt: "Diagram titled Binary Star Orbits and Center of Mass on black background. A large yellow-white star labeled M₁ on the left and a smaller orange star labeled M₂ on the right are connected through a white × labeled CM (center of mass), positioned closer to M₁. Dashed elliptical orbits show M₁ tracing a small orbit of radius a₁ and M₂ tracing a large orbit of radius a₂, both centered on the CM. A bracket below spans the full separation labeled a = a₁ + a₂. Epoch dots along each orbit show the stars always on opposite sides. Text reads: Stars move in synchronous elliptical orbits, always on opposite sides of the CM."
    credit: "ASTR 201 (Gemini)"
    module: 2

  sirius-ab-hubble:
    path: /assets/images/module-02/week-06/Sirius_A_and_B_Hubble_photo.jpg
    caption: "**What to notice:** Sirius A (the brilliant overexposed star with diffraction spikes) vastly outshines Sirius B (the tiny dot at lower left). Despite a luminosity ratio of $\\sim 800:1$, Sirius B has nearly half the mass of Sirius A — it is a white dwarf with $1.02\\,M_\\odot$ packed into an Earth-sized volume."
    alt: "Hubble Space Telescope image of the Sirius binary system. Sirius A is a brilliant overexposed white star dominating the frame with prominent diffraction spikes. Sirius B is visible as a small faint dot at lower left, separated by several arcseconds."
    credit: "NASA/ESA/HST"
    module: 2

  sirius-ab-orbit:
    path: /assets/images/module-02/week-06/sirius-orbit.jpg
    caption: "**What to notice:** The orbital path of Sirius B around Sirius A, traced over decades of observation. Bessel predicted this companion in 1844 from the wobble of Sirius A's proper motion — the orbit was mapped long before the companion's nature was understood."
    alt: "Diagram showing the elliptical orbit of Sirius B around Sirius A, with positions marked at various epochs spanning decades. The orbital ellipse is clearly elongated, with Sirius A near one focus."
    credit: "Public domain"
    module: 2

  mass-luminosity-scatter:
    path: /assets/images/module-02/week-06/mass-luminosity-relation.jpeg
    caption: "**What to notice:** Real mass-luminosity data from 509 binary star components with dynamically measured masses. Each gray circle is one star. The red solid line is a piecewise four-segment power-law fit; the blue dotted line is the classical single power law. Vertical tick marks show the mass boundaries between segments. The relation steepens at high masses ($L \\propto M^{\\sim 4}$) and flattens at low masses ($L \\propto M^{\\sim 2.3}$). Scatter increases above $\\sim 3\\,M_\\odot$ where stellar evolution is faster."
    alt: "Log-log scatter plot of stellar luminosity in solar units versus mass in solar units from Eker et al. 2018. Hundreds of gray data points form a tight diagonal band from lower-left (low mass, low luminosity) to upper-right (high mass, high luminosity). A red piecewise linear fit and blue dotted classical power-law fit overlay the data. Short vertical tick marks along the horizontal axis indicate mass boundaries between the four power-law segments."
    credit: "Eker et al. 2018, MNRAS 479, 5491"
    module: 2

  # ==============================================================
  # Module 3: Stellar Structure & Evolution
  # ==============================================================

  gaia-hr-diagram:
    path: /assets/images/module-03/Gaia_s_Hertzsprung-Russell_diagram.jpg
    caption: "**Gaia's Hertzsprung-Russell diagram.** Millions of stars trace the main sequence, giant branch, and white dwarf sequence. **What to notice:** a coeval stellar population will lose its highest-mass main-sequence stars first, so the turnoff point acts like a clock."
    alt: "Gaia Hertzsprung-Russell diagram showing a dense bright main sequence running diagonally, a giant branch above it, and a white dwarf sequence below, with axes for color, temperature, absolute magnitude, and luminosity."
    credit: "ESA/Gaia"
    module: 3

  hydrostatic-equilibrium:
    path: /assets/images/module-03/hydrostatic-equilibrium.png
    caption: "**What to notice:** hydrostatic equilibrium is local and layer-by-layer. The pressure gradient pushes outward on each shell while gravity pulls inward."
    alt: "Generated star cross-section with a highlighted shell, outward pressure-gradient arrows from deeper layers, inward gravity arrows from outer layers, and labels showing that each shell supports the weight above it."
    module: 3

  pp-chain:
    path: /assets/images/module-03/pp-chain.png
    caption: "**What to notice:** the proton-proton chain needs all four forces. Electromagnetism creates the barrier, tunneling permits close approach, the weak force throttles Step 1, and the strong force binds nucleons into nuclei once they are close enough."
    alt: "Generated reaction-flow diagram for the proton-proton chain showing proton-proton input, deuterium plus positron and neutrino in Step 1, helium-3 in Step 2, helium-4 plus two protons in Step 3, and force labels marking electromagnetic tunneling, weak conversion, and strong binding."
    module: 3

  stellar-endpoints:
    path: /assets/images/module-03/stellar-endpoints.svg
    caption: "Stellar remnants depend on initial mass"
    alt: "Chart showing white dwarf, neutron star, and black hole formation by mass"
    module: 3

  force-gravity:
    path: /assets/images/module-03/Gravitational_Final-NASA.png
    caption: "**Gravity** — the weakest force, but infinite in range and always attractive. Mass curves spacetime, creating the 'dents' that draw objects together."
    alt: "NASA infographic showing Earth and Moon creating dents in a spacetime grid, illustrating how mass warps the fabric of spacetime"
    credit: "NASA"
    module: 3

  force-electromagnetic:
    path: /assets/images/module-03/Electromagnetic_Force_Final-NASA.png
    caption: "**Electromagnetic force** — holds atoms together and creates the Coulomb barrier that resists nuclear fusion in stellar cores."
    alt: "NASA infographic showing a hydrogen atom with a proton and electron bound by the electromagnetic force"
    credit: "NASA"
    module: 3

  force-strong:
    path: /assets/images/module-03/Strong_Force_Final-NASA.png
    caption: "**Strong nuclear force** — the strongest force in nature, but acts only at nuclear distances (~10⁻¹³ cm). It binds quarks into protons and neutrons, and binds nucleons into nuclei."
    alt: "NASA infographic showing a proton and neutron composed of up and down quarks held together by the strong nuclear force"
    credit: "NASA"
    module: 3

  force-weak:
    path: /assets/images/module-03/Weak_Force_Final-NASA.png
    caption: "**Weak nuclear force** — enables transmutation between particle types. In the proton-proton chain, one proton is converted into a neutron through the weak interaction during the reaction $p + p \\rightarrow d + e^+ + \\nu_e$. This weak conversion is the bottleneck that makes solar hydrogen burning slow."
    alt: "NASA infographic for the weak interaction showing a quark-flavor change inside a proton, illustrating how one proton can be converted into a neutron during the first reaction of the proton-proton chain."
    credit: "NASA"
    module: 3

  warped-spacetime-bh:
    path: /assets/images/module-03/webb-STScI-blackholes-warped-spacetime.png
    caption: "Artist's concept of a black hole with an accretion disk. Matter spiraling inward is heated to extreme temperatures, glowing brightly. The black hole's gravity warps the surrounding spacetime so strongly that even light paths are bent — the glowing ring behind the black hole is visible above and below because spacetime curves light around it."
    alt: "Artist rendering of a supermassive black hole surrounded by a bright orange accretion disk, with light paths visibly warped by extreme spacetime curvature near the event horizon"
    credit: "NASA/STScI"
    module: 3

  anatomy-of-the-sun:
    path: /assets/images/module-03/anatomy-of-the-sun.png
    caption: "**Anatomy of the Sun.** This labeled cutaway distinguishes the core, radiative zone, convection zone, photosphere, chromosphere, and corona. **What to notice:** the fusion-powered core occupies only the central region; the visible surface is far from where the energy is generated."
    alt: "Annotated cutaway of the Sun showing the core, radiative zone, convection zone, photosphere, chromosphere, transition region, and corona, with temperature labels for the atmospheric layers and callouts to magnetic activity."
    credit: "NotebookLM-generated schematic"
    module: 3

  emc2-stellar-power:
    path: /assets/images/module-03/e-mc2-infographic.png
    caption: "**How $E = mc^2$ powers stars.** Four protons fuse into a helium-4 nucleus with a small mass deficit; that missing mass becomes energy in photons, neutrinos, and heat. **What to notice:** the efficiency is tiny ($\\varepsilon \\approx 0.007$), but the factor of $c^2$ makes the usable energy reservoir enormous compared with chemical burning."
    alt: "Infographic showing four protons entering fusion, a helium-4 nucleus as output, a small missing mass turned into energy via E equals m c squared, and comparison panels contrasting stellar fusion with chemical burning."
    credit: "NotebookLM-generated schematic"
    module: 3

  fusion-quantum-tunneling:
    path: /assets/images/module-03/fusion-quantum-tunneling.png
    caption: "**Quantum tunneling makes stellar fusion possible.** The Sun's core temperature is far below the classical barrier-crossing requirement, but the wave nature of protons gives a nonzero tunneling probability. **What to notice:** hydrostatic equilibrium gets the core hot enough to matter, and quantum mechanics does the rest."
    alt: "Infographic with a cutaway star on the left showing a 17 million kelvin solar core, and a zoomed microscopic view on the right showing protons with wave-like fuzziness tunneling through an electrostatic repulsion barrier to fuse."
    credit: "NotebookLM-generated schematic"
    module: 3

  stellar-stability-hse:
    path: /assets/images/module-03/stellar-stability-hse.png
    caption: "**Stellar stability as a tug-of-war with a thermostat.** Gravity pulls inward while hot gas pressure pushes outward. **What to notice:** the balance is not static; if pressure support drops, contraction heats the core and raises the fusion rate, helping restore equilibrium."
    alt: "Cutaway schematic of the Sun with inward blue gravity arrows and outward orange pressure arrows, plus callouts explaining hydrostatic equilibrium and the stellar thermostat effect."
    credit: "NotebookLM-generated schematic"
    module: 3

  stellar-tug-of-war-hse:
    path: /assets/images/module-03/stellar-tug-of-war-hse.png
    caption: "**Hydrostatic equilibrium in cross-section.** The figure contrasts inward gravitational compression with outward pressure support and labels the core, envelope, and atmosphere. **What to notice:** equilibrium is local and layer-by-layer, not a single force acting at the surface."
    alt: "Cutaway star diagram with curved arrows labeled gravity and pressure, labeled layers including atmosphere and radiative-convective envelopes, and side panels describing main-sequence stability, red giant expansion, and compact remnants."
    credit: "NotebookLM-generated schematic"
    module: 3

  # ── Generated figures (assets/scripts/make_module03_figures.py) ──

  timescale-hierarchy:
    path: /assets/images/module-03/timescale-hierarchy.png
    caption: "**What to notice:** the three stellar clocks are not just different; they are separated by enormous factors. The Kelvin-Helmholtz and nuclear timescales both follow the 'reservoir divided by luminosity' logic, while the dynamical clock is set by mean density."
    alt: "White-background comparison plot for the Sun's three stellar timescales with labeled bars for dynamical response, Kelvin-Helmholtz cooling, and nuclear lifetime, plus reference markers for hour, year, Myr, Gyr, and the age of the universe."
    credit: "ASTR 201 (generated)"
    module: 3

  timescales-vs-mass:
    path: /assets/images/module-03/timescales-vs-mass.png
    caption: '**What to notice:** the hierarchy $ \tau_{\text{dyn}} \ll \tau_{\text{KH}} \ll \tau_{\text{nuc}} $ survives across the main sequence. Massive stars still adjust quickly, but their thermal and nuclear clocks shrink drastically. Low-mass and high-mass caveat bands remind us where simple scaling laws bend.'
    alt: "Generated white-background log-log plot of stellar timescale versus stellar mass in solar units, with three labeled curves for dynamical, Kelvin-Helmholtz, and nuclear timescales, a marked Sun point, a dashed age-of-the-universe line, and shaded caveat bands at low and high mass."
    credit: "ASTR 201 (generated)"
    module: 3

  main-sequence-lifetime-vs-mass:
    path: /assets/images/module-03/main-sequence-lifetime-vs-mass.png
    caption: '**What to notice:** the naive $ \tau \propto M^{-2.5} $ guide captures the broad trend, but real low-mass stars live even longer because they access more of their fuel, while very massive-star lifetimes are longer than a blind high-mass extrapolation would predict.'
    alt: "Generated white-background log-log plot of main-sequence lifetime versus stellar mass showing a solid piecewise lifetime model, a dashed naive M to the minus 2.5 guide, a Sun marker, an age-of-the-universe line, and shaded caveat regions for fully convective low-mass stars and very massive stars."
    credit: "ASTR 201 (generated)"
    module: 3

  cluster-turnoff-clock:
    path: /assets/images/module-03/cluster-turnoff-clock.png
    caption: "**What to notice:** coeval clusters lose their hottest, most massive main-sequence stars first. The turnoff mass moves downward with age, which is why the turnoff acts like a clock."
    alt: "Three-panel schematic HR-style figure for 50 Myr, 700 Myr, and 6 Gyr star clusters showing the main sequence truncated at different turnoff masses and a short evolved branch peeling away from each turnoff point."
    credit: "ASTR 201 (generated)"
    module: 3

  fuel-vs-burn-rate:
    path: /assets/images/module-03/fuel-vs-burn-rate.png
    caption: "**What to notice:** the accessible fuel reservoir increases with stellar mass, but the luminosity increases much faster. That is the visual reason massive stars die young."
    alt: "Generated white-background log-log plot comparing accessible fuel reservoir and luminosity burn rate as functions of stellar mass, with labeled representative stars at 0.2, 1, and 10 solar masses."
    credit: "ASTR 201 (generated)"
    module: 3

  pressure-vs-pressure-gradient:
    path: /assets/images/module-03/pressure-vs-pressure-gradient.png
    caption: "**What to notice:** uniform pressure produces no net support. Only when the lower side pushes harder than the upper side does a shell feel a net outward pressure force."
    alt: "Two-panel didactic diagram comparing a gas shell with equal pressure on top and bottom to a gas shell with larger pressure below than above, alongside downward gravity arrows and net-force labels."
    credit: "ASTR 201 (generated)"
    module: 3

  hydrostatic-reasoning-ladder:
    path: /assets/images/module-03/hydrostatic-reasoning-ladder.png
    caption: "**What to notice:** stellar structure is a reasoning chain. Gravity sets the inward pull, hydrostatic equilibrium sets the required pressure gradient, the pressure scale implies a central pressure, and the ideal-gas picture turns that into a core temperature scale."
    alt: "Horizontal five-step flowchart for hydrostatic equilibrium with rounded boxes labeled Gravity, Force Balance, Pressure Scale, Gas Pressure, and Temperature Scale, each containing the key equation and connected by arrows."
    credit: "ASTR 201 (generated)"
    module: 3

  hydrostatic-shell-force-balance:
    path: /assets/images/module-03/hydrostatic-shell-force-balance.png
    caption: "**What to notice:** the hydrostatic equation comes directly from shell bookkeeping. Pressure on the inner face pushes outward, pressure on the outer face pushes inward, and gravity pulls the shell inward."
    alt: "Generated shell-force diagram with a rectangular gas shell labeled by density rho, area A, and thickness dr, plus arrows and equations for the inner pressure force, outer pressure force, and inward gravitational force."
    credit: "ASTR 201 (generated)"
    module: 3

  toy-star-radial-profiles:
    path: /assets/images/module-03/toy-star-radial-profiles.png
    caption: "**What to notice:** even a uniform-density toy star teaches the right qualitative lesson. Enclosed mass grows outward, gravity rises roughly linearly inside, and pressure must peak at the center."
    alt: "Three-panel generated toy-model plot showing normalized enclosed mass, gravitational acceleration, and pressure as functions of fractional radius inside a uniform-density star."
    credit: "ASTR 201 (generated)"
    module: 3

  pressure-gradient-scale-estimate:
    path: /assets/images/module-03/pressure-gradient-scale-estimate.png
    caption: '**What to notice:** the pressure profile is smooth across a scale of order the stellar radius, so the pressure-gradient scale is set by a total drop of order $P_c$ across a distance of order $R$. That is why $dP/dr \sim P_c/R$ is a sensible scaling estimate.'
    alt: "Single-panel plot of normalized pressure versus fractional radius for a smooth toy stellar profile, with labels marking central pressure, near-zero surface pressure, a vertical delta-P arrow, a horizontal delta-r arrow, and a dashed secant representing the scale estimate P_c over R."
    credit: "ASTR 201 (generated)"
    module: 3

  central-pressure-scaling-grid:
    path: /assets/images/module-03/central-pressure-scaling-grid.png
    caption: '**What to notice:** central pressure depends strongly on compactness. Holding mass fixed while shrinking the radius drives the required support sharply upward because $P_c \sim GM^2/R^4$.'
    alt: "Generated heatmap of logarithmic central pressure in dynes per square centimeter as a function of stellar mass and radius in solar units, with contour labels and a marked Sun point."
    credit: "ASTR 201 (generated)"
    module: 3

  radiation-pressure-mass-scaling:
    path: /assets/images/module-03/radiation-pressure-mass-scaling.png
    caption: '**What to notice:** even a rough hydrostatic scaling predicts that radiation pressure becomes far more important in higher-mass stars. Relative to the Sun, the ratio $P_{\text{rad}}/P_{\text{gas}}$ grows roughly as $M^2$.'
    alt: "Log-log plot of stellar mass versus the relative importance of radiation pressure compared with gas pressure, normalized so the Sun equals one, with markers at 1, 10, and 30 solar masses and an annotation explaining the M squared scaling."
    credit: "ASTR 201 (generated)"
    module: 3

  virial-energy-partition:
    path: /assets/images/module-03/virial-energy-partition.png
    caption: '**What to notice:** the virial theorem fixes the bookkeeping: $K_{\text{th}} = -\tfrac{1}{2}U_{\text{grav}}$ and $E_{\text{tot}} < 0$. That is why a star can lose energy, contract, and still get hotter.'
    alt: "Two-panel generated figure with a virial energy ledger bar chart for gravitational, thermal, and total energy on the left and a causal chain from radiating energy to core heating on the right."
    credit: "ASTR 201 (generated)"
    module: 3

  core-temperature-scaling:
    path: /assets/images/module-03/core-temperature-scaling.png
    caption: "**What to notice:** hydrostatic equilibrium sets a fusion-scale temperature for every main-sequence star, but the core temperature rises only modestly with mass because more massive stars are also larger."
    alt: "Generated log-log plot of core temperature scale in megakelvin versus stellar mass, showing a hydrostatic scaling curve based on T proportional to M over R, a Sun point, and a dashed comparison for the unrealistic fixed-radius case."
    credit: "ASTR 201 (generated)"
    module: 3

  fusion-force-scale-map:
    path: /assets/images/module-03/fusion-force-scale-map.png
    caption: "**What to notice:** each force dominates a different part of the fusion problem. Gravity sets the whole-star conditions, electromagnetism controls the charged encounter, and the weak and strong interactions matter only once the particles reach nuclear scales."
    alt: "Generated log-scale diagram of characteristic length scale in centimeters with labeled rows for gravity, electromagnetism, strong interaction, and weak interaction. Short bars show the strong and weak interactions only at nuclear and subnuclear scales, while gravity is marked at whole-star scale and electromagnetism across the charged-encounter regime."
    credit: "ASTR 201 (generated)"
    module: 3

  maxwell-boltzmann-speeds-solar-core:
    path: /assets/images/module-03/maxwell-boltzmann-speeds-solar-core.png
    caption: "**What to notice:** 'hot' does not mean every proton moves at one speed. The solar-core protons follow a Maxwell-Boltzmann speed distribution with distinct most-probable, mean, and rms speeds."
    alt: "Generated white-background plot of the normalized Maxwell-Boltzmann speed distribution for protons in the 15 million kelvin solar core, with vertical lines marking the most probable, mean, and rms speeds."
    credit: "ASTR 201 (generated)"
    module: 3

  fusion-energy-scale-ladder:
    path: /assets/images/module-03/fusion-energy-scale-ladder.png
    caption: "**What to notice:** the key proton-fusion energies are not close together. The thermal scale and the Gamow-window peak live at a few keV, while the Coulomb barrier is around $1.4\\,\\mathrm{MeV}$ — about a thousand times larger."
    alt: "Generated log-scale energy ladder in keV with labeled markers for k sub B T near 1.3 keV, mean kinetic energy near 1.9 keV, a few-keV Gamow-window peak, and the Coulomb barrier near 1400 keV, plus an arrow labeling the roughly thousand-fold gap."
    credit: "ASTR 201 (generated)"
    module: 3

  maxwell-boltzmann-energies-barrier-tail:
    path: /assets/images/module-03/maxwell-boltzmann-energies-barrier-tail.png
    caption: "**What to notice:** the Coulomb barrier sits far out in the Maxwell-Boltzmann tail. A few-keV thermal scale and a MeV barrier are so far apart that classical fusion is effectively impossible."
    alt: "Generated semilog plot of the normalized Maxwell-Boltzmann proton energy distribution in the solar core, with labels for k_B T, three-halves k_B T, the 1.4 MeV Coulomb barrier, and the classically accessible tail region."
    credit: "ASTR 201 (generated)"
    module: 3

  coulomb-barrier-and-tunneling:
    path: /assets/images/module-03/coulomb-barrier-and-tunneling.png
    caption: "**What to notice:** a few-keV proton turns around at a classical turning point far outside nuclear distance, but its wavefunction does not stop there. The exponential decay through the forbidden region is the tunneling story."
    alt: "Generated log-scale separation-versus-potential plot for proton-proton fusion, showing Coulomb repulsion, a schematic total potential with short-range nuclear attraction, a few-keV thermal-energy line, the classically forbidden region between about 1 fm and the turning point, and a blue schematic wavefunction amplitude that oscillates outside the barrier and decays through it."
    credit: "ASTR 201 (generated)"
    module: 3

  gamow-window-cartoon:
    path: /assets/images/module-03/gamow-window-cartoon.png
    caption: "**What to notice:** low-energy collisions are common but tunnel poorly; high-energy collisions tunnel better but are rare. Fusion comes mostly from a narrow middle window."
    alt: "Generated pedagogical plot showing a Maxwell factor, a tunneling factor, and their combined product versus collision energy, with a labeled Gamow-like peak."
    credit: "ASTR 201 (generated)"
    module: 3

  fusion-logic-flow:
    path: /assets/images/module-03/fusion-logic-flow.svg
    caption: "**What to notice:** the quantum part of the fusion story is a causal chain, not a list. Classical fusion fails because the Coulomb barrier is too high, wave behavior removes the exact-trajectory picture, tunneling allows rare close approaches, and the weak interaction then sets the overall rate."
    alt: "Generated horizontal flow diagram with rounded boxes and arrows showing the sequence gravity compresses the core, the Coulomb barrier blocks classical fusion, the de Broglie wavelength makes the proton behave like a wave, uncertainty removes the exact classical trajectory, tunneling allows rare close approach, and the weak interaction sets the actual fusion rate."
    credit: "ASTR 201 (generated)"
    module: 3

  debroglie-vs-nuclear-scale:
    path: /assets/images/module-03/debroglie-vs-nuclear-scale.svg
    caption: "**What to notice:** the solar-core proton's de Broglie wavelength is hundreds of times larger than the nuclear scale. That is why the proton cannot be treated as a tiny classical bead at the barrier."
    alt: "Generated log-scale length ruler in centimeters with labeled markers for the nuclear scale near 10 to the minus 13 centimeters, the solar-core proton de Broglie wavelength near 6.5 times 10 to the minus 11 centimeters, and an atomic scale near 10 to the minus 8 centimeters, with an annotation emphasizing the hundreds-fold gap between the proton wavelength and the nuclear scale."
    credit: "ASTR 201 (generated)"
    module: 3

  localization-wavepackets:
    path: /assets/images/module-03/localization-wavepackets.svg
    caption: "**What to notice:** a tightly localized wave packet must contain many wavelengths and therefore a broad momentum spread. A broad packet is less localized in space but has a narrower momentum spread. This is why the uncertainty principle is a wave-packet tradeoff, not a measurement failure."
    alt: "Generated two-panel wave-packet comparison. The top panel shows a narrow spatial packet with many oscillations labeled small Delta x and large Delta p. The bottom panel shows a broad packet with fewer oscillations labeled large Delta x and small Delta p."
    credit: "ASTR 201 (generated)"
    module: 3

  classical-vs-quantum-barrier:
    path: /assets/images/module-03/classical-vs-quantum-barrier.svg
    caption: "**What to notice:** classical motion predicts a sharp turning point and reflection, while the quantum wavefunction extends into and through the barrier. The barrier is no longer an absolute boundary."
    alt: "Generated two-panel barrier comparison. The left panel shows a classical particle with energy below the barrier reflecting at a turning point. The right panel shows a wavefunction oscillating before the barrier, decaying exponentially inside the forbidden region, and remaining nonzero beyond the barrier."
    credit: "ASTR 201 (generated)"
    module: 3

  gamow-window-upgraded:
    path: /assets/images/module-03/gamow-window-upgraded.svg
    caption: "**What to notice:** low-energy collisions are common but tunnel poorly, while high-energy collisions tunnel better but are rare. Most fusion comes from the narrow overlap where those two effects balance."
    alt: "Generated schematic Gamow-window plot versus collision energy in keV, showing a thermal-rarity curve, a tunneling-transmission curve, their combined overlap curve, a shaded Gamow window, and labeled markers for k sub B T and the peak."
    credit: "ASTR 201 (generated)"
    module: 3

  binding-energy-curve:
    path: /assets/images/module-03/binding-energy-curve.png
    caption: "**What to notice:** moving upward on the binding-energy curve means moving to a lower total mass-energy. That is why fusion releases energy up to the broad iron/nickel peak, while fusion beyond that region costs energy."
    alt: "Generated binding-energy-per-nucleon plot versus mass number with highlighted isotopes from hydrogen through uranium, a labeled iron-nickel region near the broad maximum, and annotations marking the fusion-energy and fission-energy sides of the curve."
    credit: "ASTR 201 (generated)"
    module: 3

  fusion-energy-budget:
    path: /assets/images/module-03/fusion-energy-budget.png
    caption: "**What to notice:** the pp-chain releases about $26.7\\,\\mathrm{MeV}$ per net reaction, but only about $0.5\\,\\mathrm{MeV}$ escapes in neutrinos. Almost all of the energy stays in the star and powers the luminosity."
    alt: "Generated energy-budget figure for one net proton-proton-chain reaction, showing the mass deficit in amu, the total energy release in MeV, and a horizontal bar splitting the energy into a large retained component and a small neutrino-loss component."
    credit: "ASTR 201 (generated)"
    module: 3

  fusion-energy-flow:
    path: /assets/images/module-03/fusion-energy-flow.svg
    caption: "**What to notice:** fusion energy is born in the core, mostly stays in the star, and only later escapes as luminosity. The neutrino channel leaves quickly, but the photon energy must thermalize and diffuse outward through the stellar interior."
    alt: "Horizontal flow diagram showing core mass deficit producing gamma rays and particle kinetic energy, a small branch for escaping neutrinos, then thermalization in dense plasma, photon diffusion through the star, and final surface luminosity."
    credit: "ASTR 201 (SVG)"
    module: 3

  nuclear-stellax-why-sun-shines:
    path: /assets/images/module-03/nuclear-stellax/teaching_why_sun_shines.png
    caption: "**What to notice:** there is an astrophysically narrow window between 'too cool to sustain hydrogen burning' and 'so hot that the rate skyrockets.' The Sun sits in that middle regime, where fusion is strong enough to power the star but still slow enough to last billions of years."
    alt: "Log-log plot of nuclear energy generation rate per unit mass versus core temperature. A shaded cool region is labeled no fusion or brown dwarf, and the Sun is marked near 1.57 times 10 to the 7 kelvin at roughly 10 squared erg per gram per second."
    module: 3

  nuclear-stellax-thermostat:
    path: /assets/images/module-03/nuclear-stellax/teaching_thermostat.png
    caption: "**What to notice:** the temperature sensitivity of nuclear burning changes with temperature. The dashed guides mark the textbook pp and CNO scalings, while the full curve shows that the Sun already lives in a strongly temperature-sensitive regime. That sensitivity is what makes fusion a thermostat."
    alt: "Plot of the logarithmic temperature sensitivity nu equals d ln epsilon over d ln T versus temperature. The Sun is marked near 1.7 times 10 to the 7 kelvin with nu about 17, and dashed reference lines indicate pp burning near 4 and CNO burning near 16."
    module: 3

  nuclear-stellax-gamow-peak:
    path: /assets/images/module-03/nuclear-stellax/teaching_gamow_peak.png
    caption: "**What to notice:** the Gamow window depends on both temperature and reaction type. At the Sun's temperature the pp window sits at only a few keV, while the CNO window lies at higher energy because the Coulomb barrier is larger."
    alt: "Two-panel plot of normalized reaction-probability windows versus energy for pp and carbon-proton reactions. The left panel is for solar temperature, the right for a hotter 10-solar-mass star, with pp peaks at lower energies than CNO peaks in both cases."
    module: 3

  nuclear-stellax-pp-chain-network:
    path: /assets/images/module-03/nuclear-stellax/proton-proton_reaction_chain.png
    caption: "**What to notice:** this textbook-style pp-chain diagram makes the particle bookkeeping explicit. Two deuterium-forming branches feed into helium-3 production, and the chain closes when two helium-3 nuclei fuse to make helium-4 and return two protons."
    alt: "Textbook-style proton-proton reaction chain diagram showing two parallel proton-proton reactions that produce deuterium plus a positron and a neutrino, followed by deuterium plus proton to helium-3 plus gamma ray, and a final helium-3 plus helium-3 reaction that makes helium-4 and returns two protons. A legend identifies proton, neutron, positron, gamma ray, and neutrino."
    module: 3

  nuclear-stellax-cno-cycle-network:
    path: /assets/images/module-03/nuclear-stellax/cno-cycle-fusion.jpg
    caption: "**What to notice:** the CNO cycle is a catalytic loop. Carbon-12 is restored at the end, while four protons are effectively turned into one helium-4 nucleus plus gamma rays, positrons, and neutrinos."
    alt: "Textbook-style CNO cycle diagram showing a loop from carbon-12 through nitrogen-13, carbon-13, nitrogen-14, oxygen-15, and nitrogen-15 back to carbon-12, with proton captures, gamma rays, positrons, neutrinos, and helium-4 emission marked along the cycle."
    module: 3

  nuclear-stellax-pp-vs-cno:
    path: /assets/images/module-03/nuclear-stellax/nuclear_pp_vs_cno.png
    caption: "**What to notice:** pp burning dominates in Sun-like cores, but the CNO cycle overtakes it once the core reaches roughly $18\\,\\mathrm{MK}$. That crossover is why more massive main-sequence stars are powered by a different hydrogen-burning pathway."
    alt: "Semilog plot of nuclear energy generation rate versus temperature in megakelvin comparing pp and CNO burning at fixed density and composition. The curves cross near 18 megakelvin, with the CNO curve rising much more steeply."
    module: 3

  nuclear-stellax-epsilon-network:
    path: /assets/images/module-03/nuclear-stellax/network_epsilon_vs_T.png
    caption: "**What to notice:** as temperature rises, the dominant nuclear network changes in stages: pp to CNO, then triple-alpha ignition, then the advanced carbon, neon, oxygen, and silicon burning regimes. The lower panel shows where the more detailed networks begin to differ from a basic hydrogen-burning approximation."
    alt: "Two-panel figure of nuclear energy generation rate versus temperature. The upper panel shows three model curves across pp, CNO, alpha-burning, and advanced-burning transitions marked by vertical lines. The lower panel shows the ratio of two more detailed networks to a basic reference network."
    module: 3

  nuclear-stellax-main-sequence-burning-map:
    path: /assets/images/module-03/nuclear-stellax/teaching_mass_density.png
    caption: "**What to notice:** main-sequence stars occupy different places in temperature-density space. Low-mass stars lie on the pp side of the boundary, while hotter massive stars sit on the CNO side."
    alt: "Color heatmap of log nuclear energy generation rate for hydrogen burning as a function of log temperature and log density, with a dashed pp-equals-CNO boundary and labeled points for stars from 0.3 to 25 solar masses including the Sun."
    module: 3

  nuclear-stellax-pp-cno-3alpha:
    path: /assets/images/module-03/nuclear-stellax/teaching_pp_cno_3alpha.png
    caption: "**What to notice:** hydrogen burning via pp and CNO occupies the tens-of-megakelvin regime, while triple-alpha does not turn on until about $10^8\\,\\mathrm{K}$. The mass markers show why Sun-like stars, massive stars, and helium-burning cores live on different parts of the temperature axis."
    alt: "Log plot of nuclear energy generation rate versus temperature comparing pp, CNO, and triple-alpha burning. Markers show representative stellar masses, the Sun, the pp-to-CNO crossover near 1.8 times 10 to the 7 kelvin, and triple-alpha ignition near 10 to the 8 kelvin."
    module: 3

  nuclear-stellax-burning-stages:
    path: /assets/images/module-03/nuclear-stellax/teaching_burning_stages.png
    caption: "**What to notice:** each successive burning stage in a massive star occurs at higher temperature and lasts dramatically less time. Hydrogen burning lasts millions of years, but silicon burning lasts only about a day before iron halts exothermic fusion."
    alt: "Two-panel figure titled from hydrogen to iron. The left panel shows energy generation versus temperature with labeled vertical markers for hydrogen, helium, carbon, neon, oxygen, and silicon burning. The right panel is a bar chart of burning timescales for a 25-solar-mass star, shrinking from millions of years for hydrogen to one day for silicon."
    module: 3

  random-walk:
    path: /assets/images/module-03/random-walk.png
    caption: '**Toy walk plus one-zone solar scaling.** The left panel is a simulated 2,000-step random walk that makes the $\sqrt{N}$ scaling visible. The right panel is a separate one-zone solar estimate using a mean free path of about 0.02 cm, about $10^{25}$ interactions, and a diffusion time of about 260,000 years. Students should not read the left-panel geometry as a literal solar trajectory.'
    alt: "Two-panel figure. Left panel shows a colorful 2000-step toy random walk with a start point, end point, and net-displacement arrow. Right panel summarizes a separate one-zone solar estimate with mean free path about 0.02 centimeters, about 10 to the 25 scatterings, diffusion time of a few times 10 to the 5 years, and straight-line time of 2.3 seconds."
    credit: "ASTR 201 (generated)"
    module: 3

  optical-depth-slab:
    path: /assets/images/module-03/optical-depth-slab.png
    caption: "**What to notice:** optical depth is a count of how many mean free paths fit across a region. In the optically thin case, $\ell > R$ and a photon usually crosses without interacting. In the optically thick case, $\ell \ll R$, so many short steps fit across the same slab thickness and transport becomes interaction-dominated."
    alt: "Two-panel optical-depth cartoon. The left panel shows an optically thin slab with slab thickness R shorter than the mean free path ell and a photon crossing essentially straight through. The right panel shows an optically thick slab with slab thickness R much larger than ell, marked by many short interaction steps across the slab. Each panel labels tau as approximately R over ell."
    credit: "ASTR 201 (generated)"
    module: 3

  random-walk-scaling:
    path: /assets/images/module-03/random-walk-scaling.png
    caption: "**What to notice:** the total path length grows as $N\\ell$, but the net displacement grows only as $\sqrt{N}\\,\\ell$. The widening gap is why random walks are so inefficient: after many steps, most of the travel has been spent getting redirected rather than making net outward progress."
    alt: "Log-log plot of distance scale versus number of steps N. One line shows total path length proportional to N times ell, and a lower line shows net displacement proportional to square root of N times ell. Callouts mark the slope 1 and slope one-half behavior and note that at one million steps the path length is about a million ell while the displacement is only about a thousand ell."
    credit: "ASTR 201 (generated)"
    module: 3

  radiative-flux-opacity:
    path: /assets/images/module-03/radiative-flux-opacity.png
    caption: "**What to notice:** a temperature gradient creates an outward radiative flux, but opacity throttles how much energy that gradient can carry. For the same density and the same $d(aT^4)/dr$, increasing $\kappa$ by a factor of 10 reduces $F_\\text{rad}$ by the same factor."
    alt: "Two-panel radiative diffusion figure. The left panel shows normalized radiation energy density decreasing outward with arrows indicating a larger outward flux for low opacity and a smaller outward flux for high opacity. The right panel is a log-log plot of relative radiative flux versus relative opacity showing an inverse relationship, with a note that ten times higher opacity gives ten times smaller flux."
    credit: "ASTR 201 (generated)"
    module: 3

  radiation-vs-convection-transport:
    path: /assets/images/module-03/radiation-vs-convection-transport.png
    caption: "**What to notice:** both panels show the same center-to-surface slice, but the transport mechanism is completely different. On the left, radiation diffuses by a random walk of many tiny steps because high opacity keeps the mean free path short. On the right, convection moves energy by large-scale circulation: hot, low-density plasma rises and cool, high-density plasma sinks."
    alt: "Two-panel comparison titled energy transport in stars: radiation versus convection. The left panel shows a vertical stellar slice from center at bottom to surface at top, with tangled short photon paths labeled random walk and notes about many small steps, inefficient transport, and short mean free path at high opacity. The right panel shows the same slice with two large convection cells, red upward arrows for hot rising plasma, blue downward arrows for cool sinking plasma, and a note that bulk motion transports energy."
    credit: "ASTR 201 (generated)"
    module: 3

  stellar-structure-coupling:
    path: /assets/images/module-03/stellar-structure-coupling.svg
    caption: "**What to notice:** the four stellar structure equations form a coupled loop. Mass and luminosity profiles feed the pressure and radiative gradients, while the equation of state, opacity law, nuclear rate, and boundary conditions close the system."
    alt: "Ring diagram of the stellar structure problem with boxes for mass conservation, hydrostatic equilibrium, radiative transport, and energy generation around a central closure box listing the equation of state, opacity law, nuclear rate, and boundary conditions. Arrows show that each equation depends on quantities supplied by the others."
    credit: "ASTR 201 (generated)"
    module: 3

  main-sequence-scaling-ladder:
    path: /assets/images/module-03/main-sequence-scaling-ladder.svg
    caption: "**What to notice:** the steep mass-luminosity relation is the end of a reasoning chain. Mean density sets the pressure scale, pressure sets the core-temperature scale, and radiative transport then drives the luminosity toward $L \\propto M^3/\\kappa$."
    alt: "Left-to-right ladder of four scaling boxes showing density proportional to mass over radius cubed, central pressure proportional to G times mass squared over radius to the fourth, core temperature proportional to mass over radius, and luminosity proportional to mass cubed over opacity. A lower branch adds the lifetime scaling tau proportional to mass over luminosity."
    credit: "ASTR 201 (generated)"
    module: 3

  convection-stability-cartoon:
    path: /assets/images/module-03/convection-stability-cartoon.svg
    caption: "**What to notice:** convection is a stability problem. In a stable radiative layer the displaced parcel cools more than its surroundings and sinks back, but when the radiative gradient is steeper than the adiabatic gradient the parcel stays warmer and keeps rising."
    alt: "Two-panel convection cartoon. The left panel shows a stable radiative layer where an upward-displaced parcel ends up cooler than the surroundings and sinks. The right panel shows an unstable layer where the surroundings cool more rapidly, so the parcel remains warmer and continues to rise. Small line plots compare the parcel and surroundings gradients and label the Schwarzschild criterion."
    credit: "ASTR 201 (generated)"
    module: 3

  eddington-force-balance:
    path: /assets/images/module-03/eddington-force-balance.png
    caption: "**What to notice:** the Eddington luminosity comes from a force balance on the same gas parcel. Gravity pulls inward with $g = GM/r^2$, while radiation pushes outward with $g_\\text{rad} = \\kappa L/(4\\pi r^2 c)$. Setting those equal gives the luminosity at which radiation pressure can compete directly with gravity."
    alt: "Schematic showing a star on the left and a gas parcel in the envelope on the right. An inward arrow labeled gravity points from the parcel toward the star, and an outward arrow labeled radiative acceleration points away from the star. Text boxes show g equals GM over r squared, g_rad equals kappa L over four pi r squared c, and the Eddington limit condition g_rad equals g."
    credit: "ASTR 201 (generated)"
    module: 3

  diffusion-vs-straight-line:
    path: /assets/images/module-03/diffusion-vs-straight-line.svg
    caption: "**What to notice:** a straight-line beam crosses the star in one stellar radius, but radiative diffusion follows a tangled path whose total length is vastly larger. The step size stays tiny, so the transport time explodes even though each individual step is taken at the speed of light."
    alt: "Two-panel comparison between straight streaming and radiative diffusion. The left panel shows a direct path from the stellar core to the surface. The right panel shows a tangled random-walk path with many short steps reaching the same surface only after a much longer total path."
    credit: "Course illustration (A. Rosen)"
    module: 3

  stellar-structure-zones:
    path: /assets/images/module-03/stellar-structure-zones.png
    caption: "**What to notice:** this schematic compares the two non-fully-convective archetypes on the main sequence. Solar-like stars have radiative cores and convective envelopes, while higher-mass stars reverse that pattern and develop convective cores with radiative envelopes. The very lowest-mass stars are a third regime and are often nearly fully convective."
    alt: "Side-by-side cross-sections of a solar-like star with a radiative core and convective envelope and a higher-mass star with a convective core and radiative envelope, with transport mechanisms indicated by arrows and circulation patterns. The figure does not include the separate very-low-mass fully convective regime."
    credit: "ASTR 201 (generated)"
    module: 3

  mass-limits-spectrum:
    path: /assets/images/module-03/mass-limits-spectrum.png
    caption: "**The stellar mass spectrum** with its quantum floor and radiation ceiling. Below ~0.08 M☉, degeneracy pressure halts contraction before the core reaches fusion temperature — these are brown dwarfs. Above ~150 M☉, radiation pressure exceeds gravity (Eddington limit) and tears the star apart. The IMF (Salpeter slope dN/dM ∝ M⁻²·³⁵) shows that low-mass stars vastly outnumber high-mass ones."
    alt: "Plot showing the initial mass function as relative number versus log stellar mass, with vertical dashed lines marking the hydrogen-burning minimum at 0.08 solar masses and the Eddington limit at 150 solar masses. Brown dwarf and hydrogen-burning star regions are shaded. Key objects (Jupiter, M dwarf, Sun, Sirius, Spica) are marked."
    credit: "ASTR 201 (generated)"
    module: 3

  onion-shell-burning:
    path: /assets/images/module-03/onion-shell-burning.png
    caption: "**Onion-shell structure** of a 25 M☉ star moments before core collapse. Each concentric shell burns a different fuel at a higher temperature, on a dramatically shorter timescale. Hydrogen burning lasts millions of years; silicon burning lasts about one day. The inert iron core at the center is nuclear ash — when it exceeds the Chandrasekhar limit, collapse is inevitable."
    alt: "Concentric colored circles representing burning shells of a massive star from outside in: hydrogen (blue), helium (cyan), carbon (green), neon (yellow), oxygen (orange), silicon (red), and iron core (dark red). Each shell is labeled with fuel, temperature, and burning duration."
    credit: "ASTR 201 (generated)"
    module: 3

  wd-mass-radius:
    path: /assets/images/module-03/wd-mass-radius.png
    caption: "**White dwarf mass-radius relation.** More massive white dwarfs are *smaller* — the counter-intuitive result of R ∝ M⁻¹/³ from degeneracy pressure. The full relativistic curve (solid) plunges to R = 0 at the Chandrasekhar limit (1.44 M☉), where electron degeneracy can no longer support the star. Beyond this mass, gravity wins."
    alt: "Plot of white dwarf radius in Earth radii versus mass in solar masses, showing non-relativistic power law R proportional to M^(-1/3) as dashed line and full relativistic curve dropping to zero radius at the Chandrasekhar limit of 1.44 solar masses. Sirius B and a typical white dwarf are marked."
    credit: "ASTR 201 (generated)"
    module: 3

  compact-object-scale:
    path: /assets/images/module-03/compact-object-scale.png
    caption: "**Size comparison of compact objects.** Earth and a typical white dwarf are similar in size (~6,000 km radius), but the white dwarf packs ~0.6 M☉ into that volume. A neutron star is ~600× smaller (~10 km radius) with ~1.4 M☉. A stellar-mass black hole's Schwarzschild radius is comparable to the neutron star — but it has no surface at all."
    alt: "Four objects shown to approximate scale: Earth (6,371 km), white dwarf (6,000 km, 0.6 solar masses), neutron star (10 km, 1.4 solar masses), and black hole (Schwarzschild radius 8.9 km, 3 solar masses). Densities labeled for each."
    credit: "ASTR 201 (generated)"
    module: 3

  # ── Existing images added to registry ──────────────────────────

  # R3: Nuclear Fusion
  standard-model-particles:
    path: /assets/images/module-03/DOE-standard-model.png
    caption: "**The Standard Model of particle physics** organizes all known fundamental particles. Quarks (orange) make up protons and neutrons via the strong force. Leptons (green) include the electron and three types of neutrino. Bosons (blue) carry the forces: photons (EM), gluons (strong), W/Z bosons (weak), and the Higgs. Stellar physics uses all four forces — gravity is not included in the Standard Model because it is described by general relativity."
    alt: "Circular diagram of the Standard Model showing quarks (up, down, charm, strange, top, bottom) in orange, leptons (electron, muon, tau, and their neutrinos) in green, force-carrying bosons (photon, gluon, W, Z) in blue, and the Higgs boson in purple at center."
    credit: "DOE/Fermilab"
    module: 3

  # R6: Mass Limits
  eta-carinae-hubble:
    path: /assets/images/module-03/Hubble_EtaCarinae.jpeg
    caption: "**Eta Carinae** — one of the most massive and luminous stars in the Milky Way (~100–150 M☉, ~5 × 10⁶ L☉). It sits at the Eddington limit, where radiation pressure nearly overwhelms gravity. The bipolar Homunculus Nebula was ejected during the 'Great Eruption' of the 1840s, when the star briefly became the second-brightest star in the sky. This is what happens when a star pushes against the maximum mass ceiling."
    alt: "Hubble Space Telescope image of Eta Carinae showing a brilliant central star surrounded by two large bipolar lobes of ejected gas and dust (the Homunculus Nebula), glowing in orange-white with fainter red nebulosity extending outward."
    credit: "NASA/ESA/HST; Processing: Judy Schmidt"
    module: 3

  # R7: Low-Mass Evolution
  hr-post-ms-tracks:
    path: /assets/images/module-03/hrpostmainsuntrack.jpg
    caption: "**Evolutionary tracks off the main sequence** for stars of different masses. A solar-mass star ascends the Red Giant Branch (RGB), undergoes the helium flash, moves to the Horizontal Branch (HB), climbs the Asymptotic Giant Branch (AGB), and ends as a white dwarf. More massive stars (5, 10 M☉) take wider loops through the supergiant region. The labeled phases (RGB, HB, AGB) correspond to the physical stages described in this reading."
    alt: "HR diagram with absolute magnitude on vertical axis and color index on horizontal axis, showing evolutionary tracks for approximately 1, 5, and 10 solar mass stars. The Sun's position is marked on the main sequence. Blue arrows trace each track through labeled phases: Red Giant Branch, Horizontal Branch, Asymptotic Giant Branch, and white dwarf region."
    module: 3

  h-shell-burning-rgb:
    path: /assets/images/module-03/hshellburningsml.jpg
    caption: "**Hydrogen shell burning on the Red Giant Branch.** When core hydrogen is exhausted, a shell of hydrogen burns around the inert helium core. The helium ash accumulates, growing the core mass. Meanwhile, the enormous energy output from the shell drives the outer envelope to expand and cool — the star becomes a red giant. The expanded, cool, hydrogen-rich outer envelope is hundreds of times larger than the tiny burning region at its heart."
    alt: "Cross-section diagram of a red giant star showing a small blue helium-rich core at center, a red hydrogen-burning shell surrounding it with arrows showing helium being deposited into the core, and a vastly larger expanded orange outer envelope. Labels indicate increased radiation pressure driving the expansion."
    module: 3

  agb-core-structure:
    path: /assets/images/module-03/carbonshell_AGB.jpeg
    caption: "**Internal structure of an AGB star** (close-up of the core region for a ~1 M☉ star). The inert carbon-oxygen core sits at the center, surrounded by a helium-burning shell, a helium layer, and an outer hydrogen-burning shell. The entire core structure fits inside a region smaller than the Earth, while the stellar envelope extends to ~1–1.5 AU. Not to scale."
    alt: "Cutaway diagram showing the layered core of an Asymptotic Giant Branch star: a dark carbon-oxygen core at center with no fusion, surrounded by a blue helium-burning shell, a helium layer, and an outer red hydrogen-burning shell. An inset shows the full AGB star with radius labeled as approximately 1 to 1.5 AU."
    module: 3

  triple-alpha-process:
    path: /assets/images/module-03/3Alpha_Process.png
    caption: "**The triple-alpha process** — how stars build carbon from helium. Two ⁴He nuclei fuse to form unstable ⁸Be, which normally decays in ~10⁻¹⁶ s. But at the extreme densities and temperatures of helium burning (~10⁸ K), a third ⁴He captures onto ⁸Be before it decays, producing stable ¹²C and releasing gamma rays. Fred Hoyle predicted the nuclear resonance state that makes this reaction possible — from the mere *existence* of carbon in the universe."
    alt: "Diagram showing the triple-alpha reaction in three steps: two helium-4 nuclei (each with 2 protons and 2 neutrons) collide to form beryllium-8, which then captures a third helium-4 to produce carbon-12 and gamma rays. Protons shown in red, neutrons in gray."
    module: 3

  # R9: High-Mass Evolution & Supernovae
  massive-star-hr-evolution:
    path: /assets/images/module-03/MassiveStar_Evolution_HR.jpeg
    caption: "**Evolutionary tracks of massive stars** (9, 25, 40, and 85 M☉) on the HR diagram. All begin on the upper main sequence and evolve rightward toward lower temperatures as they become supergiants. The tracks loop back and forth as successive nuclear burning stages ignite and exhaust. The most massive stars stay at nearly constant luminosity — their cores are so hot that the luminosity is set by the Eddington limit, not by the details of nuclear burning."
    alt: "HR diagram with dark background showing the main sequence as a luminous diagonal band from lower-right to upper-left. Colored evolutionary tracks for 9, 25, 40, and 85 solar mass stars extend rightward from the main sequence into the red supergiant region, with looping paths indicating different burning phases. The Sun is labeled near the middle of the main sequence."
    module: 3

  neutrino-loss-table:
    path: /assets/images/module-03/NeutrinoLoss_Table.png
    caption: "**Evolution of a 15 M☉ star** from hydrogen burning to iron core collapse. Each successive burning stage is shorter, hotter, and denser. The key column is the last one: **neutrino losses** (in solar luminosities). By carbon burning, neutrino losses exceed the photon luminosity. By silicon burning, the neutrino luminosity is ~10¹¹ L☉ — a million times brighter in neutrinos than in light. This is *why* the advanced stages are so short: the star is hemorrhaging energy through neutrinos that escape freely."
    alt: "Table titled 'Evolution of a 15-solar-mass star' with columns for burning stage, timescale, fuel, ash, core temperature (in billions of kelvin), core density (in grams per cubic centimeter), photon luminosity (in solar units), and neutrino losses (in solar units). Timescales shrink from 11 million years for hydrogen to about 1 second for iron core collapse, while neutrino losses grow from 1,800 to greater than 3.6 times 10 to the 15 solar luminosities."
    module: 3

  neutrino-vs-nuclear-energy:
    path: /assets/images/module-03/LnuT.png
    caption: "**Why advanced burning stages are so short-lived.** This plot shows energy generation rate (from nuclear burning) and energy loss rate (from neutrino emission) versus core temperature. At low temperatures, nuclear energy generation exceeds neutrino losses — the star can burn steadily. But neutrino losses rise steeply with temperature. By carbon and neon burning (~0.8–1 × 10⁹ K), neutrinos carry away energy faster than nuclear reactions can generate it. The star must burn its fuel at an accelerating rate just to maintain thermal equilibrium — a losing race that ends at iron."
    alt: "Log-log plot of energy generation and loss rates (erg per gram per second) versus core temperature (billions of kelvin). Diagonal lines show nuclear energy generation for carbon, neon, oxygen, and silicon burning. A thick curve shows neutrino loss rate rising steeply with temperature. The neutrino curve crosses the nuclear burning curves near 1 billion kelvin, indicating that beyond this temperature neutrino losses dominate."
    module: 3

  core-evolution-Tc-rhoc:
    path: /assets/images/module-03/Tc_rhoc_25Msun.png
    caption: "**The core's journey through burning stages**, shown as central temperature versus central density for 15 M☉ and 25 M☉ stars. Each labeled point (H, He, C, O, Si, Fe) marks the ignition of a new fuel. The track climbs steadily toward higher temperatures and densities — each new fuel demands more extreme conditions. The near-vertical jump at Fe marks core collapse, when the iron core exceeds the Chandrasekhar limit and no further nuclear burning can halt the contraction."
    alt: "Plot of log central temperature (kelvin) versus log central density (grams per cubic centimeter) showing evolutionary tracks for 15 and 25 solar mass stars. Both tracks start at lower left during hydrogen burning and climb to upper right through helium, carbon, oxygen, silicon, and iron core collapse, with each burning stage labeled."
    module: 3

  core-collapse-sequence:
    path: /assets/images/module-03/Core_collapse.png
    caption: "**The six stages of core-collapse supernova** — from iron core to explosion. (a) Onion-shell structure with iron core. (b) Core collapses as iron photodisintegrates. (c) Inner core reaches nuclear density and bounces. (d) Bounce launches a shock wave (red circle), but the shock stalls. (e) Neutrino heating revives the shock. (f) Shock breaks through — supernova explosion ejects the envelope. The entire sequence from (b) to (f) takes less than one second."
    alt: "Six-panel sequence showing core-collapse supernova stages. Panel a: onion shell structure. Panel b: inward-pointing arrows showing collapse. Panel c: continued collapse with proto-neutron star forming. Panel d: red circle showing stalled shock with outward and inward arrows. Panel e: neutrino-heated region reviving the shock. Panel f: expanding red circle showing the explosion propagating outward."
    module: 3

  sn1987a-before-after:
    path: /assets/images/module-03/aat_sn1987a_lbl.jpeg
    caption: "**Supernova 1987A** — before and after. Left: the bright supernova in the Large Magellanic Cloud, visible to the naked eye in February 1987. Right: the same field before the explosion, with the blue supergiant progenitor star (Sanduleak −69° 202) marked by the arrow. SN 1987A was the closest supernova observed since Kepler's supernova in 1604, and the first from which neutrinos were detected — confirming the core-collapse mechanism."
    alt: "Side-by-side images from the Anglo-Australian Observatory. Left panel shows a very bright star (SN 1987A) dominating the field in the Large Magellanic Cloud. Right panel shows the same field before the explosion with an arrow pointing to the faint blue progenitor star."
    credit: "Anglo-Australian Observatory"
    module: 3

  cosmic-abundances:
    path: /assets/images/module-03/17_15_Figure_Anno.jpg
    caption: "**Cosmic abundances** — the fingerprint of nucleosynthesis. The sawtooth pattern is not random: even-numbered elements (C, O, Ne, Mg, Si, Fe) are far more abundant than their odd-numbered neighbors because they are built by alpha capture (adding ⁴He nuclei). The iron peak near atomic number 26 marks the most stable nuclei. Elements heavier than iron are rare because making them *costs* energy rather than releasing it — they require neutron capture processes (s-process and r-process)."
    alt: "Log-linear plot of relative abundance (atoms per hydrogen atom) versus atomic number from 1 to 50. Hydrogen and helium dominate at top. Abundances generally decrease with atomic number but show a sawtooth pattern where even-numbered elements are peaks. Labels identify hydrogen, helium, carbon, oxygen, neon, magnesium, silicon, sulfur, argon, calcium, iron, and nickel. Annotations note that even-numbered elements made by helium capture are common, and elements heavier than iron are rare because energy is required to make them."
    credit: "Pearson Education (2017)"
    module: 3

  chandra-periodic-table-origins:
    path: /assets/images/module-03/Chandra_PeriodicTable.jpeg
    caption: "**Your body is stellar ash.** This periodic table is color-coded by nucleosynthesis origin: Big Bang (H, He), dying low-mass stars (C, N), exploding massive stars (O, Si, Fe), merging neutron stars (Au, Pt), and cosmic ray fission (Li, Be, B). The human body is ~73% hydrogen (Big Bang), ~16.5% oxygen (massive stars), ~9.5% carbon (low-mass stars), and ~1% everything else. Every atom heavier than hydrogen was forged inside a star."
    alt: "Periodic table on dark background color-coded by element origin: Big Bang fusion (hydrogen and helium), dying low-mass stars (carbon, nitrogen), exploding massive stars (oxygen, silicon, iron group), merging neutron stars (gold, platinum, uranium), and exploding white dwarfs. A human silhouette at right shows body composition: 73 percent hydrogen, 16.5 percent oxygen, 9.5 percent carbon, 1 percent other elements."
    credit: "NASA/CXC/SAO"
    module: 3

  # R10: Neutron Stars & Black Holes
  core-collapse-neutrino-schematic:
    path: /assets/images/module-03/TypeII_CoreCollapse_Schematic.png
    caption: "**Anatomy of a core-collapse supernova** at ~0.5 seconds after bounce. The proto-neutron star (~40 km radius) radiates neutrinos in all directions. Within 50 km, neutrinos *cool* the material (neutrino emission dominates). Between 50–100 km, neutrinos *heat* the material (neutrino absorption dominates) — this is the 'gain region' where the stalled shock is revived. High-entropy convective plumes carry heated material outward, helping push the shock to larger radii."
    alt: "Schematic cross-section of a core-collapse supernova showing concentric regions: a yellow proto-neutron star at center (~40 km radius), a neutrino cooling region (40–50 km) with labeled reactions, a neutrino gain/heating region (50–100 km), a stalled accretion shock, and infalling material at the outer edge. Hot neutrinos stream outward from the proto-neutron star. Entropy-driven convective plumes are shown between the gain region and the shock."
    module: 3

  ns-cross-section:
    path: /assets/images/module-03/Neutron_star_cross_section.png
    caption: "**Internal structure of a neutron star.** The outer crust (0.3–0.5 km) contains ions and electrons at densities of 0.3–0.5 ρ₀ (where ρ₀ ≈ 2.8 × 10¹⁴ g/cm³ is nuclear density). The inner crust (1–2 km) has neutron-rich nuclei immersed in a sea of free neutrons. The outer core (~9 km) is a neutron-proton Fermi liquid. The inner core (0–3 km) is so dense that the equation of state is unknown — it may contain exotic matter such as a quark-gluon plasma."
    alt: "Cutaway diagram of a neutron star showing four concentric layers: a thin brown outer crust (0.3 to 0.5 km, ions and electrons), a pink inner crust (1 to 2 km, electrons, neutrons, nuclei), a light pink outer core (~9 km, neutron-proton Fermi liquid), and a central inner core (0 to 3 km, possibly quark-gluon plasma). Density labels in units of nuclear density are shown for each layer."
    module: 3

  ns-types-nasa:
    path: /assets/images/module-03/NASA_NeutronStars.jpeg
    caption: "**Three types of neutron stars.** Magnetars have extraordinarily strong magnetic fields (~10¹⁵ G, a trillion times Earth's). Pulsars emit beams of radiation from their magnetic poles; as the star rotates, the beams sweep across our line of sight like a lighthouse. Some neutron stars are both magnetar and pulsar. About 3,000 pulsars have been discovered, but only ~30 magnetars — they may represent a brief evolutionary phase."
    alt: "NASA JPL infographic on dark background showing three panels: Magnetar (left) with intense magnetic field lines, Pulsar (center) with twin beams of radiation sweeping from magnetic poles misaligned with the rotation axis, and Magnetar plus Pulsar (right) combining both properties. Each panel includes a brief description and illustration."
    credit: "NASA/JPL-Caltech"
    module: 3

  ns-mass-distribution:
    path: /assets/images/module-03/NeutronStarDistribution_2013.jpeg
    caption: "**Measured neutron star masses** from binary pulsar systems. Most cluster tightly around 1.3–1.5 M☉ — strikingly close to the Chandrasekhar limit of 1.4 M☉. The vertical lines mark the mean and standard deviation. The tight clustering is not a coincidence: it reflects the physics of core collapse, where the iron core mass at the moment of collapse is set by electron degeneracy and the Chandrasekhar limit. A few neutron stars have been found with masses ~2 M☉, pushing the upper limit of neutron degeneracy pressure."
    alt: "Two-panel plot of measured neutron star masses with horizontal error bars. Top panel shows neutron star-white dwarf binary systems; bottom panel shows double neutron star systems. Most masses cluster between 1.2 and 1.5 solar masses, with vertical dashed lines indicating the mean near 1.35 solar masses. A few outliers extend to about 2 solar masses."
    module: 3

  cygnus-x1-accretion:
    path: /assets/images/module-03/Black_hole_Cygnus_X-1.jpg
    caption: "**Cygnus X-1** — the first strong black hole candidate. A stellar-mass black hole (~21 M☉) accretes gas from its blue supergiant companion star (HDE 226868). The infalling matter forms a swirling accretion disk heated to millions of kelvin, producing intense X-ray emission. Relativistic jets emerge perpendicular to the disk. The black hole itself is invisible — we infer its existence from the X-ray luminosity and the orbital dynamics of the companion."
    alt: "Artist's rendering of the Cygnus X-1 system showing a large blue supergiant star on the right with gas streaming toward a black hole on the left. The gas forms a glowing orange-red accretion disk spiraling inward, with narrow blue-white jets shooting perpendicular to the disk from near the black hole."
    credit: "NASA/CXC"
    module: 3

