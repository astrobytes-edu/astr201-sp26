  # ==============================================================
  # Module 4: Galaxies & Cosmology
  # ==============================================================

  milky-way-structure:
    path: /assets/images/module-04/milky-way-structure.png
    caption: "Structure of the Milky Way galaxy"
    alt: "Diagram showing disk, bulge, halo, and spiral arms of our galaxy"
    module: 4

  rotation-curve:
    path: /assets/images/module-04/rotation-curve.png
    caption: "Galaxy rotation curves reveal dark matter"
    alt: "Graph comparing expected Keplerian rotation to observed flat rotation curve"
    module: 4

  hubble-diagram:
    path: /assets/images/module-04/hubble-diagram.png
    caption: "Hubble's law relates distance to recession velocity"
    alt: "Plot showing linear relationship between galaxy distance and redshift"
    module: 4

  cmb-map:
    path: /assets/images/module-01/week-03/Plancks_view_of_the_CMB_ESO.jpg
    caption: "**What to notice:** The CMB is the most perfect blackbody ever measured (T = 2.725 K). These color variations show temperature fluctuations of only ±0.0002 K — the seeds of all cosmic structure."
    alt: "Planck satellite all-sky map of the Cosmic Microwave Background in Mollweide projection. Colors show tiny temperature fluctuations: blue regions are slightly cooler, red/orange regions slightly warmer than the 2.725 K average."
    credit: "ESA/Planck Collaboration"
    module: 1

  # ==============================================================
  # Lecture 03: Gravity and Orbits (cococubed diagrams)
  # ==============================================================

  # Kepler's Laws
  kepler-first-law:
    path: /assets/images/module-01/cococubed/first_law.svg
    caption: "**Kepler's First Law:** Planets orbit in ellipses with the Sun at one focus. The semi-major axis $a$ defines the size; eccentricity $e$ measures the elongation."
    alt: "Diagram of an elliptical orbit showing the Sun at one focus, with labels for semi-major axis a, perihelion, aphelion, and the geometric properties of the ellipse."
    credit: "cococubed.com"
    module: 1

  kepler-second-law:
    path: /assets/images/module-01/cococubed/second_law.svg
    caption: "**Kepler's Second Law:** A line from planet to Sun sweeps equal areas in equal times. Planets move faster at perihelion (close) and slower at aphelion (far)."
    alt: "Elliptical orbit with two shaded triangular sectors of equal area, demonstrating that a planet covers larger angular distance when closer to the Sun."
    credit: "cococubed.com"
    module: 1

  # Newton's Gravitation
  gravity-law:
    path: /assets/images/module-01/cococubed/gravity_law.svg
    caption: "**Newton's Law of Gravitation:** $F = Gm_1m_2/r^2$. Every mass attracts every other mass with a force proportional to both masses and inversely proportional to distance squared."
    alt: "Two masses m1 and m2 separated by distance r, with arrows showing equal and opposite gravitational forces between them."
    credit: "cococubed.com"
    module: 1

  # Circular Motion
  newton-ball-on-string:
    path: /assets/images/module-01/cococubed/newton_ball_on_string.svg
    caption: "**Circular Motion Analogy:** A ball on a string demonstrates centripetal force. The tension pulls inward, continuously changing the velocity direction while maintaining constant speed."
    alt: "Ball moving in a circle with radial lines to center showing the inward centripetal force, with velocity vectors tangent to the circular path at multiple positions."
    credit: "cococubed.com"
    module: 1

  # Orbital Velocity and Escape Velocity
  escape-velocity:
    path: /assets/images/module-01/cococubed/escape_velocity.svg
    caption: "**Escape Velocity:** Launch speed determines trajectory. Below $v_{esc}$: falls back. At $v_{esc}$: parabolic escape. Above $v_{esc}$: hyperbolic escape."
    alt: "Earth with multiple trajectory curves showing different launch velocities: suborbital (falls back), orbital (circular/elliptical), and escape trajectories (parabolic and hyperbolic paths)."
    credit: "cococubed.com"
    module: 1

  falling-to-orbit:
    path: /assets/images/module-01/cococubed/falling_toward_earth_to_orbit.svg
    caption: "**Newton's Cannon:** An object falls toward Earth, but with enough horizontal velocity, it 'misses' and enters orbit. Orbital motion is perpetual free-fall."
    alt: "Earth with an object showing the transition from falling trajectory to orbital path, illustrating how sufficient tangential velocity converts falling into orbiting."
    credit: "cococubed.com"
    module: 1

  # Orbit Types
  orbit-types:
    path: /assets/images/module-01/cococubed/orbit_types.svg
    caption: "**Orbit Classification by Energy:** Negative total energy → bound orbits (ellipses). Zero energy → parabolic escape. Positive energy → hyperbolic escape."
    alt: "Central body with multiple orbital paths showing bound elliptical orbits and unbound hyperbolic trajectories, labeled to distinguish orbit types by total energy."
    credit: "cococubed.com"
    module: 1

  # Conservation Laws
  conservation-angular-momentum:
    path: /assets/images/module-01/cococubed/conservation_angular_momentum_01.svg
    caption: "**Conservation of Angular Momentum:** $L = mvr$ remains constant. When $r$ decreases, $v$ must increase—explaining why planets speed up near the Sun."
    alt: "Diagram showing angular momentum vectors and the relationship between orbital radius and velocity, demonstrating that smaller radius requires larger velocity to conserve L."
    credit: "cococubed.com"
    module: 1

  conservation-energy-orbit:
    path: /assets/images/module-01/cococubed/conservation_energy_orbit.svg
    caption: "**Conservation of Energy in Orbits:** Total energy $E = K + U$ is constant. At perihelion: high $K$, low $U$. At aphelion: low $K$, high $U$."
    alt: "Elliptical orbit with energy indicators showing kinetic and potential energy trading off around the orbit while total energy remains constant."
    credit: "cococubed.com"
    module: 1

  # Center of Mass
  center-of-mass:
    path: /assets/images/module-01/cococubed/center_of_mass.svg
    caption: "**Center of Mass:** Two bodies orbit their common center of mass (barycenter). The more massive body orbits closer to the barycenter."
    alt: "Two masses orbiting their common center of mass, showing that both bodies move in response to their mutual gravitational attraction."
    credit: "cococubed.com"
    module: 1

  # Moon orbital motion
  moon-falling:
    path: /assets/images/module-01/cococubed/moon_falling.svg
    caption: "**The Moon is Falling:** The Moon continuously falls toward Earth but has enough tangential velocity to keep missing. Newton's first law in action."
    alt: "Earth and Moon showing the Moon's orbital motion as continuous free-fall, with the Moon's inertia (tangential motion) preventing it from hitting Earth."
    credit: "cococubed.com"
    module: 1

  # Planetary orbits overview
  planet-orbits:
    path: /assets/images/module-01/cococubed/planet_orbits2.svg
    caption: "**Solar System Orbits:** The inner planets (Mercury through Mars) shown in their elliptical orbits around the Sun, demonstrating Kepler's laws at system scale."
    alt: "Top-down view of inner solar system showing nested elliptical orbits of Mercury, Venus, Earth, and Mars around the Sun, with planets marked at various orbital positions."
    credit: "cococubed.com"
    module: 1

  # Additional diagrams (may use in future)
  gravity-curved-space:
    path: /assets/images/module-01/cococubed/gravity_as_curved_space.svg
    caption: "**Gravity as Curved Spacetime:** Einstein's view—mass curves spacetime, and objects follow the straightest possible paths (geodesics) through that curvature."
    alt: "Grid representation of spacetime curved by a central mass, showing how the geometry of space itself is warped by the presence of matter."
    credit: "cococubed.com"
    module: 1

  conservation-momentum:
    path: /assets/images/module-01/cococubed/conservation_momentum_01.svg
    caption: "**Conservation of Momentum:** In any isolated system, total momentum is conserved. When two objects interact, their momentum changes are equal and opposite."
    alt: "Diagram illustrating momentum conservation with vectors showing how momentum transfers between interacting objects while total momentum remains constant."
    credit: "cococubed.com"
    module: 1

  # ==============================================================
  # Lecture 04: Light as Information (Week 3)
  # ==============================================================

  # EM Waves and Spectrum
  em-wave-diagram:
    path: /assets/images/module-01/week-03/em-wave-only-jwst.png
    caption: "**What to notice:** Light is oscillating electric and magnetic fields perpendicular to each other and to the direction of travel. The wavelength λ is the distance between crests."
    alt: "3D diagram of an electromagnetic wave showing perpendicular electric field (cyan, oscillating in z-y plane) and magnetic field (yellow, oscillating in x-y plane) propagating along the x-axis."
    credit: "JWST Education"
    module: 1

  mechanical-vs-em-wave:
    path: /assets/images/module-01/week-03/mechanical-vs-em-wave-jwst.png
    caption: "**What to notice:** Mechanical waves need a medium (water, air); EM waves don't. Light travels through the vacuum of space—no medium required."
    alt: "Side-by-side comparison: left shows a simple sine wave labeled 'Mechanical Wave' with wavelength marked; right shows an EM wave with perpendicular electric and magnetic field components."
    credit: "JWST Education"
    module: 1

  em-spectrum-bands:
    path: /assets/images/module-01/week-03/em-spectrum-jwst.png
    caption: "**What to notice:** The EM spectrum spans from gamma rays (≈ $10^{-13}$ cm) to radio waves (≈ $10^{3}$ cm). Visible light is a tiny sliver—4000 to 7000 Å. Different wavelengths = different physics revealed."
    alt: "Horizontal electromagnetic spectrum diagram showing a wavelength scale from very short gamma rays (~1e-13 cm) through X-ray and ultraviolet to visible light (expanded as a rainbow, 4000–7000 Å), then infrared, microwave, and radio up to long wavelengths (~1e3 cm)."
    credit: "JWST Education"
    module: 1

  em-spectrum-astro-objects:
    path: /assets/images/module-01/week-03/em-spectrum-astro-objects-jwst.png
    caption: "**What to notice:** Different wavelengths reveal different cosmic phenomena. Gamma rays see black holes; X-rays see hot plasma; visible shows stars; infrared penetrates dust; radio maps cold gas."
    alt: "EM spectrum with astronomical objects shown at each band: gamma rays from black holes and supernovae, X-rays from hot stellar coronae, UV from hot stars, visible from stellar surfaces, infrared from dust and cool stars, microwave from CMB, radio from cold gas and pulsars."
    credit: "JWST Education"
    module: 1

  wavelength-energy-relation:
    path: /assets/images/module-01/week-03/wavelength-energy-jwst.png
    caption: "**What to notice:** Short wavelength = high energy = high frequency. The wave 'crests' are closer together for blue/UV light than for red/IR light. E = hc/λ quantifies this."
    alt: "Visible spectrum from UV through infrared showing a wave pattern with wavelength scale across visible light (4000–7000 Å). Left side labeled 'higher energy (shorter wavelength)' with compressed waves; right side labeled 'lower energy (longer wavelength)' with stretched waves."
    credit: "JWST Education"
    module: 1

  # Prism and Spectra
  prism-dispersion:
    path: /assets/images/module-01/week-03/prism-spectrum-jwst.png
    caption: "**What to notice:** A prism separates 'white' sunlight into its component wavelengths. Blue bends more than red because shorter wavelengths interact more strongly with glass."
    alt: "Sunlight beam entering a triangular prism and dispersing into a rainbow spectrum, with ultraviolet beyond blue and infrared beyond red labeled."
    credit: "JWST Education"
    module: 1

  # Blackbody Radiation
  blackbody-stellar-spectra:
    path: /assets/images/module-01/week-03/blackbody-spectra-jwst.jpg
    caption: "**What to notice:** Hotter stars peak at shorter wavelengths (bluer) AND emit more total light. A blue 8000 K star peaks near $\\lambda_{\\mathrm{peak}}\\approx 3600$ Å; a red 3000 K star peaks near $9700$ Å. Wien’s law: $\\lambda_{\\mathrm{peak}} = b/T$ with $b = 0.2898$ cm·K."
    alt: "Graph showing three Planck curves for stars at 8000 K (blue, peaks in the near-UV around 3600 Å), 5000 K (yellow, peaks near 5800 Å), and 3000 K (red, peaks in the near-IR around 9700 Å). The visible band (about 4000–7000 Å) is marked. Y-axis is brightness; X-axis is wavelength."
    credit: "JWST Education"
    module: 1

  continuous-vs-line-spectrum:
    path: /assets/images/module-01/week-03/lightbulb-vs-sun-spectrum-jwst.png
    caption: "**What to notice:** The Sun's spectrum is nearly a smooth blackbody curve (continuous). A fluorescent bulb shows discrete spikes—it's NOT a thermal emitter. Spectrum shape tells you about the emission mechanism."
    alt: "Top: Sun image with smooth continuous spectrum graph (brightness vs wavelength, rainbow bar below). Bottom: Fluorescent bulb with spiky discrete emission spectrum showing peaks at specific wavelengths."
    credit: "JWST Education"
    module: 1

  # Types of Spectra (preview for spectroscopy)
  three-types-of-spectra:
    path: /assets/images/module-01/week-03/types-of-spectra-jwst.png
    caption: "**What to notice:** Three spectrum types encode different physics. Continuous = hot dense source. Absorption = cool gas in front of hot source. Emission = hot thin gas. Same atoms, different conditions, different spectra."
    alt: "Diagram showing three scenarios: (1) continuous spectrum from hot dense object producing rainbow, (2) absorption spectrum with dark lines when cool gas absorbs from continuous source, (3) emission spectrum with bright lines from hot thin gas cloud."
    credit: "JWST Education"
    module: 1

  # Light-Matter Interactions
  light-matter-behaviors:
    path: /assets/images/module-01/week-03/light-matter-interactions-jwst.png
    caption: "**What to notice:** Light can be absorbed, emitted, transmitted, reflected, or refracted. Each interaction encodes information about the material. Blackbodies absorb all wavelengths (no reflection)."
    alt: "Five panels showing light behaviors: Absorption (rays entering and stopping), Emission (rays leaving), Transmission (rays passing through), Reflection (rays bouncing off surface), Refraction (rays bending at interface)."
    credit: "JWST Education"
    module: 1

  # Atomic Spectra (preview for Module 2)
  absorption-emission-elements:
    path: /assets/images/module-01/week-03/absorption-emission-spectra-jwst.png
    caption: "**What to notice:** Each element has a unique spectral fingerprint. The dark lines in absorption exactly match the bright lines in emission—same energy transitions, opposite directions."
    alt: "Absorption and emission spectra for sodium, nitrogen, hydrogen, and oxygen showing matching line patterns. Absorption spectra show dark lines on continuous rainbow; emission spectra show same-position bright lines on black background."
    credit: "JWST Education"
    module: 1

  hydrogen-absorption:
    path: /assets/images/module-01/week-03/absorption-of-light-hydrogen-jwst.png
    caption: "**What to notice:** Hydrogen absorbs specific wavelengths because electrons jump UP between quantized energy levels. Each dark line = one electron transition. E = hν determines which wavelengths."
    alt: "Left: Bohr model of hydrogen with electron energy levels 1-6. Right top: energy level diagram showing electron absorbing photons and jumping up. Right bottom: absorption spectrum with dark lines at specific wavelengths corresponding to transitions."
    credit: "JWST Education"
    module: 1

  hydrogen-emission:
    path: /assets/images/module-01/week-03/emission-of-light-hydrogen-jwst.png
    caption: "**What to notice:** Hydrogen emits specific wavelengths because electrons fall DOWN between energy levels. Each bright line = one electron transition. The Balmer series (visible) comes from transitions to level 2."
    alt: "Left: Bohr model of hydrogen with electron falling between levels. Right top: energy level diagram showing electron emitting photons while dropping down. Right bottom: emission spectrum with bright lines at specific wavelengths."
    credit: "JWST Education"
    module: 1

  # Real Stellar Spectrum
  altair-spectrum-annotated:
    path: /assets/images/module-01/week-03/altair-spectrum-jwst.png
    caption: "**What to notice:** A real stellar spectrum combines continuous (blackbody) shape with absorption lines. The overall curve gives temperature (Wien); the lines give composition (spectroscopy). Two inference tools in one observation."
    alt: "Top: rainbow spectrum image of star Altair showing dark absorption lines. Bottom: graph of brightness vs wavelength (about 4000–7000 Å) showing a smooth blackbody-like curve with sharp dips at absorption line wavelengths. Hydrogen Balmer lines labeled."
    credit: "JWST Education"
    module: 1

  # Doppler Shift (preview for Week 6)
  doppler-shift-exoplanet:
    path: /assets/images/module-01/week-03/doppler-shift-star-jwst.png
    caption: "**What to notice:** Motion toward us compresses wavelengths (blueshift); motion away stretches them (redshift). This lets us measure stellar velocities—and detect exoplanets via the star's wobble."
    alt: "Star with orbiting exoplanet showing how spectral lines shift: blueshifted when star moves toward viewer, neutral when perpendicular, redshifted when moving away. Three spectra shown for comparison."
    credit: "JWST Education"
    module: 1

  # Betelgeuse Size Comparison
  betelgeuse-size:
    path: /assets/images/module-01/week-03/betelgeuse-size-eso.jpg
    caption: "**What to notice:** Betelgeuse is HUGE—it would engulf Mercury, Venus, Earth, Mars, and extend past Jupiter's orbit. Red supergiants are cool (~3500 K) but luminous because of their enormous surface area."
    alt: "ESO image of Betelgeuse with solar system orbits overlaid for scale. The star's disk extends beyond Jupiter's orbit. Inner planets (Mercury, Venus, Earth, Mars) would be inside the star. Angular scale bar shows 0.015 arcseconds."
    credit: "ESO/L. Calçada"
    module: 1

  # Earth Reflectance Spectra (biosignatures preview)
  earth-reflectance-spectra:
    path: /assets/images/module-01/week-03/reflectance-spectra-earth-jwst.png
    caption: "**What to notice:** Different materials reflect different wavelengths. Snow reflects broadly; water absorbs IR; vegetation has a sharp 'red edge' at 700 nm. Spectra can identify surface composition—even on exoplanets."
    alt: "Graph showing reflectance vs wavelength (400-2400 nm) for snow (high, flat), vegetation (red edge jump at 700 nm), dry soil (rising toward IR), and water (absorbs in IR). Each material has distinct spectral signature."
    credit: "JWST Education"
    module: 1

  # Scattering and Telescopes (Lecture 04 expansion)
  rayleigh-scattering-sky:
    path: /assets/images/module-01/week-03/rayleigh-scattering-gemini.png
    caption: "**What to notice:** Rayleigh scattering explains both the blue sky (scattered short wavelengths) and red sunsets (transmitted long wavelengths). Same physics, different viewing geometry."
    alt: "Diagram showing sunlight entering atmosphere. Blue light (short wavelength) scatters in all directions while red light (long wavelength) passes through more directly. Viewer looking up sees scattered blue; viewer at sunset sees transmitted red."
    credit: "Gemini"
    module: 1

  atmospheric-transmission-windows:
    path: /assets/images/module-01/week-03/EMS_Diagram_NASA.jpg
    caption: "**What to notice:** Earth's atmosphere has two main 'windows' — radio and optical — where it's transparent. Most UV, X-rays, and gamma rays are blocked, which is why we need space telescopes for those wavelengths."
    alt: "Electromagnetic spectrum diagram showing wavelength (10² m to 10⁻¹² m) and frequency (10⁴ Hz to 10²² Hz) scales against a landscape backdrop. A gray transmission curve shows atmosphere is opaque at most wavelengths but transparent in the 'Radio Window' and 'Optical Window'. Familiar objects illustrate each band: AM/FM radio towers, cell phones, microwave ovens, human body (infrared), visible light through a prism, sunburn (UV), medical X-rays, and nuclear power (gamma rays)."
    credit: "NASA"
    module: 1

  telescope-collecting-area:
    path: /assets/images/module-01/week-03/telescope-collecting-area.svg
    caption: "**What to notice:** Collecting area scales as diameter squared. A telescope twice as wide collects four times as much light."
    alt: "Two telescopes: small diameter D collects few photons (shown as dots), large diameter 2D collects four times as many photons. Caption shows Area ∝ D²."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  telescope-resolution:
    path: /assets/images/module-01/week-03/telescope-resolution.svg
    caption: "**What to notice:** Angular resolution improves with larger diameter. The diffraction limit θ ≈ λ/D sets the finest detail a telescope can distinguish."
    alt: "Two images of binary star: small telescope shows blurry single blob, large telescope resolves two distinct stars. Equation θ ∝ λ/D shown."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1
