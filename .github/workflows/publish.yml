name: Publish Quarto site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEXLIVE_REPOSITORY: https://ctan.math.utah.edu/ctan/tex-archive/systems/texlive/tlnet
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.1.9

      # Install TinyTeX directly so we avoid the deprecated Node 20-based action.
      - name: Install TinyTeX
        run: |
          perl -mFile::Find /dev/null
          which xz
          curl -fsSL "https://tinytex.yihui.org/install-bin-unix.sh" | sh
          TEXBIN="$(find "$HOME/.TinyTeX/bin" -maxdepth 1 -type d -name '*-linux' | head -n 1)"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          tlmgr --version

      - name: Configure TinyTeX mirror and install LaTeX packages for PDF
        run: |
          tlmgr option repository "$TEXLIVE_REPOSITORY"
          tlmgr update --self
          tlmgr install titling koma-script caption tcolorbox tikzfill pdfcol fontawesome5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate tokens from brand
        run: |
          pip install pyyaml
          python scripts/brand_to_scss.py

      - name: Render site
        run: |
          quarto render
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
