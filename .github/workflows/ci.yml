name: CI (Render HTML + check links)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC (weekly link-rot patrol)
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    env:
      TEXLIVE_REPOSITORY: https://ctan.math.utah.edu/ctan/tex-archive/systems/texlive/tlnet
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.1.9

      # Install TinyTeX directly so we avoid the deprecated Node 20-based action.
      - name: Install TinyTeX
        run: |
          perl -mFile::Find /dev/null
          which xz
          curl -fsSL "https://tinytex.yihui.org/install-bin-unix.sh" | sh
          TEXBIN="$(find "$HOME/.TinyTeX/bin" -maxdepth 1 -type d -name '*-linux' | head -n 1)"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$TEXBIN" >> "$GITHUB_PATH"
          tlmgr --version

      - name: Configure TinyTeX mirror and install LaTeX packages for PDF
        run: |
          tlmgr option repository "$TEXLIVE_REPOSITORY"
          tlmgr update --self
          tlmgr install titling koma-script caption tcolorbox tikzfill pdfcol fontawesome5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate tokens from brand
        run: |
          pip install pyyaml
          python scripts/brand_to_scss.py

      - name: Check tokens are up-to-date
        run: |
          if ! git diff --quiet assets/theme/_tokens_generated.scss; then
            echo "ERROR: _tokens_generated.scss is out of date"
            echo "Run: python scripts/brand_to_scss.py"
            echo ""
            echo "Diff:"
            git diff assets/theme/_tokens_generated.scss
            exit 1
          fi

      - name: Render site (HTML + PDFs)
        run: |
          quarto render
          touch _site/.nojekyll

      - name: Normalize RevealJS lazy images for HTML-Proofer
        run: |
          python3 scripts/normalize_html_for_proofer.py _site

      - name: Validate HTML + check links/images
        uses: anishathalye/proof-html@v2
        with:
          directory: _site
          # Quarto generates non-standard attributes (append-hash) and duplicate IDs
          # (quarto-bootstrap, quarto-search) for light/dark theme handling.
          # Disable strict HTML validation but keep link checking.
          check_html: false
          # Quarto uses <a> tags as UI toggles (sidebar/theme) without href attributes.
          # These are not broken content links; allow them so CI focuses on real link rot.
          allow_missing_href: true
          # Allow empty/missing alt for decorative images (logos, icons)
          ignore_empty_alt: true
          ignore_missing_alt: true
          # RevealJS vendor pages (e.g. speaker view) don't include the site favicon.
          check_favicon: false
          # External URLs that block automated access (return 403 to bots)
          ignore_url_re: |
            ^https://docs\.google\.com/.*
            ^https://www\.cambridge\.org/9781009618007.*$
            ^https://shopaztecs\.com/.*$
            ^https://www\.esa\.int/Science_Exploration/Space_Science/Cosmic_Microwave_Background_CMB_radiation$
            ^https://www\.eso\.org/public/videos/?$
            ^https://www\.esa\.int/Science_Exploration/Space_Science/Gaia/?$
            ^https://cas\.sdss\.org/dr18/VisualTools/quickobj/?$
