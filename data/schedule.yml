# Course Schedule Data — Single Source of Truth
# Change semester_start to shift ALL dates automatically

semester_start: 2026-01-20  # First day of class (Tuesday)
lectures_per_week: 2
days: [Tue, Thu]

# Academic calendar breaks (no class)
breaks:
  - date: 2026-03-30
    name: "Spring Break"
    duration: 5  # days (Mon–Fri, Mar 30 – Apr 3)
  # Cesar Chavez Day (Mar 31) falls within Spring Break

# Exams (dates computed from week number, or fixed)
exams:
  midterm1:
    week: 7
    day: Thu
    name: "Midterm Exam 1"
    covers: "Modules 1–2"
  midterm2:
    week: 12
    day: Thu
    name: "Midterm Exam 2"
    covers: "Modules 1–3"
  final:
    date: 2026-05-07
    time: "10:30 am – 12:30 pm"
    name: "Final Exam (Cumulative)"

# ── Modules with lectures ──────────────────────────────────────────
#
# Module 1:  Foundations — the physics toolkit
# Module 2:  Discovering the HR Diagram — applying the toolkit to stars
# Module 3:  Stellar Structure & Evolution — what makes stars tick
# Module 4:  Galaxies & Cosmology — the bigger picture
#
# Note: Module 3 begins Week 7 Tue (before Exam 1 on Week 7 Thu).
# The first Module 3 lecture is NOT covered on Exam 1, giving students
# study time for Modules 1–2.

modules:
  - name: "Foundations"
    weeks: [1, 2, 3]
    lectures:
      - title: "Spoiler Alerts: Course Overview"
        reading: "Syllabus"
      - title: "Tools of the Trade: Scaling, Units & Dimensional Analysis"
        reading: "Ch. 1"
      - title: "Gravity I: Kepler's Laws & Newton"
        reading: "Ch. 7.1–7.2"
      - title: "Gravity II: Orbits & Conservation Laws"
        reading: "Ch. 7.3–7.4"
      - title: "Radiation I: Light as Information"
        reading: "Ch. 4.1–4.3"
      - title: "Radiation II: Blackbody, Spectra & Doppler"
        reading: "Ch. 4.4 + Ch. 5"

  - name: "Discovering the HR Diagram"
    weeks: [4, 5, 6]
    lectures:
      - title: "Distance & Parallax"
        subtitle: "How far? — spherical geometry, angular size, parallax, parsec; inverse-square law derived; flux + distance → luminosity"
        reading: "Ch. 2 + Ch. 3.1"
      - title: "Surface Flux & Colors of Stars"
        subtitle: "How hot, how big? — emitted flux, Stefan–Boltzmann (L = 4πR²σT⁴), Wien applied, color → temperature, stellar radii"
        reading: "Ch. 3.2 + Ch. 4.4"
      - title: "Spectra & Composition"
        subtitle: "What's it made of, how is it moving? — spectral lines in context, OBAFGKM as temperature sequence, Doppler → radial velocity"
        reading: "Ch. 5 + Ch. 6"
      - title: "Masses from Motion"
        subtitle: "How heavy? — binary stars, radial velocity curves, Kepler revisited → stellar masses, mass–luminosity relation"
        reading: "Ch. 9 + Ch. 10.1–10.3"
      - title: "Magnitudes & the Distance Modulus"
        subtitle: "The astronomer's brightness scale — logarithms, apparent vs absolute magnitude, distance modulus, standard candles preview"
        reading: "Ch. 3.3"
      - title: "Building the HR Diagram"
        subtitle: "Synthesis — L vs T, main sequence as mass sequence, luminosity classes, giant/dwarf distinction; lines of constant R from Stefan–Boltzmann"
        reading: "Ch. 6 (synthesis)"

  - name: "Stellar Structure & Evolution"
    weeks: [7, 8, 9, 10, 11, 12]
    note: "Starts Week 7 Tue. First lecture precedes Exam 1 (Week 7 Thu) but is NOT tested."
    lectures:
      - title: "Ages & Lifetimes"
        reading: "Ch. 8 (pp. 49–51)"
      - title: "Hydrostatic Equilibrium"
        reading: "Ch. 15 (pp. 101–104)"
      - title: "Energy Transport"
        reading: "Ch. 16 (pp. 107–110)"
      - title: "Radiative vs Convective Envelopes"
        reading: "Ch. 17 (pp. 112–116)"
      - title: "Fusion Ignition & Main-Sequence Scalings"
        reading: "Ch. 18 (pp. 120–122)"
      - title: "Min/Max Masses: Brown Dwarfs & Eddington Limit"
        reading: "Ch. 18 (pp. 122–124)"
      - title: "Low-Mass Evolution → White Dwarfs"
        reading: "Ch. 19 (pp. 128–131)"
      - title: "Degeneracy Pressure & Chandrasekhar Limit"
        reading: "Ch. 19 (pp. 131–134)"
      - title: "High-Mass Evolution → Core-Collapse Supernovae"
        reading: "Ch. 20.1–20.3 (pp. 137–140)"
      - title: "Neutron Stars & Black Holes"
        reading: "Ch. 20.4–20.5 (pp. 140–143)"
      - title: "Exam 2 Review"
        reading: ""
      - title: "MIDTERM 2"
        reading: ""

  - name: "Galaxies & Cosmology"
    weeks: [13, 14, 15]
    lectures:
      - title: "The Milky Way"
        reading: "Ch. 11"
      - title: "Galaxy Types"
        reading: "Ch. 12.1"
      - title: "Dark Matter"
        reading: "Ch. 12.2"
      - title: "Hubble's Law"
        reading: "Ch. 13.1"
      - title: "The Big Bang"
        reading: "Ch. 13.2"
      - title: "Final Review"
        reading: ""

# Homework schedule (computed from week numbers)
homework:
  - week: 3
    title: "HW 1: Tools of the Trade + Gravity & Orbits"
  - week: 4
    title: "HW 2: Gravity & Orbits II + Light as Information"
  - week: 5
    title: "HW 3: Parallax + Surface Flux & Radiation Inference"
  - week: 6
    title: "HW 4: Surface Flux & Colors + Spectra & Composition"
  - week: 7
    title: "HW 5: Masses from Motion + Magnitudes/HR Synthesis (Midterm 1 Review)"
  - week: 9
    title: "HW 6: Quantum Mechanics, Stellar Alchemy, and a Trailblazer"
    grade_memo: false
  - week: 10
    title: "HW 7: Stellar Structure I — Lifetimes, Equilibrium, and Fusion"
  - week: 12
    title: "HW 8: Stellar Structure II — Radiation Transport, Structure Scalings, and Mass Limits (Midterm 2 Prep)"
  - week: 13
    title: "HW 9: Stellar Evolution + Compact Remnants (Midterm 2 Prep)"
  - week: 16
    title: "HW 10: Final Synthesis — ISM, Galaxies, Dark Matter, and Cosmology"
    grade_memo: false
