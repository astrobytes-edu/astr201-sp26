# Glossary Registry
# Terms and definitions for ASTR 201
# Usage: {{< term id >}} for inline term with margin note
#        {{< glossary >}} for full glossary section
#
# Each term has:
#   term: display name
#   definition: short definition (1-2 sentences)
#   context: (optional) additional context or formula
#   first_use: (optional) where term is first introduced
#   module: (optional) which module introduces this

# =============================================================
# Module 1: Foundations
# =============================================================

# Core Concepts
inference:
  term: "Inference"
  definition: "Drawing conclusions about quantities we cannot directly access (like a star's temperature) from quantities we can measure (like its color)."
  context: "Inference requires a model—a physical relationship connecting observable to unobservable."
  first_use: "Lecture 1"
  module: 1

observable:
  term: "Observable"
  definition: "A quantity that can be directly measured—brightness, position, wavelength, timing."
  context: "Astronomers have remarkably few types of observables; nearly everything else is inferred."
  first_use: "Lecture 1"
  module: 1

model:
  term: "Model"
  definition: "A mathematical relationship encoding physical assumptions that connects what we measure to what we want to know."
  context: "Models can be tested by comparing their predictions to new observations."
  first_use: "Lecture 1"
  module: 1

# Light and Radiation
photon:
  term: "Photon"
  definition: "A discrete packet of electromagnetic energy; the quantum of light."
  context: "Each photon carries energy $E = h\\nu$, where $h$ is Planck's constant and $\\nu$ is frequency."
  first_use: "Lecture 1"
  module: 1

wavelength:
  term: "Wavelength (λ)"
  definition: "The spatial period of a light wave—the distance between successive crests."
  context: "Measured in nanometers (nm) for visible light, centimeters for radio. Related to frequency by $c = \\lambda\\nu$."
  first_use: "Lecture 1"
  module: 1

frequency:
  term: "Frequency (ν)"
  definition: "The number of wave cycles passing a point per second, measured in Hertz (Hz)."
  context: "Higher frequency means higher energy photons: $E = h\\nu$."
  first_use: "Lecture 1"
  module: 1

spectrum:
  term: "Spectrum"
  definition: "Brightness measured as a function of wavelength—the distribution of light across different colors/energies."
  context: "A spectrum contains far more information than a single brightness measurement."
  first_use: "Lecture 1"
  module: 1

spectroscopy:
  term: "Spectroscopy"
  definition: "The technique of spreading light into its component wavelengths to analyze composition, temperature, and motion."
  context: "Spectroscopy transformed astronomy from cataloging what's there to understanding what it's made of."
  first_use: "Lecture 1"
  module: 1

# Brightness and Distance
flux:
  term: "Flux (F)"
  definition: "The amount of light energy arriving at a detector per unit time per unit area."
  context: "Measured in erg s⁻¹ cm⁻². Flux depends on both luminosity and distance: $F = L/(4\\pi d^2)$."
  first_use: "Lecture 1"
  module: 1

luminosity:
  term: "Luminosity (L)"
  definition: "The total light energy emitted by a source per unit time—its intrinsic brightness."
  context: "Measured in erg/s or solar luminosities ($L_\\odot$). Luminosity is what the object emits; flux is what we receive."
  first_use: "Lecture 1"
  module: 1

standard_candle:
  term: "Standard candle"
  definition: "An object whose intrinsic luminosity can be determined independently, allowing distance to be calculated from observed brightness."
  context: "Examples: Cepheid variables (period → luminosity), Type Ia supernovae (consistent peak brightness)."
  first_use: "Lecture 1"
  module: 1

inverse_square_law:
  term: "Inverse-square law"
  definition: "The principle that flux decreases with the square of distance: double the distance, quarter the brightness."
  context: "$F = L/(4\\pi d^2)$. This geometric spreading is why distance determination is central to astronomy."
  first_use: "Lecture 1"
  module: 1

# Atomic Physics
emission:
  term: "Emission"
  definition: "Light produced and sent out by a source, often at specific wavelengths determined by atomic transitions."
  context: "Emission lines appear bright against a darker background."
  first_use: "Lecture 1"
  module: 1

absorption:
  term: "Absorption"
  definition: "Light removed from a beam by intervening material, often at specific wavelengths where atoms absorb photons."
  context: "Absorption lines appear dark against a brighter continuum."
  first_use: "Lecture 1"
  module: 1

ionized:
  term: "Ionized"
  definition: "An atom that has lost one or more electrons, leaving it with a net positive charge."
  context: "Ionization requires energy (heat or UV radiation). Ionized gas emits different spectral lines than neutral gas."
  first_use: "Lecture 1"
  module: 1

neutral:
  term: "Neutral"
  definition: "An atom with equal numbers of protons and electrons, having no net electric charge."
  context: "Neutral hydrogen emits at 21 cm (radio); ionized hydrogen emits at 656 nm (optical)."
  first_use: "Lecture 1"
  module: 1

# Thermal Radiation
thermal_radiation:
  term: "Thermal radiation"
  definition: "Light emitted by an object due to its temperature—all objects above absolute zero emit thermal radiation."
  context: "Hotter objects emit more light at shorter wavelengths (Wien's law)."
  first_use: "Lecture 1"
  module: 1

blackbody:
  term: "Blackbody"
  definition: "An idealized object that absorbs all incident radiation and emits a characteristic spectrum determined only by its temperature."
  context: "Stars approximate blackbodies. The blackbody spectrum peaks at $\\lambda_{\\text{peak}} = b/T$ (Wien's law)."
  first_use: "Lecture 1"
  module: 1

# Dust and Extinction
extinction:
  term: "Extinction"
  definition: "The dimming of light by dust through a combination of absorption and scattering."
  context: "Extinction is wavelength-dependent: blue light is extinguished more than red (interstellar reddening)."
  first_use: "Lecture 1"
  module: 1

# Time and Distance
lookback_time:
  term: "Lookback time"
  definition: "The time light takes to travel from a distant object to us—we see the object as it was that long ago."
  context: "Looking at the Andromeda Galaxy (2.5 million light-years away), we see it as it was 2.5 million years ago."
  first_use: "Lecture 1"
  module: 1

light_year:
  term: "Light-year"
  definition: "The distance light travels in one year—approximately $10^{18}$ cm or about 63,000 AU."
  context: "A unit of distance, not time. Proxima Centauri is 4.2 light-years away."
  first_use: "Lecture 1"
  module: 1

# Constants
planck_constant:
  term: "Planck's constant (h)"
  definition: "A fundamental constant that relates photon energy to frequency: $h = 6.63 \\times 10^{-27}$ erg·s."
  context: "The appearance of $h$ in an equation signals that quantum mechanics is involved."
  first_use: "Lecture 1"
  module: 1

speed_of_light:
  term: "Speed of light (c)"
  definition: "The speed at which light travels in vacuum: $c = 3 \\times 10^{10}$ cm/s."
  context: "A universal constant—the speed limit of the universe. Nothing with mass can reach this speed."
  first_use: "Lecture 1"
  module: 1

# Cosmology (Spoilers 9-10)
dark-matter:
  term: "Dark Matter"
  definition: "Invisible matter that does not emit, absorb, or reflect light but exerts gravitational influence."
  context: "Dark matter outweighs ordinary matter ~5:1 and is essential for explaining galaxy rotation curves and cosmic structure formation."
  first_use: "Lecture 1"
  module: 1

dark-energy:
  term: "Dark Energy"
  definition: "The unknown cause of the accelerating expansion of the universe, comprising ~68% of the cosmic energy budget."
  context: "Often modeled as a cosmological constant (Λ), but its physical origin remains one of the deepest mysteries in physics."
  first_use: "Lecture 1"
  module: 1

hubble-constant:
  term: "Hubble Constant (H₀)"
  definition: "The current expansion rate of the universe, approximately 70 km/s/Mpc."
  context: "A galaxy 1 Mpc away recedes at ~70 km/s; one 10 Mpc away recedes at ~700 km/s. The inverse of H₀ gives a rough estimate of the universe's age."
  first_use: "Lecture 1"
  module: 1

rotation-curve:
  term: "Rotation Curve"
  definition: "A plot of orbital speed versus distance from a galaxy's center."
  context: "Flat rotation curves—where speed stays constant at large radii—are the primary evidence for dark matter halos around galaxies."
  first_use: "Lecture 1"
  module: 1

redshift-cosmological:
  term: "Redshift (Cosmological)"
  definition: "The stretching of light wavelengths due to the expansion of space."
  context: "More distant galaxies show larger redshifts because light has traveled through more expanding space to reach us."
  first_use: "Lecture 1"
  module: 1

lcdm:
  term: "ΛCDM"
  definition: "The standard cosmological model: Λ (cosmological constant/dark energy) + CDM (Cold Dark Matter)."
  context: "Fits observations remarkably well with only six free parameters, but leaves dark matter and dark energy unexplained."
  first_use: "Lecture 1"
  module: 1

cosmic-web:
  term: "Cosmic Web"
  definition: "The large-scale structure of the universe: galaxies arranged in filaments, walls, and clusters, separated by vast voids."
  context: "The cosmic web is still evolving—gravity continues to pull matter from voids into filaments and clusters."
  first_use: "Lecture 1"
  module: 1

# =============================================================
# Lecture 3: Gravity and Orbits
# =============================================================

empirical_law:
  term: "Empirical law"
  definition: "A pattern extracted from data that describes *what* happens without explaining *why*."
  context: "Kepler's laws are empirical—they predict planetary positions but don't explain the mechanism."
  first_use: "Lecture 3"
  module: 1

physical_law:
  term: "Physical law"
  definition: "A fundamental principle explaining mechanisms—*why* things happen—from which empirical patterns follow as consequences."
  context: "Newton's law of gravitation is physical—Kepler's laws emerge as consequences."
  first_use: "Lecture 3"
  module: 1

eccentricity:
  term: "Eccentricity (e)"
  definition: "A measure of how 'squashed' an ellipse is; $e=0$ is a circle, $e=1$ is a parabola."
  context: "Most planetary orbits have small eccentricities (Earth's is 0.017)."
  first_use: "Lecture 3"
  module: 1

semi_major_axis:
  term: "Semi-major axis (a)"
  definition: "Half the longest diameter of an ellipse; the 'average' distance from an orbiting body to its host."
  context: "We reserve the symbol $a$ for this quantity throughout the course."
  first_use: "Lecture 3"
  module: 1

perihelion:
  term: "Perihelion"
  definition: "The point in an orbit closest to the Sun, where $r_p = a(1-e)$."
  context: "At perihelion, orbital speed is maximum (Kepler II)."
  first_use: "Lecture 3"
  module: 1

aphelion:
  term: "Aphelion"
  definition: "The point in an orbit farthest from the Sun, where $r_a = a(1+e)$."
  context: "At aphelion, orbital speed is minimum."
  first_use: "Lecture 3"
  module: 1

central_force:
  term: "Central force"
  definition: "A force that always points directly toward (or away from) a fixed center point."
  context: "Gravity is a central force. Central forces conserve angular momentum."
  first_use: "Lecture 3"
  module: 1

vector:
  term: "Vector"
  definition: "A quantity with both magnitude (how much) and direction (which way)."
  context: "Velocity is a vector; speed is just the magnitude of velocity."
  first_use: "Lecture 3"
  module: 1

velocity:
  term: "Velocity"
  definition: "The rate of change of position—how fast something moves *and* in what direction."
  context: "Velocity is a vector. Speed is its magnitude (always ≥ 0)."
  first_use: "Lecture 3"
  module: 1

acceleration:
  term: "Acceleration"
  definition: "The rate of change of velocity—any change in speed *or* direction."
  context: "An object moving in a circle at constant speed is still accelerating because direction changes."
  first_use: "Lecture 3"
  module: 1

inertia:
  term: "Inertia"
  definition: "The resistance of an object to changes in its motion; quantified by mass."
  context: "Newton's First Law: objects resist changes to their velocity."
  first_use: "Lecture 3"
  module: 1

kinematics:
  term: "Kinematics"
  definition: "The mathematical description of motion (position, velocity, acceleration) without reference to forces."
  context: "Kinematics describes *how* things move; dynamics explains *why*."
  first_use: "Lecture 3"
  module: 1

centripetal_acceleration:
  term: "Centripetal acceleration"
  definition: "The inward acceleration required for circular motion, with magnitude $a_c = v^2/r$."
  context: "Points toward the center of the circle; caused by whatever force maintains the circular path."
  first_use: "Lecture 3"
  module: 1

centripetal_force:
  term: "Centripetal force"
  definition: "The net inward force required to maintain circular motion: $F_c = mv^2/r$."
  context: "Not a new type of force—it's a role played by gravity, tension, friction, etc."
  first_use: "Lecture 3"
  module: 1

barycenter:
  term: "Barycenter (center of mass)"
  definition: "The 'balance point' of a two-body system; both bodies orbit this point."
  context: "When $M \\gg m$, the barycenter lies near the massive body's center."
  first_use: "Lecture 3"
  module: 1

orbital_velocity:
  term: "Orbital velocity"
  definition: "The speed required for a stable circular orbit at radius $r$: $v_{orb} = \\sqrt{GM/r}$."
  context: "Faster orbits are closer to the central mass."
  first_use: "Lecture 3"
  module: 1

escape_velocity:
  term: "Escape velocity"
  definition: "The minimum speed to escape a gravitational field: $v_{esc} = \\sqrt{2GM/r} = \\sqrt{2}\\,v_{orb}$."
  context: "Independent of the escaping object's mass."
  first_use: "Lecture 3"
  module: 1

kinetic_energy:
  term: "Kinetic energy (K)"
  definition: "Energy of motion: $K = \\frac{1}{2}mv^2$. Always positive or zero."
  context: "Measured in ergs (CGS) or joules (SI)."
  first_use: "Lecture 3"
  module: 1

gravitational_potential_energy:
  term: "Gravitational potential energy (U)"
  definition: "Energy stored in gravitational position: $U = -GMm/r$. Always negative (with zero at infinity)."
  context: "Think of negative U as 'gravitational debt'—how much energy is owed to escape."
  first_use: "Lecture 3"
  module: 1

angular_momentum:
  term: "Angular momentum (L)"
  definition: "A conserved quantity for orbital motion: $L = mvr = mr^2\\dot{\\phi}$."
  context: "Conservation of angular momentum explains Kepler's Second Law."
  first_use: "Lecture 3"
  module: 1

angular_velocity:
  term: "Angular velocity ($\\dot{\\phi}$)"
  definition: "The rate at which an angle changes, in radians per second."
  context: "$\\dot{\\phi} = d\\phi/dt \\approx \\Delta\\phi/\\Delta t$"
  first_use: "Lecture 3"
  module: 1

torque:
  term: "Torque"
  definition: "A twisting force—what causes angular acceleration (spinning faster or slower)."
  context: "A central force exerts no torque about the center, so angular momentum is conserved."
  first_use: "Lecture 3"
  module: 1

areal_velocity:
  term: "Areal velocity"
  definition: "The rate at which an orbiting object sweeps out area: $dA/dt = L/(2m)$."
  context: "Kepler's Second Law: areal velocity is constant for any orbit under gravity."
  first_use: "Lecture 3"
  module: 1

virial_theorem:
  term: "Virial theorem"
  definition: "For bound systems in equilibrium: $\\langle K \\rangle = -\\frac{1}{2}\\langle U \\rangle$."
  context: "Relates kinetic and potential energy in stars, galaxies, and orbits (time-averaged)."
  first_use: "Lecture 3"
  module: 1

general_relativity:
  term: "General Relativity"
  definition: "Einstein's 1915 theory: gravity is the curvature of spacetime, not a force acting at a distance."
  context: "Newton's gravity is an excellent approximation except near extreme masses or at high speeds."
  first_use: "Lecture 3"
  module: 1

schwarzschild_radius:
  term: "Schwarzschild radius"
  definition: "The radius of a black hole's event horizon: $r_s = 2GM/c^2$."
  context: "Inside this radius, escape velocity exceeds the speed of light."
  first_use: "Lecture 3"
  module: 1

event_horizon:
  term: "Event horizon"
  definition: "The boundary of a black hole beyond which nothing—not even light—can escape."
  context: "Not a physical surface, but a point of no return in spacetime."
  first_use: "Lecture 3"
  module: 1
