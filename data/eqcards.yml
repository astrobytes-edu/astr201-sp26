# Equation Meaning Scaffolds
# Each entry: predicts, depends, says, assumptions (optional)
# Usage: Referenced by equations.yml via card field

kepler_period:
  predicts: "Given $r, M$, it predicts the orbital period $P$."
  depends: "Scales as $P \\propto r^{3/2}$ and $P \\propto M^{-1/2}$."
  says: "Farther orbits take much longer; more central mass makes orbits faster."
  assumptions:
    - "Orbit is approximately circular"
    - "Central mass dominates (two-body approximation)"
    - "Newtonian gravity"

schwarzschild_radius:
  predicts: "Given $M$, it predicts the event horizon radius $R_{\\mathrm{sch}}$."
  depends: "Scales as $R_{\\mathrm{sch}} \\propto M$."
  says: "More massive objects have larger event horizons—linearly."
  assumptions:
    - "Non-rotating (Schwarzschild, not Kerr)"
    - "Uncharged"
    - "Spherically symmetric"

newton_gravity:
  predicts: "Given $M$, $m$, and $r$, it predicts the gravitational force $F$."
  depends: "Scales as $F \\propto Mm/r^2$."
  says: "Gravity weakens with distance squared; stronger between more massive objects."
  assumptions:
    - "Point masses or spherically symmetric"
    - "Newtonian (non-relativistic)"
    - "No other forces acting"

stefan_boltzmann:
  predicts: "Given $R$ and $T$, it predicts the luminosity $L$."
  depends: "Scales as $L \\propto R^2 T^4$."
  says: "Luminosity depends on surface area ($R^2$) and temperature ($T^4$). Double the temperature, get 16× the luminosity."
  assumptions:
    - "Blackbody radiation"
    - "Spherical, uniformly radiating surface"
    - "Effective surface temperature"

flux_luminosity_distance:
  predicts: "Given $L$ and $d$, it predicts the observed flux $F$ at the detector."
  depends: "Scales as $F \\propto L$ and $F \\propto d^{-2}$."
  says: "Apparent brightness mixes intrinsic power and distance; to infer $L$ from $F$, you must also know $d$."
  assumptions:
    - "Approximately isotropic emission (radiates equally in all directions)"
    - "Negligible absorption/scattering between source and observer"

lookback_time:
  predicts: "Given a distance $d$, it predicts the light travel time $t$ (the time between emission and detection)."
  depends: "Scales as $t \\propto d$ and $t \\propto c^{-1}$."
  says: "Light takes time to travel; looking farther away means seeing older light."
  assumptions:
    - "Light travels in a straight line at speed $c$ (simplified picture)"
    - "Ignores cosmological expansion and strong gravitational time-delay effects"

wave_relation:
  predicts: "Given any two of $c$, $\\lambda$, $\\nu$, it predicts the third."
  depends: "$\\lambda \\propto \\nu^{-1}$ (inverse relationship at fixed $c$)."
  says: "Wavelength and frequency are two ways of describing the same wave; longer wavelength means lower frequency."
  assumptions:
    - "Light travels in vacuum at speed $c$"
    - "Applies to all electromagnetic radiation"

photon_energy:
  predicts: "Given wavelength $\\lambda$ (or frequency $\\nu$), it predicts the energy $E$ of a single photon."
  depends: "$E \\propto \\nu$ and $E \\propto \\lambda^{-1}$."
  says: "Shorter wavelength = higher energy photon. The constant $h$ signals quantum mechanics is at work."
  assumptions:
    - "Light comes in discrete packets (photons)"
    - "Each photon carries energy proportional to its frequency"
    - "This is a quantum mechanical result—classical physics cannot predict it"

bohr_energy:
  predicts: "Given principal quantum number $n$, it predicts the (approximate) bound-state energy $E_n$ for hydrogen."
  depends: "Scales as $E_n \\propto -1/n^2$."
  says: "Hydrogen’s electron energies are quantized: only discrete levels are allowed. Higher $n$ means less tightly bound (energy closer to 0)."
  assumptions:
    - "Hydrogen atom (one electron, one proton)"
    - "Bohr model approximation (non-relativistic; ignores fine structure/spin)"
    - "Energies are commonly reported in eV (conversion: $1\\ \\text{eV} \\approx 1.6\\times10^{-12}\\ \\text{erg}$)"

rayleigh_scattering:
  predicts: "How the strength of scattering depends on wavelength for particles much smaller than the wavelength."
  depends: "Scales as $\\sigma \\propto \\lambda^{-4}$."
  says: "Short wavelengths scatter much more strongly than long wavelengths, which is why blue light is scattered more than red light."
  assumptions:
    - "Particle size $\\ll \\lambda$ (Rayleigh regime)"
    - "Elastic scattering (photon energy unchanged)"

telescope_resolution:
  predicts: "The smallest angular separation $\\theta_{\\min}$ a telescope can resolve (diffraction limit)."
  depends: "Depends on wavelength $\\lambda$ and aperture diameter $D$; scales as $\\theta_{\\min} \\propto \\lambda/D$."
  says: "Bigger apertures resolve finer detail; shorter wavelengths resolve finer detail. Use radians when $\\lambda$ and $D$ use the same length units."
  assumptions:
    - "Diffraction-limited optics (no atmospheric seeing)"
    - "Order-of-magnitude form for a circular aperture"

collecting_area:
  predicts: "How much light a telescope can gather via its geometric collecting area $A$."
  depends: "Scales as $A \\propto D^2$ for a circular aperture."
  says: "Doubling diameter gives 4× collecting area, which improves photon counts and signal-to-noise for faint objects."
  assumptions:
    - "Circular aperture; ignores central obstruction and throughput losses"

wien_displacement:
  predicts: "Given temperature $T$, it predicts the peak wavelength $\\lambda_{\\text{peak}}$ of thermal emission."
  depends: "$\\lambda_{\\text{peak}} \\propto T^{-1}$."
  says: "Hotter objects peak at shorter wavelengths (bluer); cooler objects peak at longer wavelengths (redder)."
  assumptions:
    - "Object radiates as a blackbody (or approximately so)"
    - "Applies to thermal (temperature-driven) radiation"

planck_function:
  predicts: "Spectral radiance $B_\\lambda$ of a blackbody as a function of wavelength."
  depends: "Wavelength $\\lambda$ and temperature $T$, with constants $h$, $c$, and $k_B$."
  says: "Two factors compete: the $\\lambda^{-5}$ term pushes short wavelengths up, while the exponential term suppresses them. Because $h\\nu$ and $k_B T$ are both energies, the ratio $h\\nu/k_B T$ (or $hc/\\lambda k_B T$) is dimensionless and sets the regime: $h\\nu \\ll k_B T$ → Rayleigh–Jeans power law; $h\\nu \\gg k_B T$ → Wien tail."
  assumptions:
    - "Object radiates as an ideal blackbody in thermal equilibrium"
    - "Spectrum expressed per unit wavelength interval"

centripetal_acceleration:
  predicts: "How much acceleration is needed to maintain circular motion at speed $v$ and radius $r$"
  depends: "Speed ($v$), radius ($r$)"
  says: "Faster motion or tighter curves require more acceleration toward the center"
  assumptions:
    - "Circular (not elliptical) motion"
    - "Constant speed"

centripetal_force:
  predicts: "The net inward force required for circular motion"
  depends: "Mass ($m$), speed ($v$), radius ($r$)"
  says: "This is a requirement, not a new force type—some real force (gravity, tension, friction) must supply it"
  assumptions:
    - "Circular motion"
    - "Constant speed"

orbital_velocity:
  predicts: "The speed needed for a stable circular orbit at radius $r$ around mass $M$"
  depends: "Central mass ($M$), orbital radius ($r$)"
  says: "Closer orbits require higher speeds; the orbiting object's mass doesn't matter"
  assumptions:
    - "Circular orbit"
    - "$m \\ll M$ (orbiter much less massive than central body)"

escape_velocity:
  predicts: "The minimum speed to escape a gravitational field from radius $r$"
  depends: "Central mass ($M$), starting radius ($r$)"
  says: "Equal to $\\sqrt{2}$ times orbital velocity; escaping mass doesn't matter"
  assumptions:
    - "No additional forces (drag, thrust)"
    - "Starting from rest at infinity = zero total energy"

gravitational_pe:
  predicts: "The energy stored in gravitational position relative to infinity"
  depends: "Both masses ($M$, $m$), separation ($r$)"
  says: "Negative because we define $U=0$ at infinity; more negative = deeper in the gravity well"
  assumptions:
    - "Point masses (or spherically symmetric)"
    - "Reference: $U=0$ at $r=\\infty$"

angular_momentum:
  predicts: "A conserved quantity for motion under central forces"
  depends: "Mass ($m$), radius ($r$), tangential velocity ($v$) or angular velocity ($\\dot{\\phi}$)"
  says: "Conserved because central forces exert no torque; explains Kepler's Second Law"
  assumptions:
    - "Central force (points toward/away from a fixed center)"
    - "No external torques"

areal_velocity:
  predicts: "The rate at which an orbiting body sweeps out area"
  depends: "Angular momentum ($L$), mass ($m$)"
  says: "Constant for any orbit under gravity—this IS Kepler's Second Law"
  assumptions:
    - "Central force (gravity)"
    - "Two-body problem"

virial_theorem:
  predicts: "The ratio of kinetic to potential energy in bound, equilibrium systems"
  depends: "Time-averaged kinetic energy $\\langle K \\rangle$, potential energy $\\langle U \\rangle$"
  says: "In equilibrium, kinetic energy is half the magnitude of potential energy"
  assumptions:
    - "Gravitationally bound system"
    - "In equilibrium OR time-averaged over complete orbits"
    - "Does NOT apply instant-by-instant in elliptical orbits"

total_mechanical_energy:
  predicts: "Whether an orbit is bound ($E<0$), unbound ($E>0$), or marginally bound ($E=0$)"
  depends: "Kinetic energy ($K$), potential energy ($U$)"
  says: "Energy is conserved; $K$ and $U$ trade off but total stays constant"
  assumptions:
    - "No non-gravitational forces"
    - "Isolated two-body system"

bound_orbit_energy:
  predicts: "The total energy of any bound (elliptical or circular) orbit"
  depends: "Both masses ($M$, $m$), semi-major axis ($a$)"
  says: "Total energy depends only on $a$, not on eccentricity"
  assumptions:
    - "Bound orbit ($E<0$)"
    - "Two-body gravitational system"

doppler_shift:
  predicts: "Given rest wavelength $\\lambda_0$ and observed wavelength $\\lambda_{\\text{obs}}$, it predicts the radial velocity $v_r$ (or vice versa)."
  depends: "The fractional shift scales as $\\Delta\\lambda/\\lambda_0 \\propto v_r$ and inversely with $c$."
  says: "Motion along the line of sight stretches or compresses wavelengths: away → redshift, toward → blueshift."
  assumptions:
    - "Speeds are much less than the speed of light (non-relativistic)"
    - "Only the line-of-sight component matters"
    - "Rest wavelength is known from lab measurements"

small_angle:
  predicts: "Given angular size $\\alpha$ (radians) and distance $d$, it predicts the true physical size $s$ of an object (or vice versa)."
  depends: "Scales as $s \\propto \\alpha d$; angular size is inversely proportional to distance at fixed physical size."
  says: "For small angles, the arc length equals the chord length — geometry becomes simple multiplication. Angular size, physical size, and distance form a triangle; know any two, infer the third."
  assumptions:
    - "Angle is small ($\\alpha \\lesssim 0.1$ rad $\\approx$ 6°)"
    - "Uses $\\sin\\alpha \\approx \\alpha$ (radians); error is $<0.5\\%$ for $\\alpha < 0.1$ rad"
    - "Both $s$ and $d$ must be in the same length units"

parallax_general:
  predicts: "Given a baseline length $b$ and measured parallax angle $p$ (radians), it predicts the distance $d$ to the object."
  depends: "Scales as $d \\propto b$ and $d \\propto p^{-1}$. Longer baselines probe greater distances; smaller parallax angles mean farther objects."
  says: "Parallax is the small-angle formula applied to distance measurement. The baseline sets the distance reach — a longer baseline lets you measure smaller angles and therefore greater distances. This equation works for any baseline: the diameter of your head (binocular vision), the radius of Earth's orbit (stellar parallax), or the orbit of Jupiter (if you could observe from there)."
  assumptions:
    - "Small-angle regime ($p \\ll 1$ rad)"
    - "Baseline $b$ is known precisely"
    - "Background reference objects are effectively at infinity"

parallax_parsec:
  predicts: "Given stellar parallax $p$ in arcseconds (measured from Earth's orbit), it predicts the distance $d$ in parsecs."
  depends: "Scales as $d \\propto p^{-1}$. Halving the parallax doubles the inferred distance."
  says: "This compact form hides two specific choices: (1) baseline = 1 AU (Earth's orbital radius), and (2) angle measured in arcseconds. The parsec is defined as the distance at which 1 AU subtends 1 arcsecond. It is not a universal constant of nature — it is a unit tied to Earth's orbit. An observer on Jupiter ($b \\approx 5.2$ AU) using the same angular units would define a 'Jupiter-parsec' 5.2 times larger."
  assumptions:
    - "Baseline is Earth's orbital radius (1 AU)"
    - "Parallax angle $p$ is in arcseconds"
    - "Small-angle regime (always satisfied for stellar parallax)"
    - "Background reference stars are effectively at infinity"
