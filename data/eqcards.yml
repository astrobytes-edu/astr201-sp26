# Equation Meaning Scaffolds
# Each entry: predicts, depends, says, assumptions (optional)
# Usage: Referenced by equations.yml via card field

kepler_period:
  predicts: "Given $r, M$, it predicts the orbital period $P$."
  depends: "Scales as $P \\propto r^{3/2}$ and $P \\propto M^{-1/2}$."
  says: "Farther orbits take much longer; more central mass makes orbits faster."
  assumptions:
    - "Orbit is approximately circular"
    - "Central mass dominates (two-body approximation)"
    - "Newtonian gravity"

schwarzschild_radius:
  predicts: "Given $M$, it predicts the event horizon radius $R_{\\mathrm{sch}}$."
  depends: "Scales as $R_{\\mathrm{sch}} \\propto M$."
  says: "More massive objects have larger event horizons—linearly."
  assumptions:
    - "Non-rotating (Schwarzschild, not Kerr)"
    - "Uncharged"
    - "Spherically symmetric"

newton_gravity:
  predicts: "Given $M$, $m$, and $r$, it predicts the gravitational force $F$."
  depends: "Scales as $F \\propto Mm/r^2$."
  says: "Gravity weakens with distance squared; stronger between more massive objects."
  assumptions:
    - "Point masses or spherically symmetric"
    - "Newtonian (non-relativistic)"
    - "No other forces acting"

stefan_boltzmann:
  predicts: "Given $R$ and $T$, it predicts the luminosity $L$."
  depends: "Scales as $L \\propto R^2 T^4$."
  says: "Luminosity depends on surface area ($R^2$) and temperature ($T^4$). Double the temperature, get 16× the luminosity."
  assumptions:
    - "Blackbody radiation"
    - "Spherical, uniformly radiating surface"
    - "Effective surface temperature"

flux_luminosity_distance:
  predicts: "Given $L$ and $d$, it predicts the observed flux $F$ at the detector."
  depends: "Scales as $F \\propto L$ and $F \\propto d^{-2}$."
  says: "Apparent brightness mixes intrinsic power and distance; to infer $L$ from $F$, you must also know $d$."
  assumptions:
    - "Approximately isotropic emission (radiates equally in all directions)"
    - "Negligible absorption/scattering between source and observer"

lookback_time:
  predicts: "Given a distance $d$, it predicts the light travel time $t$ (the time between emission and detection)."
  depends: "Scales as $t \\propto d$ and $t \\propto c^{-1}$."
  says: "Light takes time to travel; looking farther away means seeing older light."
  assumptions:
    - "Light travels in a straight line at speed $c$ (simplified picture)"
    - "Ignores cosmological expansion and strong gravitational time-delay effects"

wave_relation:
  predicts: "Given any two of $c$, $\\lambda$, $\\nu$, it predicts the third."
  depends: "$\\lambda \\propto \\nu^{-1}$ (inverse relationship at fixed $c$)."
  says: "Wavelength and frequency are two ways of describing the same wave; longer wavelength means lower frequency."
  assumptions:
    - "Light travels in vacuum at speed $c$"
    - "Applies to all electromagnetic radiation"

photon_energy:
  predicts: "Given wavelength $\\lambda$ (or frequency $\\nu$), it predicts the energy $E$ of a single photon."
  depends: "$E \\propto \\nu$ and $E \\propto \\lambda^{-1}$."
  says: "Shorter wavelength = higher energy photon. The constant $h$ signals quantum mechanics is at work."
  assumptions:
    - "Light comes in discrete packets (photons)"
    - "Each photon carries energy proportional to its frequency"
    - "This is a quantum mechanical result—classical physics cannot predict it"

bohr_energy:
  predicts: "Given principal quantum number $n$, it predicts the (approximate) bound-state energy $E_n$ for hydrogen."
  depends: "Scales as $E_n \\propto -1/n^2$."
  says: "Hydrogen’s electron energies are quantized: only discrete levels are allowed. Higher $n$ means less tightly bound (energy closer to 0)."
  assumptions:
    - "Hydrogen atom (one electron, one proton)"
    - "Bohr model approximation (non-relativistic; ignores fine structure/spin)"
    - "Energies are commonly reported in eV (conversion: $1\\ \\text{eV} \\approx 1.6\\times10^{-12}\\ \\text{erg}$)"

rayleigh_scattering:
  predicts: "How the strength of scattering depends on wavelength for particles much smaller than the wavelength."
  depends: "Scales as $\\sigma \\propto \\lambda^{-4}$."
  says: "Short wavelengths scatter much more strongly than long wavelengths, which is why blue light is scattered more than red light."
  assumptions:
    - "Particle size $\\ll \\lambda$ (Rayleigh regime)"
    - "Elastic scattering (photon energy unchanged)"

telescope_resolution:
  predicts: "The smallest angular separation $\\theta_{\\min}$ a telescope can resolve (diffraction limit)."
  depends: "Depends on wavelength $\\lambda$ and aperture diameter $D$; scales as $\\theta_{\\min} \\propto \\lambda/D$."
  says: "Bigger apertures resolve finer detail; shorter wavelengths resolve finer detail. Use radians when $\\lambda$ and $D$ use the same length units."
  assumptions:
    - "Diffraction-limited optics (no atmospheric seeing)"
    - "Order-of-magnitude form for a circular aperture"

collecting_area:
  predicts: "How much light a telescope can gather via its geometric collecting area $A$."
  depends: "Scales as $A \\propto D^2$ for a circular aperture."
  says: "Doubling diameter gives 4× collecting area, which improves photon counts and signal-to-noise for faint objects."
  assumptions:
    - "Circular aperture; ignores central obstruction and throughput losses"

wien_displacement:
  predicts: "Given temperature $T$, it predicts the peak wavelength $\\lambda_{\\text{peak}}$ of thermal emission."
  depends: "$\\lambda_{\\text{peak}} \\propto T^{-1}$."
  says: "Hotter objects peak at shorter wavelengths (bluer); cooler objects peak at longer wavelengths (redder)."
  assumptions:
    - "Object radiates as a blackbody (or approximately so)"
    - "Applies to thermal (temperature-driven) radiation"

planck_function:
  predicts: "Spectral radiance $B_\\lambda$ of a blackbody as a function of wavelength."
  depends: "Wavelength $\\lambda$ and temperature $T$, with constants $h$, $c$, and $k_B$."
  says: "Two factors compete: the $\\lambda^{-5}$ term pushes short wavelengths up, while the exponential term suppresses them. Because $h\\nu$ and $k_B T$ are both energies, the ratio $h\\nu/k_B T$ (or $hc/\\lambda k_B T$) is dimensionless and sets the regime: $h\\nu \\ll k_B T$ → Rayleigh–Jeans power law; $h\\nu \\gg k_B T$ → Wien tail."
  assumptions:
    - "Object radiates as an ideal blackbody in thermal equilibrium"
    - "Spectrum expressed per unit wavelength interval"

centripetal_acceleration:
  predicts: "How much acceleration is needed to maintain circular motion at speed $v$ and radius $r$"
  depends: "Speed ($v$), radius ($r$)"
  says: "Faster motion or tighter curves require more acceleration toward the center"
  assumptions:
    - "Circular (not elliptical) motion"
    - "Constant speed"

centripetal_force:
  predicts: "The net inward force required for circular motion"
  depends: "Mass ($m$), speed ($v$), radius ($r$)"
  says: "This is a requirement, not a new force type—some real force (gravity, tension, friction) must supply it"
  assumptions:
    - "Circular motion"
    - "Constant speed"

orbital_velocity:
  predicts: "The speed needed for a stable circular orbit at radius $r$ around mass $M$"
  depends: "Central mass ($M$), orbital radius ($r$)"
  says: "Closer orbits require higher speeds; the orbiting object's mass doesn't matter"
  assumptions:
    - "Circular orbit"
    - "$m \\ll M$ (orbiter much less massive than central body)"

escape_velocity:
  predicts: "The minimum speed to escape a gravitational field from radius $r$"
  depends: "Central mass ($M$), starting radius ($r$)"
  says: "Equal to $\\sqrt{2}$ times orbital velocity; escaping mass doesn't matter"
  assumptions:
    - "No additional forces (drag, thrust)"
    - "Starting from rest at infinity = zero total energy"

gravitational_pe:
  predicts: "The energy stored in gravitational position relative to infinity"
  depends: "Both masses ($M$, $m$), separation ($r$)"
  says: "Negative because we define $U=0$ at infinity; more negative = deeper in the gravity well"
  assumptions:
    - "Point masses (or spherically symmetric)"
    - "Reference: $U=0$ at $r=\\infty$"

angular_momentum:
  predicts: "A conserved quantity for motion under central forces"
  depends: "Mass ($m$), radius ($r$), tangential velocity ($v$) or angular velocity ($\\dot{\\phi}$)"
  says: "Conserved because central forces exert no torque; explains Kepler's Second Law"
  assumptions:
    - "Central force (points toward/away from a fixed center)"
    - "No external torques"

areal_velocity:
  predicts: "The rate at which an orbiting body sweeps out area"
  depends: "Angular momentum ($L$), mass ($m$)"
  says: "Constant for any orbit under gravity—this IS Kepler's Second Law"
  assumptions:
    - "Central force (gravity)"
    - "Two-body problem"

virial_theorem:
  predicts: "The ratio of kinetic to potential energy in bound, equilibrium systems"
  depends: "Time-averaged kinetic energy $\\langle K \\rangle$, potential energy $\\langle U \\rangle$"
  says: "In equilibrium, kinetic energy is half the magnitude of potential energy"
  assumptions:
    - "Gravitationally bound system"
    - "In equilibrium OR time-averaged over complete orbits"
    - "Does NOT apply instant-by-instant in elliptical orbits"

total_mechanical_energy:
  predicts: "Whether an orbit is bound ($E<0$), unbound ($E>0$), or marginally bound ($E=0$)"
  depends: "Kinetic energy ($K$), potential energy ($U$)"
  says: "Energy is conserved; $K$ and $U$ trade off but total stays constant"
  assumptions:
    - "No non-gravitational forces"
    - "Isolated two-body system"

bound_orbit_energy:
  predicts: "The total energy of any bound (elliptical or circular) orbit"
  depends: "Both masses ($M$, $m$), semi-major axis ($a$)"
  says: "Total energy depends only on $a$, not on eccentricity"
  assumptions:
    - "Bound orbit ($E<0$)"
    - "Two-body gravitational system"

doppler_shift:
  predicts: "Given rest wavelength $\\lambda_0$ and observed wavelength $\\lambda_{\\text{obs}}$, it predicts the radial velocity $v_r$ (or vice versa)."
  depends: "The fractional shift scales as $\\Delta\\lambda/\\lambda_0 \\propto v_r$ and inversely with $c$."
  says: "Motion along the line of sight stretches or compresses wavelengths: away → redshift, toward → blueshift."
  assumptions:
    - "Speeds are much less than the speed of light (non-relativistic)"
    - "Only the line-of-sight component matters"
    - "Rest wavelength is known from lab measurements"

small_angle:
  predicts: "Given angular size $\\alpha$ (radians) and distance $d$, it predicts the true physical size $s$ of an object (or vice versa)."
  depends: "Scales as $s \\propto \\alpha d$; angular size is inversely proportional to distance at fixed physical size."
  says: "For small angles, the arc length equals the chord length — geometry becomes simple multiplication. Angular size, physical size, and distance form a triangle; know any two, infer the third."
  assumptions:
    - "Angle is small ($\\alpha \\lesssim 0.1$ rad $\\approx$ 6°)"
    - "Uses $\\sin\\alpha \\approx \\alpha$ (radians); error is $<0.5\\%$ for $\\alpha < 0.1$ rad"
    - "Both $s$ and $d$ must be in the same length units"

parallax_general:
  predicts: "Given a baseline length $b$ and measured parallax angle $p$ (radians), it predicts the distance $d$ to the object."
  depends: "Scales as $d \\propto b$ and $d \\propto p^{-1}$. Longer baselines probe greater distances; smaller parallax angles mean farther objects."
  says: "Parallax is the small-angle formula applied to distance measurement. The baseline sets the distance reach — a longer baseline lets you measure smaller angles and therefore greater distances. This equation works for any baseline: the diameter of your head (binocular vision), the radius of Earth's orbit (stellar parallax), or the orbit of Jupiter (if you could observe from there)."
  assumptions:
    - "Small-angle regime ($p \\ll 1$ rad)"
    - "Baseline $b$ is known precisely"
    - "Background reference objects are effectively at infinity"

parallax_parsec:
  predicts: "Given stellar parallax $p$ in arcseconds (measured from Earth's orbit), it predicts the distance $d$ in parsecs."
  depends: "Scales as $d \\propto p^{-1}$. Halving the parallax doubles the inferred distance."
  says: "This compact form hides two specific choices: (1) baseline = 1 AU (Earth's orbital radius), and (2) angle measured in arcseconds. The parsec is defined as the distance at which 1 AU subtends 1 arcsecond. It is not a universal constant of nature — it is a unit tied to Earth's orbit. An observer on Jupiter ($b \\approx 5.2$ AU) using the same angular units would define a 'Jupiter-parsec' 5.2 times larger."
  assumptions:
    - "Baseline is Earth's orbital radius (1 AU)"
    - "Parallax angle $p$ is in arcseconds"
    - "Small-angle regime (always satisfied for stellar parallax)"
    - "Background reference stars are effectively at infinity"

kepler_binary:
  predicts: "Given the orbital separation $a$ and total mass $M_1 + M_2$, it predicts the orbital period $P$ (or vice versa)."
  depends: "Scales as $P \\propto a^{3/2}$ and $P \\propto (M_1 + M_2)^{-1/2}$."
  says: "Newton's version of Kepler's third law — the *total mass* of a binary system determines how fast the two stars orbit each other at a given separation."
  assumptions:
    - "Approximately circular orbits (eccentricity $e \\approx 0$)"
    - "Newtonian gravity"
    - "Both masses contribute — this is the full two-body version"

center_of_mass:
  predicts: "Given the two masses $M_1$ and $M_2$, it predicts the ratio of their orbital radii $a_1/a_2$."
  depends: "The more massive star orbits closer to the center of mass: $a_1/a_2 = M_2/M_1$."
  says: "Newton's third law in action — both stars orbit the center of mass, but the heavier star has a smaller orbit."
  assumptions:
    - "Isolated two-body system"
    - "No external forces"

mass_luminosity:
  predicts: "Given a main-sequence star's mass $M$, it predicts its luminosity $L$ (approximately)."
  depends: "Scales as $L \\propto M^{3.5}$ — a steep power law."
  says: "Mass is the master variable for main-sequence stars. Doubling the mass increases luminosity by roughly $2^{3.5} \\approx 11\\times$."
  assumptions:
    - "Star is on the main sequence (core hydrogen burning)"
    - "Exponent $\\approx 3.5$ is an approximation — actual slope varies from $\\sim 2.3$ for $M < 0.43\\,M_\\odot$ to $\\sim 4$ for $M > 2\\,M_\\odot$"
    - "Empirical relation derived from binary star mass measurements"

kepler_solar:
  predicts: "Given the orbital separation $a$ (in AU) and period $P$ (in yr), it predicts the total mass $M_1 + M_2$ in solar masses — no constants needed."
  depends: "Scales as $M_{\\text{total}} \\propto a^3$ and $M_{\\text{total}} \\propto P^{-2}$."
  says: "The astronomer's working form of Kepler III — all constants absorbed into the choice of solar/AU/yr units. If $a$ in AU and $P$ in yr, the answer comes out in $M_\\odot$ automatically."
  assumptions:
    - "Same physics as Kepler III for binaries — this is a unit-scaling convenience, not a different equation"
    - "Valid for any binary orbit (stellar, planetary) when using AU, yr, $M_\\odot$"
    - "Approximately circular orbits"

distance_modulus:
  predicts: "Given a star's apparent magnitude $m$ and absolute magnitude $M$, it predicts the distance $d$ (or vice versa)."
  depends: "Scales as $(m - M) \\propto \\log_{10}(d)$. Every 5 magnitudes of distance modulus corresponds to a factor of 10 in distance."
  says: "The difference between how bright a star *looks* and how bright it *is* encodes the distance. This is the inverse-square law in logarithmic form."
  assumptions:
    - "No interstellar extinction (dust absorption) — or extinction has been corrected"
    - "Absolute magnitude $M$ is defined at $d = 10~\\text{pc}$"

magnitude_flux:
  predicts: "Given the flux ratio $F_1/F_2$ of two sources, it predicts their magnitude difference $m_1 - m_2$ (or vice versa)."
  depends: "A factor of 100 in flux corresponds to exactly 5 magnitudes. Brighter = *smaller* (more negative) magnitude."
  says: "Magnitudes are a logarithmic brightness scale — each step of 1 magnitude is a factor of $10^{0.4} \\approx 2.512$ in flux."
  assumptions:
    - "Same photometric band (same wavelength filter)"
    - "Pogson's definition: 5 magnitudes = factor of 100 in flux"

# ===== Module 3: Stellar Structure & Evolution =====

dynamical_timescale:
  predicts: "Given mean density $\\bar{\\rho}$, it predicts the timescale for gravitational rearrangement."
  depends: "Scales as $\\tau_\\text{dyn} \\propto \\bar{\\rho}^{-1/2}$. Denser objects respond faster."
  says: "If pressure support were removed, gravity would collapse the star in roughly this time. The Sun's dynamical time is ~50 minutes."
  assumptions:
    - "Uniform density approximation (order-of-magnitude estimate)"
    - "Free-fall timescale — actual collapse is modified by pressure response"

kelvin_helmholtz:
  predicts: "Given $M$, $R$, and $L$, it predicts how long gravitational contraction alone could power the star."
  depends: "Scales as $\\tau_\\text{KH} \\propto M^2/(RL)$. More massive = more gravitational energy; more luminous = faster depletion."
  says: "The time a star could shine by slowly contracting — converting gravitational potential energy to radiation. For the Sun, ~30 Myr."
  assumptions:
    - "Only energy source is gravitational contraction"
    - "Luminosity stays approximately constant during contraction"
    - "Order-of-magnitude: uses $E_\\text{grav} \\sim GM^2/R$"

nuclear_timescale:
  predicts: "Given $M$ and $L$, it predicts how long nuclear fusion can sustain the star's luminosity."
  depends: "Scales as $\\tau_\\text{nuc} \\propto M/L$. Using $L \\propto M^{3.5}$: $\\tau_\\text{nuc} \\propto M^{-2.5}$."
  says: "Fuel divided by burn rate. The Sun's nuclear lifetime is ~10 Gyr. Massive stars live much shorter lives because L grows faster than M."
  assumptions:
    - "Hydrogen fusion with efficiency $\\varepsilon \\approx 0.007$"
    - "Only accessible core fraction $f_M \\approx 0.10$ participates in fusion for a Sun-like star"
    - "The accessible fuel fraction $f_M$ is not universal; it varies with stellar mass and internal mixing"
    - "Luminosity approximately constant during main-sequence phase"

lifetime_scaling:
  predicts: "Given a star's mass relative to the Sun, it predicts its main-sequence lifetime relative to the Sun's."
  depends: "Scales as $\\tau \\propto M^{-2.5}$. Doubling the mass reduces lifetime by $2^{2.5} \\approx 5.7\\times$."
  says: "Massive stars burn fast and die young. A $10\\,M_\\odot$ star lives only ~30 Myr; a $0.1\\,M_\\odot$ star outlasts the universe."
  assumptions:
    - "Star is on the main sequence (core hydrogen burning)"
    - "Uses $L \\propto M^{3.5}$ (exponent varies somewhat with mass range)"

hydrostatic_equilibrium:
  predicts: "Given the local density $\\rho$, enclosed mass $M(r)$, and radius $r$, it predicts the pressure gradient $dP/dr$."
  depends: "The pressure must decrease outward ($dP/dr < 0$) at a rate set by the local gravitational acceleration."
  says: "At every radius inside a star, the pressure gradient exactly balances the weight of the overlying gas. This is the foundational equation of stellar structure."
  assumptions:
    - "The star is in mechanical equilibrium (no net acceleration)"
    - "Spherical symmetry"
    - "Departures corrected on $\\tau_\\text{dyn}$ (minutes for the Sun)"

central_pressure:
  predicts: "Given $M$ and $R$, it estimates the central pressure $P_c$ of a star."
  depends: "Scales as $P_c \\propto M^2/R^4$."
  says: "A dimensional estimate from hydrostatic equilibrium — the pressure at the center must support all overlying layers."
  assumptions:
    - "Uniform density approximation"
    - "Order-of-magnitude estimate (actual $P_c$ is ~20× higher for the Sun due to central concentration)"

stellar_virial:
  predicts: "The relationship between total thermal energy $K_\\text{th}$ and gravitational potential energy $U_\\text{grav}$ in a star."
  depends: "$K_\\text{th} = -U_\\text{grav}/2$. Total energy $E = U_\\text{grav}/2 < 0$ (bound)."
  says: "In equilibrium, half the gravitational energy goes to thermal motion, half is radiated away. Losing energy makes the star *hotter* (negative heat capacity)."
  assumptions:
    - "Star is in hydrostatic equilibrium"
    - "Ideal gas (non-relativistic particles)"
    - "Time-averaged or in quasi-static equilibrium"

core_temperature:
  predicts: "Given $M$ and $R$, it estimates the core temperature $T_c$ of a star."
  depends: "Scales as $T_c \\propto M/R$. Using $R \\propto M^{0.8}$: $T_c \\propto M^{0.2}$ (weak mass dependence)."
  says: "Gravity sets the core temperature — deeper potential wells require higher temperatures for pressure support. For the Sun: $T_c \\sim 15$ MK."
  assumptions:
    - "Ideal gas in the core"
    - "Virial theorem applies"
    - "Uses the mean molecular weight $\\mu$ to connect thermal energy per particle to pressure support"
    - "Order-of-magnitude estimate: real stellar structure adds order-unity corrections from central concentration and composition gradients"

de_broglie:
  predicts: "Given a particle's momentum $p$ (or mass $m$ and velocity $v$), it predicts the particle's quantum wavelength."
  depends: "Scales as $\\lambda \\propto 1/p$. Heavier or faster particles have shorter wavelengths."
  says: "Every particle has a wave nature. When $\\lambda_\\text{dB}$ is comparable to nuclear distances (~$10^{-13}$ cm), quantum effects dominate — enabling tunneling through barriers."
  assumptions:
    - "Non-relativistic ($v \\ll c$)"
    - "Single particle (not a composite system)"

pp_chain_net:
  predicts: "The net products and energy released when four protons fuse to helium."
  depends: "Requires conditions: $T \\gtrsim 10$ MK, $\\rho \\gtrsim 100$ g/cm³."
  says: "Four hydrogen nuclei become one helium-4 nucleus plus two positrons, two neutrinos, and 26.7 MeV of released energy. The mass deficit is converted into energy."
  assumptions:
    - "Dominant pathway in stars with $M \\lesssim 1.3\\,M_\\odot$"
    - "CNO cycle dominates for more massive (hotter) stars"
    - "Rate limited by Step 1 (requires weak force + tunneling)"

mass_energy:
  predicts: "Given a mass deficit $\\Delta m$, it predicts the energy released."
  depends: "Scales as $E \\propto \\Delta m$. The constant $c^2$ is enormous: $9 \\times 10^{20}$ erg/g."
  says: "Mass and energy are equivalent. The 0.7% mass deficit in hydrogen fusion powers every main-sequence star."
  assumptions:
    - "Special relativity"
    - "$\\Delta m$ is the difference between reactant and product rest masses"

# --- Reading 4: Radiation Transport ---

mean_free_path:
  predicts: "Given opacity $\\kappa$ and density $\\rho$, it predicts the average distance a photon travels between interactions."
  depends: "Scales as $\\ell \\propto 1/(\\kappa\\rho)$. Higher density or opacity means shorter steps."
  says: "The photon's 'step size' in its random walk through the star. In the solar core, $\\ell \\approx 0.02~\\text{cm}$ — a photon barely moves before scattering again."
  assumptions:
    - "Homogeneous medium (locally uniform $\\kappa$ and $\\rho$)"
    - "Opacity $\\kappa$ includes all interaction processes (scattering + absorption)"

random_walk:
  predicts: "Given step size $\\ell$ and number of steps $N$, it predicts the net displacement $d$."
  depends: "Scales as $d \\propto \\sqrt{N}$. To double the distance, you need four times as many steps."
  says: "Random walks are devastatingly inefficient. Energy released in the solar core is carried outward through roughly $10^{25}$ photon interactions, so the diffusion time is of order $10^5$ years, not seconds."
  assumptions:
    - "Each step is independent and random in direction"
    - "Constant step size (uniform medium)"
    - "Three-dimensional random walk (the $\\sqrt{N}$ result holds in any dimension)"

radiative_diffusion_luminosity:
  predicts: "Given the opacity $\\kappa$, density $\\rho$, temperature profile $T(r)$, and radius $r$, it predicts the luminosity carried outward by radiative diffusion."
  depends: "Scales as $L \\propto r^2 c\\,|d(aT^4)/dr|/(\\kappa\\rho)$. Steeper temperature gradients or lower opacity allow faster energy flow."
  says: "This is the energy-flow version of the random walk. Photons still move at $c$ between interactions, but the net outward luminosity is throttled by opacity and the temperature gradient."
  assumptions:
    - "Radiation is the dominant transport mechanism (not convection)"
    - "Diffusion approximation (photon mean free path $\\ll r$)"
    - "Local thermodynamic equilibrium"

radiation_pressure:
  predicts: "Given temperature $T$, it predicts the pressure exerted by a radiation field in thermal equilibrium."
  depends: "Scales as $P_\\text{rad} \\propto T^4$. Doubling the temperature increases radiation pressure by $16\\times$."
  says: "Radiation exerts pressure because photons carry momentum. At low $T$, this is negligible compared to gas pressure. At high $T$ (massive star cores), radiation pressure dominates and sets the maximum stellar mass."
  assumptions:
    - "Thermal equilibrium (blackbody radiation)"
    - "Isotropic radiation field"

eddington_luminosity:
  predicts: "Given stellar mass $M$ and opacity $\\kappa$, it predicts the maximum luminosity a star can sustain in hydrostatic equilibrium."
  depends: "Scales as $L_\\text{Edd} \\propto M/\\kappa$. More massive stars tolerate higher luminosities."
  says: "When radiation force on the gas rivals gravity, stars approach a luminosity ceiling. Near that regime, radiation pressure and mass loss strongly reshape the structure and help set the upper stellar-mass scale."
  assumptions:
    - "Spherically symmetric"
    - "Electron-scattering opacity dominates ($\\kappa \\approx 0.34~\\text{cm}^2/\\text{g}$)"
    - "Steady state (no time-dependent effects)"

# --- Reading 5: Stellar Structure & Scalings ---

mass_conservation:
  predicts: "Given the density profile $\\rho(r)$, it determines how enclosed mass $M(r)$ grows with radius."
  depends: "Scales as $dM/dr \\propto r^2 \\rho$. Larger shells at greater radii contribute more mass per unit thickness."
  says: "This is geometry, not physics — mass enclosed increases as you add spherical shells. It is one of the four stellar structure equations."
  assumptions:
    - "Spherical symmetry"
    - "No mass loss or gain (steady state)"

radiative_transport:
  predicts: "Given opacity $\\kappa$, density $\\rho$, temperature $T$, and luminosity $L(r)$, it determines the radiative temperature gradient $\\left(dT/dr\\right)_\\text{rad}$, meaning the gradient radiation alone would require."
  depends: "Scales as $\\left|\\left(dT/dr\\right)_\\text{rad}\\right| \\propto \\kappa \\rho L / (T^3 r^2)$. Higher opacity or luminosity steepens the required radiative gradient."
  says: "Energy flows from hot center to cool surface by radiative diffusion. If the required radiative gradient is too steep, radiation becomes inefficient and convection takes over."
  assumptions:
    - "Energy transported by radiation (not convection)"
    - "Local thermodynamic equilibrium"
    - "Diffusion approximation (photon mean free path $\\ll$ stellar radius)"

energy_generation:
  predicts: "Given the nuclear energy generation rate $\\varepsilon(r)$ and density $\\rho(r)$, it determines how luminosity $L(r)$ increases with radius."
  depends: "Scales as $dL/dr \\propto r^2 \\rho \\varepsilon$. Luminosity grows only in regions where nuclear reactions occur."
  says: "The luminosity you see at the surface equals the total nuclear energy generated in the core. Outside the core, $\\varepsilon = 0$ and luminosity is constant."
  assumptions:
    - "Steady state (nuclear timescale $\\gg$ dynamical timescale)"
    - "Spherical symmetry"
    - "No significant neutrino losses (for pp-chain, ~2% lost to neutrinos)"

lum_mass_scaling:
  predicts: "Given stellar mass $M$ and opacity $\\kappa$, it predicts the luminosity from dimensional analysis of the stellar structure equations."
  depends: "Scales as $L \\propto M^3/\\kappa$. With Kramers' opacity: $L \\propto M^{3.5}\\text{--}M^4$."
  says: "The stellar structure equations explain why the observed main-sequence mass-luminosity relation is so steep. For stars of similar composition, mass is the dominant control parameter."
  assumptions:
    - "Main-sequence star (core hydrogen burning)"
    - "Radiative energy transport (not convective)"
    - "Constant opacity gives $L \\propto M^3$; realistic opacity steepens to $\\sim M^{3.5}$"

# --- Reading 6: Mass Limits ---

heisenberg:
  predicts: "Given the uncertainty in position $\\Delta x$, it predicts the minimum uncertainty in momentum $\\Delta p$ (or vice versa)."
  depends: "Scales as $\\Delta p \\propto 1/\\Delta x$. Halving the confinement doubles the minimum momentum."
  says: "Confining a particle to a smaller region forces it to have larger momentum — and therefore larger kinetic energy. This is the origin of degeneracy pressure: gravity confines electrons, but confinement creates pressure that resists further compression."
  assumptions:
    - "Fundamental quantum mechanical relation — no approximations"
    - "$\\hbar/2$ is the minimum product; actual uncertainties may be larger"
    - "Applies to any conjugate pair (position-momentum, energy-time)"

hydrogen_burning_minimum:
  predicts: "The minimum mass for sustained hydrogen fusion."
  depends: "Set by when electron degeneracy halts contraction before core reaches $T \\sim 3 \\times 10^6$ K."
  says: "Below $\\sim 0.08\\,M_\\odot$, electron degeneracy halts contraction before the core reaches hydrogen-fusion temperatures. Objects below this limit are brown dwarfs."
  assumptions:
    - "Solar composition (hydrogen-rich)"
    - "Detailed value depends on opacity, composition, and equation of state"
    - "Scales with fundamental constants: $\\hbar$, $c$, $G$, $m_p$, $\\alpha_\\text{EM}$"

# --- Reading 7: Low-Mass Evolution ---

triple_alpha:
  predicts: "Three helium-4 nuclei fuse to form one carbon-12 nucleus plus a gamma-ray photon."
  depends: "Requires $T \\gtrsim 10^8$ K and $\\rho \\gtrsim 10^4$ g/cm³. Rate scales as $\\varepsilon_{3\\alpha} \\propto T^{40}$."
  says: "The only way to bridge the mass-5 and mass-8 gaps in nuclear stability. Requires a specific nuclear resonance in $^{12}$C (the Hoyle state at 7.65 MeV) — without which carbon would be exceedingly rare and carbon-based life impossible."
  assumptions:
    - "Occurs in red giant cores and horizontal branch stars"
    - "Two-step process: $2\\alpha \\rightarrow\\ ^8$Be (unstable) + $\\alpha \\rightarrow\\ ^{12}$C"
    - "Competes with alpha capture: $^{12}$C + $\\alpha \\rightarrow\\ ^{16}$O"

# --- Reading 8: Degeneracy Pressure & Chandrasekhar ---

degeneracy_pressure:
  predicts: "Given electron number density $n_e$, it predicts the pressure from quantum confinement (Pauli exclusion)."
  depends: "Scales as $P \\propto n_e^{5/3}$ (non-relativistic). No temperature dependence."
  says: "Compressing fermions forces them into higher momentum states (Pauli exclusion + Heisenberg uncertainty). The resulting pressure exists even at $T = 0$ — fundamentally different from thermal pressure. This is what holds up white dwarfs."
  assumptions:
    - "Non-relativistic electrons ($p_F \\ll m_e c$)"
    - "Fully degenerate gas ($T \\ll T_F$)"
    - "Relativistic regime: $P \\propto n_e^{4/3}$ (softer — leads to Chandrasekhar limit)"

chandrasekhar_mass:
  predicts: "The maximum mass of a white dwarf supported by electron degeneracy pressure."
  depends: "Built from four fundamental constants: $\\hbar$, $c$, $G$, $m_p$. Independent of temperature and radius; the exact value also depends on composition through the electron fraction $Y_e$."
  says: "Above $1.44\\,M_\\odot$ for a C/O white dwarf, relativistic electrons cannot generate enough degeneracy pressure to balance gravity. Stable white-dwarf solutions disappear in the idealized model. This is the dividing line between white dwarfs and neutron stars/black holes."
  assumptions:
    - "Relativistic electron degeneracy pressure"
    - "Cold equation of state (temperature-independent)"
    - "Exact value depends on $Y_e$: $M_\\text{Ch} = 5.83\\,Y_e^2\\,M_\\odot \\approx 1.44\\,M_\\odot$ for $Y_e = 0.5$ (C/O)"

wd_mass_radius:
  predicts: "Given a white dwarf's mass, it predicts the radius (inversely)."
  depends: "Scales as $R \\propto M^{-1/3}$. More massive white dwarfs are smaller."
  says: "The opposite of ordinary objects: adding mass shrinks the star because stronger gravity compresses the degenerate electrons harder. This trend holds for non-relativistic white dwarfs and breaks down near the Chandrasekhar limit."
  assumptions:
    - "Non-relativistic regime (well below Chandrasekhar limit)"
    - "Zero-temperature (degenerate) equation of state"
    - "Breaks down as $M \\rightarrow M_\\text{Ch}$ (relativistic corrections)"

# --- Reading 10: Neutron Stars & Black Holes ---

tov_limit:
  predicts: "The maximum mass of a neutron star supported by neutron degeneracy pressure."
  depends: "Depends on the equation of state of nuclear matter at supra-nuclear density — currently uncertain."
  says: "Above $\\sim 2\\text{--}2.5\\,M_\\odot$, no known force can resist gravity. The collapse produces a black hole. The analogue of the Chandrasekhar limit for neutron stars."
  assumptions:
    - "General relativistic hydrostatic equilibrium (TOV equation)"
    - "Cold nuclear matter equation of state (uncertain above nuclear density)"
    - "Most massive observed NS: $2.08 \\pm 0.07\\,M_\\odot$ (PSR J0740+6620)"
