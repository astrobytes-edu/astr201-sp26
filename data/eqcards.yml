# Equation Meaning Scaffolds
# Each entry: predicts, depends, says, assumptions (optional)
# Usage: Referenced by equations.yml via card field

kepler_period:
  predicts: "Given $r, M$, it predicts the orbital period $P$."
  depends: "Scales as $P \\propto r^{3/2}$ and $P \\propto M^{-1/2}$."
  says: "Farther orbits take much longer; more central mass makes orbits faster."
  assumptions:
    - "Orbit is approximately circular"
    - "Central mass dominates (two-body approximation)"
    - "Newtonian gravity"

schwarzschild_radius:
  predicts: "Given $M$, it predicts the event horizon radius $R_{\\mathrm{sch}}$."
  depends: "Scales as $R_{\\mathrm{sch}} \\propto M$."
  says: "More massive objects have larger event horizons—linearly."
  assumptions:
    - "Non-rotating (Schwarzschild, not Kerr)"
    - "Uncharged"
    - "Spherically symmetric"

newton_gravity:
  predicts: "Given $M$, $m$, and $r$, it predicts the gravitational force $F$."
  depends: "Scales as $F \\propto Mm/r^2$."
  says: "Gravity weakens with distance squared; stronger between more massive objects."
  assumptions:
    - "Point masses or spherically symmetric"
    - "Newtonian (non-relativistic)"
    - "No other forces acting"

stefan_boltzmann:
  predicts: "Given $R$ and $T$, it predicts the luminosity $L$."
  depends: "Scales as $L \\propto R^2 T^4$."
  says: "Luminosity depends on surface area ($R^2$) and temperature ($T^4$). Double the temperature, get 16× the luminosity."
  assumptions:
    - "Blackbody radiation"
    - "Spherical, uniformly radiating surface"
    - "Effective surface temperature"

flux_luminosity_distance:
  predicts: "Given $L$ and $d$, it predicts the observed flux $F$ at the detector."
  depends: "Scales as $F \\propto L$ and $F \\propto d^{-2}$."
  says: "Apparent brightness mixes intrinsic power and distance; to infer $L$ from $F$, you must also know $d$."
  assumptions:
    - "Approximately isotropic emission (radiates equally in all directions)"
    - "Negligible absorption/scattering between source and observer"

lookback_time:
  predicts: "Given a distance $d$, it predicts the light travel time $t$ (the time between emission and detection)."
  depends: "Scales as $t \\propto d$ and $t \\propto c^{-1}$."
  says: "Light takes time to travel; looking farther away means seeing older light."
  assumptions:
    - "Light travels in a straight line at speed $c$ (simplified picture)"
    - "Ignores cosmological expansion and strong gravitational time-delay effects"

wave_relation:
  predicts: "Given any two of $c$, $\\lambda$, $\\nu$, it predicts the third."
  depends: "$\\lambda \\propto \\nu^{-1}$ (inverse relationship at fixed $c$)."
  says: "Wavelength and frequency are two ways of describing the same wave; longer wavelength means lower frequency."
  assumptions:
    - "Light travels in vacuum at speed $c$"
    - "Applies to all electromagnetic radiation"

photon_energy:
  predicts: "Given wavelength $\\lambda$ (or frequency $\\nu$), it predicts the energy $E$ of a single photon."
  depends: "$E \\propto \\nu$ and $E \\propto \\lambda^{-1}$."
  says: "Shorter wavelength = higher energy photon. The constant $h$ signals quantum mechanics is at work."
  assumptions:
    - "Light comes in discrete packets (photons)"
    - "Each photon carries energy proportional to its frequency"
    - "This is a quantum mechanical result—classical physics cannot predict it"

wien_displacement:
  predicts: "Given temperature $T$, it predicts the peak wavelength $\\lambda_{\\text{peak}}$ of thermal emission."
  depends: "$\\lambda_{\\text{peak}} \\propto T^{-1}$."
  says: "Hotter objects peak at shorter wavelengths (bluer); cooler objects peak at longer wavelengths (redder)."
  assumptions:
    - "Object radiates as a blackbody (or approximately so)"
    - "Applies to thermal (temperature-driven) radiation"

centripetal_acceleration:
  predicts: "How much acceleration is needed to maintain circular motion at speed $v$ and radius $r$"
  depends: "Speed ($v$), radius ($r$)"
  says: "Faster motion or tighter curves require more acceleration toward the center"
  assumptions:
    - "Circular (not elliptical) motion"
    - "Constant speed"

centripetal_force:
  predicts: "The net inward force required for circular motion"
  depends: "Mass ($m$), speed ($v$), radius ($r$)"
  says: "This is a requirement, not a new force type—some real force (gravity, tension, friction) must supply it"
  assumptions:
    - "Circular motion"
    - "Constant speed"

orbital_velocity:
  predicts: "The speed needed for a stable circular orbit at radius $r$ around mass $M$"
  depends: "Central mass ($M$), orbital radius ($r$)"
  says: "Closer orbits require higher speeds; the orbiting object's mass doesn't matter"
  assumptions:
    - "Circular orbit"
    - "$m \\ll M$ (orbiter much less massive than central body)"

escape_velocity:
  predicts: "The minimum speed to escape a gravitational field from radius $r$"
  depends: "Central mass ($M$), starting radius ($r$)"
  says: "Equal to $\\sqrt{2}$ times orbital velocity; escaping mass doesn't matter"
  assumptions:
    - "No additional forces (drag, thrust)"
    - "Starting from rest at infinity = zero total energy"

gravitational_pe:
  predicts: "The energy stored in gravitational position relative to infinity"
  depends: "Both masses ($M$, $m$), separation ($r$)"
  says: "Negative because we define $U=0$ at infinity; more negative = deeper in the gravity well"
  assumptions:
    - "Point masses (or spherically symmetric)"
    - "Reference: $U=0$ at $r=\\infty$"

angular_momentum:
  predicts: "A conserved quantity for motion under central forces"
  depends: "Mass ($m$), radius ($r$), tangential velocity ($v$) or angular velocity ($\\dot{\\phi}$)"
  says: "Conserved because central forces exert no torque; explains Kepler's Second Law"
  assumptions:
    - "Central force (points toward/away from a fixed center)"
    - "No external torques"

areal_velocity:
  predicts: "The rate at which an orbiting body sweeps out area"
  depends: "Angular momentum ($L$), mass ($m$)"
  says: "Constant for any orbit under gravity—this IS Kepler's Second Law"
  assumptions:
    - "Central force (gravity)"
    - "Two-body problem"

virial_theorem:
  predicts: "The ratio of kinetic to potential energy in bound, equilibrium systems"
  depends: "Time-averaged kinetic energy $\\langle K \\rangle$, potential energy $\\langle U \\rangle$"
  says: "In equilibrium, kinetic energy is half the magnitude of potential energy"
  assumptions:
    - "Gravitationally bound system"
    - "In equilibrium OR time-averaged over complete orbits"
    - "Does NOT apply instant-by-instant in elliptical orbits"

total_mechanical_energy:
  predicts: "Whether an orbit is bound ($E<0$), unbound ($E>0$), or marginally bound ($E=0$)"
  depends: "Kinetic energy ($K$), potential energy ($U$)"
  says: "Energy is conserved; $K$ and $U$ trade off but total stays constant"
  assumptions:
    - "No non-gravitational forces"
    - "Isolated two-body system"

bound_orbit_energy:
  predicts: "The total energy of any bound (elliptical or circular) orbit"
  depends: "Both masses ($M$, $m$), semi-major axis ($a$)"
  says: "Total energy depends only on $a$, not on eccentricity"
  assumptions:
    - "Bound orbit ($E<0$)"
    - "Two-body gravitational system"
