# ============================================================
# Course Parameters (Single Source of Truth)
# ============================================================
# Change these values once; they propagate everywhere via
# {{< meta params.X >}} in any .qmd file.

params:
  # Course identity
  course-code: "ASTR 201"
  course-title: "Astronomy for Science Majors"
  semester: "Spring 2026"

  # Instructor
  instructor: "Dr. Anna Rosen"
  email: "alrosen@sdsu.edu"
  office: "Physics 239"
  office-hours: "Fridays 11 am–1 pm (and by appointment)"

  # Class logistics
  class-time: "Tues/Thurs 12:30–1:45 pm"
  location: "LH 245"

  # URLs
  website-url: "https://astrobytes-edu.github.io/astr201-sp26"
  canvas-url: "https://sdsu.instructure.com"

  # Textbook
  textbook: "Stan Owocki, *Fundamentals of Astrophysics*, 2nd Edition"
  textbook-isbn: "9781009618007"

  # Assets (for includes)
  logo: "assets/astr201-logo.png"

# ============================================================

# Profiles for different audiences
# Usage: quarto render --profile instructor
profile:
  default: student
  group:
    - student
    - instructor

# ============================================================

project:
  type: website
  render:
    - index.qmd
    - course-info/*.qmd
    - handouts/*.qmd
    - modules/index.qmd
    - modules/module-*/index.qmd
    - modules/module-*/slides/*.qmd
    - modules/module-*/readings/*.qmd
    - homework/*.qmd
    - homework/solutions/*.qmd
    - exams/*.qmd
    - "!exams/_prep/**"
    - explore/*.qmd
  brand: _brand.yml

website:
  title: "ASTR 201: Astronomy for Science Majors"
  favicon: assets/astr201-favicon.png
  announcement:
    icon: info-circle
    dismissable: true
    content: "**This week:** [Homework 8](/homework/astr201-hw8.qmd) is now posted and due Tuesday, April 14 at 11:59 pm. The [Homework 7 solutions](/homework/solutions/astr201-hw7-solutions.qmd) are available for review, and [Exam 2](/exams/index.qmd) is Tuesday, April 21 covering everything through Module 3. See the [Homework](/homework/index.qmd) and [Exams](/exams/index.qmd) pages for details."
